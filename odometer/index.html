<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positionssystemet – Trippmätare</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #f6f4ff;
  --surface: #ffffff;
  --surface2:#eae6ff;
  --border:  #ccc5f0;
  --text:    #100e28;
  --muted:   #585078;
  --accent:  #306BF0;
  --accent2: #EC6095;
  --shadow:  rgba(48,107,240,.12);
  --gradient:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);
  --DH: 60px;
  --DW: 56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sora',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 1rem 3rem;
  overflow-x:hidden;
  position:relative;
}

/* Ambient blobs */
.blob{position:fixed;border-radius:50%;filter:blur(72px);opacity:.22;pointer-events:none;z-index:0;}
.blob-1{width:340px;height:340px;background:#66C7C2;top:-80px;left:-100px;}
.blob-2{width:280px;height:280px;background:#F4A261;top:200px;right:-80px;}
.blob-3{width:220px;height:220px;background:#EC6095;bottom:60px;left:60px;}

/* Header */
header{
  width:100%;height:52px;
  background:var(--gradient);
  display:flex;align-items:center;
  padding:0 1.4rem;
  margin-bottom:1.6rem;
  position:relative;z-index:10;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
header h1{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:700;color:#fff;letter-spacing:.02em;}
.header-chip{
  margin-left:10px;background:rgba(255,255,255,.22);color:#fff;
  font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:99px;
  letter-spacing:.04em;text-transform:uppercase;
}

/* Glass card */
.glass-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  border-radius:20px;
  box-shadow:0 8px 40px var(--shadow);
  padding:1.2rem 1.6rem 1rem;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  margin-bottom:1rem;
}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#d4813a,#F4A261);
  border-radius:20px 20px 0 0;
}

/* Toggle pills */
.toggle-bar{display:flex;gap:6px;margin-bottom:2px;}
.toggle-pill{
  font-size:.65rem;font-weight:600;font-family:'Sora',sans-serif;
  padding:3px 10px;border-radius:99px;
  border:1.5px solid var(--border);
  background:rgba(255,255,255,.6);color:var(--muted);
  cursor:pointer;transition:all .15s;user-select:none;
}
.toggle-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.toggle-pill:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Label rows (togglable) */
.label-row,.value-label-row{
  display:flex;align-items:flex-end;
  max-height:0;overflow:hidden;
  transition:max-height .25s ease;
}
.label-row.visible,.value-label-row.visible{max-height:36px;}
.place-lbl{
  width:var(--DW);text-align:center;
  font-size:.52rem;font-weight:600;color:var(--muted);
  letter-spacing:.03em;line-height:1.25;white-space:normal;padding:0 1px;
}
.place-lbl.dec{color:var(--accent2);}
.place-val-lbl{
  width:var(--DW);text-align:center;
  font-size:.58rem;font-weight:700;color:var(--accent);
  font-family:'Montserrat',sans-serif;
}
.place-val-lbl.dec{color:var(--accent2);}
.lbl-spacer{flex-shrink:0;}

/* +/- rows */
.ctrl-row{display:flex;align-items:center;}
.drum-col{width:var(--DW);display:flex;justify-content:center;}
.dot-col,.sep-col{flex-shrink:0;}

.drum-btn{
  width:36px;height:24px;
  border:1.5px solid var(--border);
  background:rgba(255,255,255,.7);
  border-radius:6px;cursor:pointer;
  font-size:1rem;font-weight:700;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,border-color .1s,transform .08s;
  font-family:'Sora',sans-serif;line-height:1;user-select:none;
}
.drum-btn:hover{background:var(--surface2);border-color:var(--accent);}
.drum-btn:active{transform:scale(.9);}
.drum-btn.minus{color:var(--accent2);}
.drum-btn.minus:hover{border-color:var(--accent2);}

/* Drum shell */
.drums-row{
  display:flex;align-items:center;
  background:#18131f;
  border-radius:12px;padding:6px 10px;
  box-shadow:inset 0 4px 16px rgba(0,0,0,.65),0 3px 12px rgba(0,0,0,.25);
  position:relative;
}
.drums-row::after{
  content:'';position:absolute;left:10px;right:10px;top:50%;
  transform:translateY(-50%);height:var(--DH);
  border-top:1px solid rgba(255,255,255,.16);
  border-bottom:1px solid rgba(255,255,255,.16);
  pointer-events:none;z-index:4;
}
.drum{width:var(--DW);height:var(--DH);overflow:hidden;position:relative;}
.drum::before,.drum::after{content:'';position:absolute;left:0;right:0;height:16px;z-index:3;pointer-events:none;}
.drum::before{top:0;background:linear-gradient(to bottom,rgba(24,19,31,.93),transparent);}
.drum::after {bottom:0;background:linear-gradient(to top,rgba(24,19,31,.93),transparent);}

.tape{position:absolute;width:100%;will-change:transform;}
.tape-digit{
  width:100%;height:var(--DH);
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;font-weight:700;
  font-family:'Montserrat',sans-serif;
  color:rgba(240,236,252,.32);user-select:none;
}
.tape-digit.lit{color:#fff;}

.dec-dot{
  width:22px;display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;font-weight:700;color:#F4A261;
  flex-shrink:0;padding-bottom:4px;
}
.drum-sep{width:1px;height:38px;background:rgba(255,255,255,.1);flex-shrink:0;align-self:center;}

/* Op section */
.op-section{
  position:relative;z-index:1;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.68);
  border-radius:16px;
  box-shadow:0 4px 20px var(--shadow);
  padding:.8rem 1.2rem .75rem;
  width:100%;max-width:620px;
  margin-bottom:.7rem;
}
.op-title{
  font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin-bottom:.45rem;
}
.op-row{display:flex;flex-wrap:wrap;gap:5px;}
.op-btn{
  height:30px;padding:0 .8rem;border-radius:8px;
  font-family:'Sora',sans-serif;font-size:.78rem;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;
  transition:opacity .12s,transform .08s,background .12s;
  white-space:nowrap;
}
.op-btn:active{transform:scale(.93);}
.op-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.op-btn.add{background:#e8f0fe;color:#1a56db;border-color:#c3d3fc;}
.op-btn.add:hover:not(:disabled){background:#d0e2fd;}
.op-btn.sub{background:#fde8f1;color:#b03070;border-color:#f9c2d9;}
.op-btn.sub:hover:not(:disabled){background:#fbd0e4;}
.op-btn.mul{background:#e8f7e8;color:#166534;border-color:#bbdebb;}
.op-btn.mul:hover:not(:disabled){background:#d1f0d1;}
.op-btn.div{background:#fff4e5;color:#92400e;border-color:#f8d9a8;}
.op-btn.div:hover:not(:disabled){background:#fdebc7;}

/* Input panel */
.input-panel{
  position:relative;z-index:1;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.68);
  border-radius:16px;
  box-shadow:0 4px 20px var(--shadow);
  padding:.6rem 1.1rem;
  width:100%;max-width:620px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.input-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.input-label{font-size:.7rem;color:var(--muted);font-weight:600;white-space:nowrap;}
.divider-v{width:1px;height:22px;background:var(--border);margin:0 3px;flex-shrink:0;}
input[type="text"]{
  width:82px;height:28px;
  border:1.5px solid var(--border);border-radius:7px;
  padding:0 .45rem;
  font-family:'Sora',sans-serif;font-size:.82rem;
  color:var(--text);background:rgba(255,255,255,.8);
  outline:none;transition:border-color .15s;
}
input[type="text"]:focus{border-color:var(--accent);}
.action-btn{
  height:28px;padding:0 .7rem;
  border:1.5px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:7px;font-family:'Sora',sans-serif;font-size:.72rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:opacity .12s,transform .08s;
}
.action-btn:hover{opacity:.85;}
.action-btn:active{transform:scale(.96);}
.action-btn:disabled{opacity:.4;cursor:not-allowed;}
.reset-btn{background:transparent;border-color:var(--border);color:var(--muted);}
.reset-btn:hover{border-color:var(--accent2);color:var(--accent2);opacity:1;}
.error-msg{font-size:.7rem;color:#e02020;min-height:1em;}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<header>
  <h1>Positionssystemet</h1>
  <span class="header-chip">För läraren</span>
</header>

<div class="glass-card">
  <div class="toggle-bar">
    <button class="toggle-pill" id="pillNames"  onclick="toggleNames()">Positionsnamn</button>
    <button class="toggle-pill" id="pillValues" onclick="toggleValues()">Positionsvärden</button>
  </div>
  <div class="label-row"       id="labelRow"></div>
  <div class="value-label-row" id="valueLabelRow"></div>
  <div class="ctrl-row"  id="plusRow"></div>
  <div class="drums-row" id="drumsRow"></div>
  <div class="ctrl-row"  id="minusRow"></div>
</div>

<div class="op-section">
  <div class="op-title">Addera &amp; Subtrahera</div>
  <div class="op-row" id="addSubRow"></div>
</div>

<div class="op-section">
  <div class="op-title">Multiplicera &amp; Dividera (tiotalsfaktorer)</div>
  <div class="op-row" id="mulDivRow"></div>
</div>

<div class="input-panel">
  <div class="input-row">
    <span class="input-label">Ange tal:</span>
    <input type="text" id="setInput" autocomplete="off">
    <button class="action-btn" onclick="applySet()">Sätt</button>
    <button class="action-btn reset-btn" onclick="resetAll()">Nollställ</button>
    <div class="divider-v"></div>
    <span class="input-label">Beräkna:</span>
    <input type="text" id="addInput" autocomplete="off">
    <button class="action-btn" id="addBtn" onclick="startCustomAdd()">Utför</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const PLACE_VALUES    = [100000,10000,1000,100,10,1,0.1,0.01,0.001];
const PLACE_NAMES     = ['Hundra\u00adtusental','Tio\u00adtusental','Tusental','Hundratal','Tiotal','Ental','Tiondel','Hundradel','Tusendel'];
const PLACE_IS_DEC    = [false,false,false,false,false,false,true,true,true];
const PLACE_VAL_LBLS  = ['100\u202f000','10\u202f000','1\u202f000','100','10','1','0,1','0,01','0,001'];
const DH              = 60; // px — matches --DH

// ── State ────────────────────────────────────────────────────────────────────
// digits[0] = hundratusental, digits[8] = tusendel
let digits     = [0,0,0,0,0,0,0,0,0];
let busy       = false;
let showNames  = false;
let showVals   = false;

// ── Toggle pills ─────────────────────────────────────────────────────────────
function toggleNames() {
  showNames = !showNames;
  document.getElementById('pillNames').classList.toggle('active', showNames);
  document.getElementById('labelRow').classList.toggle('visible', showNames);
}
function toggleValues() {
  showVals = !showVals;
  document.getElementById('pillValues').classList.toggle('active', showVals);
  document.getElementById('valueLabelRow').classList.toggle('visible', showVals);
}

// ── Build DOM ────────────────────────────────────────────────────────────────
function buildUI() {
  buildLabelRows();
  buildDrumRows();
  buildOpButtons();
}

function insertSpacer(parent, w) {
  const el = document.createElement('div');
  el.className = 'lbl-spacer';
  el.style.width = w;
  parent.appendChild(el);
}

function buildLabelRows() {
  const lr  = document.getElementById('labelRow');
  const vlr = document.getElementById('valueLabelRow');
  for (let i = 0; i < 9; i++) {
    if (i === 3) { insertSpacer(lr,'10px'); insertSpacer(vlr,'10px'); }
    if (i === 6) { insertSpacer(lr,'22px'); insertSpacer(vlr,'22px'); }
    const cls  = 'place-lbl'     + (PLACE_IS_DEC[i] ? ' dec' : '');
    const vcls = 'place-val-lbl' + (PLACE_IS_DEC[i] ? ' dec' : '');
    lr.insertAdjacentHTML('beforeend',  `<div class="${cls}">${PLACE_NAMES[i]}</div>`);
    vlr.insertAdjacentHTML('beforeend', `<div class="${vcls}">${PLACE_VAL_LBLS[i]}</div>`);
  }
}

function buildDrumRows() {
  const plusRow  = document.getElementById('plusRow');
  const drumsRow = document.getElementById('drumsRow');
  const minusRow = document.getElementById('minusRow');

  for (let i = 0; i < 9; i++) {
    // separators
    if (i === 3) {
      ['plusRow','drumsRow','minusRow'].forEach(id => {
        const el = document.createElement('div');
        if (id === 'drumsRow') { el.className = 'drum-sep'; }
        else { el.className = 'sep-col'; el.style.width = '10px'; }
        document.getElementById(id).appendChild(el);
      });
    }
    if (i === 6) {
      const dot = document.createElement('div');
      dot.className = 'dec-dot'; dot.textContent = ',';
      drumsRow.appendChild(dot);
      ['plusRow','minusRow'].forEach(id => {
        const el = document.createElement('div');
        el.className = 'dot-col'; el.style.width = '22px';
        document.getElementById(id).appendChild(el);
      });
    }

    // + button
    const pc = document.createElement('div'); pc.className = 'drum-col';
    const pb = document.createElement('button'); pb.className = 'drum-btn plus'; pb.textContent = '+';
    pb.addEventListener('click', () => userStep(i, 1));
    pc.appendChild(pb); plusRow.appendChild(pc);

    // drum
    const drum = document.createElement('div'); drum.className = 'drum'; drum.id = `d${i}`;
    drum.appendChild(makeTape(0));
    drumsRow.appendChild(drum);

    // − button
    const mc = document.createElement('div'); mc.className = 'drum-col';
    const mb = document.createElement('button'); mb.className = 'drum-btn minus'; mb.textContent = '−';
    mb.addEventListener('click', () => userStep(i, -1));
    mc.appendChild(mb); minusRow.appendChild(mc);
  }
}

function buildOpButtons() {
  const addSubRow = document.getElementById('addSubRow');
  const mulDivRow = document.getElementById('mulDivRow');

  [
    { label:'+1000', val:1000 }, { label:'+100', val:100 }, { label:'+10', val:10 },
    { label:'+1',    val:1    }, { label:'+0,1', val:0.1 }, { label:'+0,01', val:0.01 },
    { label:'−0,01', val:-0.01},{ label:'−0,1',  val:-0.1}, { label:'−1',   val:-1   },
    { label:'−10',   val:-10  },{ label:'−100',  val:-100}, { label:'−1000',val:-1000 },
  ].forEach(op => {
    const btn = document.createElement('button');
    btn.className = 'op-btn ' + (op.val > 0 ? 'add' : 'sub');
    btn.textContent = op.label;
    btn.addEventListener('click', () => runDelta(op.val));
    addSubRow.appendChild(btn);
  });

  [
    { label:'× 1000', f:1000 }, { label:'× 100', f:100 }, { label:'× 10', f:10 },
    { label:'÷ 10',   f:0.1  }, { label:'÷ 100', f:0.01}, { label:'÷ 1000', f:0.001 },
  ].forEach(op => {
    const btn = document.createElement('button');
    btn.className = 'op-btn ' + (op.f >= 1 ? 'mul' : 'div');
    btn.textContent = op.label;
    btn.addEventListener('click', () => runMultiply(op.f));
    mulDivRow.appendChild(btn);
  });
}

// ── Tape construction ─────────────────────────────────────────────────────────
// 11 cells: 0–9 then 0 again (trailing "0" enables smooth 9→0 wrap animation)
function makeTape(activeDigit) {
  const tape = document.createElement('div');
  tape.className = 'tape';
  for (let d = 0; d <= 10; d++) {
    const cell = document.createElement('div');
    cell.className = 'tape-digit';
    const v = d % 10;
    cell.textContent = v;
    if (v === activeDigit && d < 10) cell.classList.add('lit');
    tape.appendChild(cell);
  }
  tape.style.transition = 'none';
  tape.style.transform  = `translateY(${-activeDigit * DH}px)`;
  return tape;
}

// ── Animate one drum one step ─────────────────────────────────────────────────
function animateDrum(i, dir) {
  return new Promise(resolve => {
    const drum = document.getElementById(`d${i}`);
    const cur  = digits[i];
    const next = (cur + dir + 10) % 10;
    const tape = drum.querySelector('.tape');

    // Compute start/end Y
    let startY, endY;
    if (dir > 0) {
      // increasing: tape scrolls upward (Y decreases)
      startY = -cur * DH;
      endY   = (cur === 9) ? -10 * DH : -(cur + 1) * DH;
    } else {
      // decreasing: tape scrolls downward (Y increases)
      startY = (cur === 0) ? DH : -cur * DH;
      endY   = (cur === 0) ? 0  : -(cur - 1) * DH;
    }

    // Snap to start, highlight current
    tape.style.transition = 'none';
    tape.style.transform  = `translateY(${startY}px)`;
    tape.querySelectorAll('.tape-digit').forEach((el, idx) => {
      el.classList.toggle('lit', idx % 10 === cur && idx < 10);
    });

    tape.getBoundingClientRect(); // force reflow

    // Animate to end
    tape.style.transition = 'transform 0.19s cubic-bezier(0.22,0.8,0.3,1)';
    tape.style.transform  = `translateY(${endY}px)`;

    let done = false;
    const finish = () => {
      if (done) return; done = true;
      digits[i] = next;
      tape.style.transition = 'none';
      tape.style.transform  = `translateY(${-next * DH}px)`;
      tape.querySelectorAll('.tape-digit').forEach((el, idx) => {
        el.classList.toggle('lit', idx % 10 === next && idx < 10);
      });
      resolve();
    };
    tape.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 320); // safety fallback
  });
}

// ── Cascade: step drum i, carry if it wrapped ─────────────────────────────────
async function cascadeStep(i, dir) {
  const before = digits[i];
  await animateDrum(i, dir);
  const after = digits[i];
  const wrapped = (dir === 1 && before === 9 && after === 0)
               || (dir === -1 && before === 0 && after === 9);
  if (wrapped && i > 0) await cascadeStep(i - 1, dir);
}

// ── +/- drum button ───────────────────────────────────────────────────────────
async function userStep(i, dir) {
  if (busy) return;
  busy = true;
  await cascadeStep(i, dir);
  busy = false;
}

// ── Instant set (no animation) ────────────────────────────────────────────────
function setDigitsInstant(nd) {
  digits = [...nd];
  for (let i = 0; i < 9; i++) {
    const drum = document.getElementById(`d${i}`);
    drum.innerHTML = '';
    drum.appendChild(makeTape(digits[i]));
  }
}

// ── Parse value string → 9-digit array ───────────────────────────────────────
function parseToDigits(str) {
  str = str.trim().replace(',', '.');
  const n = parseFloat(str);
  if (isNaN(n)) return null;
  // Clamp to 0 – 999 999.999
  const r    = Math.round(Math.max(0, Math.min(n, 999999.999)) * 1000) / 1000;
  const intP = Math.floor(r);
  const frac = Math.round((r - intP) * 1000);
  return [
    Math.floor(intP / 100000) % 10,
    Math.floor(intP / 10000)  % 10,
    Math.floor(intP / 1000)   % 10,
    Math.floor(intP / 100)    % 10,
    Math.floor(intP / 10)     % 10,
    intP % 10,
    Math.floor(frac / 100)    % 10,
    Math.floor(frac / 10)     % 10,
    frac % 10,
  ];
}

// Current value from digits array (avoids float drift)
function getCurrentMilli() {
  // Return value in milli-units (integer) to avoid float arithmetic
  return digits[0]*100000000 + digits[1]*10000000 + digits[2]*1000000
       + digits[3]*100000    + digits[4]*10000    + digits[5]*1000
       + digits[6]*100       + digits[7]*10       + digits[8];
}

function milliToDigits(m) {
  // m is integer 0 – 999999999
  m = Math.max(0, Math.min(Math.round(m), 999999999));
  return [
    Math.floor(m / 100000000) % 10,
    Math.floor(m / 10000000)  % 10,
    Math.floor(m / 1000000)   % 10,
    Math.floor(m / 100000)    % 10,
    Math.floor(m / 10000)     % 10,
    Math.floor(m / 1000)      % 10,
    Math.floor(m / 100)       % 10,
    Math.floor(m / 10)        % 10,
    m % 10,
  ];
}

// ── Add/Subtract fixed amount (animate drum-by-drum, carry correctly) ─────────
async function runDelta(delta) {
  if (busy) return;
  busy = true;
  setAllOpBtns(true);

  const deltaMilli = Math.round(delta * 1000);
  const curMilli   = getCurrentMilli();
  const targetMilli = Math.max(0, Math.min(curMilli + deltaMilli, 999999999));
  const targetDig  = milliToDigits(targetMilli);
  const sign       = deltaMilli > 0 ? 1 : -1;

  // Animate each position from smallest (tusendel=8) to largest (hundratusental=0)
  // At each position, figure out how many steps to take in 'sign' direction,
  // using the actual current drum state (which includes any carries from previous drums).
  for (let i = 8; i >= 0; i--) {
    let cur  = digits[i];
    let tgt  = targetDig[i];
    // How many steps in 'sign' direction to get from cur to tgt?
    let steps;
    if (sign > 0) {
      steps = (tgt - cur + 10) % 10;
    } else {
      steps = (cur - tgt + 10) % 10;
    }
    for (let s = 0; s < steps; s++) {
      // Note: cascadeStep handles carry into i-1 automatically,
      // but here we control the loop ourselves, so use animateDrum directly
      // and handle carry below.
      await animateDrum(i, sign);
      await sleep(40);
    }
  }

  // Safety snap: ensure we're exactly at target
  setDigitsInstant(targetDig);

  setAllOpBtns(false);
  busy = false;
}

// ── Multiply / Divide by powers of ten (digits shift left or right) ───────────
async function runMultiply(factor) {
  if (busy) return;
  busy = true;
  setAllOpBtns(true);

  const curMilli    = getCurrentMilli();
  // Multiply in milli-space: ×10 = shift left 1 decimal place = ×10 in milli too
  // factor 10   → shift digits 1 left   → milli ×10
  // factor 0.1  → shift digits 1 right  → milli ÷10
  const milliShiftFactor = Math.round(factor * 1000) / 1000;
  const rawNext     = Math.round(curMilli * milliShiftFactor);
  const targetMilli = Math.max(0, Math.min(rawNext, 999999999));
  const targetDig   = milliToDigits(targetMilli);

  // Count how many position-shifts this is
  const positions = Math.round(Math.log10(Math.abs(factor)));
  const dir       = factor >= 1 ? 1 : -1; // +1 = multiply (shift left), -1 = divide

  // Animate: for each position shift, roll each drum to its new value
  // We do positions passes, each time shifting the digit array by one place
  let workDig = [...digits];
  for (let pass = 0; pass < Math.abs(positions); pass++) {
    // What does the digit array look like after one ×10 or ÷10 shift?
    let shiftedDig;
    if (dir > 0) {
      // ×10: each digit moves one column left (to higher value column)
      // d[0] gets d[1], d[1] gets d[2], ..., d[8] = 0
      shiftedDig = [...workDig.slice(1), 0];
    } else {
      // ÷10: each digit moves one column right (to lower value column)
      // d[0] = 0, d[1] gets d[0], ..., d[8] gets d[7]
      shiftedDig = [0, ...workDig.slice(0, 8)];
    }

    // Animate all drums simultaneously to their new values
    const anims = [];
    for (let i = 0; i < 9; i++) {
      if (workDig[i] !== shiftedDig[i]) {
        anims.push(animateDrumToTarget(i, workDig[i], shiftedDig[i]));
      }
    }
    // update digits array so animateDrumToTarget can read it
    digits = [...workDig];
    await Promise.all(anims);
    digits  = [...shiftedDig];
    workDig = [...shiftedDig];
    await sleep(120);
  }

  // Safety snap
  setDigitsInstant(targetDig);

  setAllOpBtns(false);
  busy = false;
}

// Animate drum i directly from 'from' to 'to' (choosing shortest rotational path)
function animateDrumToTarget(i, from, to) {
  return new Promise(async resolve => {
    if (from === to) { resolve(); return; }

    // Determine shortest direction
    const cwSteps  = (to - from + 10) % 10; // steps going +1
    const ccwSteps = (from - to + 10) % 10; // steps going -1
    const dir   = cwSteps <= ccwSteps ? 1 : -1;
    const steps = Math.min(cwSteps, ccwSteps);

    for (let s = 0; s < steps; s++) {
      await animateDrum(i, dir);
      await sleep(30);
    }
    resolve();
  });
}

// ── "Beräkna" field: step smallest place first, cascade naturally ─────────────
async function startCustomAdd() {
  if (busy) return;
  clearErr();
  const raw   = document.getElementById('addInput').value.trim().replace(',', '.');
  const delta = parseFloat(raw);
  if (isNaN(delta)) { showErr('Ange t.ex. +124 eller −50,5'); return; }
  const deltaMilli = Math.round(delta * 1000);
  if (deltaMilli === 0) return;

  busy = true;
  document.getElementById('addBtn').disabled = true;
  const sign      = deltaMilli > 0 ? 1 : -1;
  const absMilli  = Math.abs(deltaMilli);

  // Units per position in milli-space
  const milliPerPlace = [100000000,10000000,1000000,100000,10000,1000,100,10,1];

  // Step smallest-first (tusendel → hundratusental)
  for (let i = 8; i >= 0; i--) {
    const steps = Math.floor(absMilli / milliPerPlace[i]) % 10;
    for (let s = 0; s < steps; s++) {
      await cascadeStep(i, sign);
      await sleep(50);
    }
  }

  busy = false;
  document.getElementById('addBtn').disabled = false;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function setAllOpBtns(disabled) {
  document.querySelectorAll('.op-btn').forEach(b => b.disabled = disabled);
  document.getElementById('addBtn').disabled = disabled;
}

function applySet() {
  clearErr();
  const val = document.getElementById('setInput').value;
  const d   = parseToDigits(val);
  if (!d) { showErr('Ogiltigt tal, ange t.ex. 3456,78'); return; }
  setDigitsInstant(d);
}

function resetAll() {
  clearErr();
  setDigitsInstant([0,0,0,0,0,0,0,0,0]);
  document.getElementById('setInput').value = '';
  document.getElementById('addInput').value = '';
}

function showErr(msg) { document.getElementById('errorMsg').textContent = msg; }
function clearErr()   { document.getElementById('errorMsg').textContent = ''; }

document.getElementById('setInput').addEventListener('keydown', e => { if (e.key==='Enter') applySet(); });
document.getElementById('addInput').addEventListener('keydown', e => { if (e.key==='Enter') startCustomAdd(); });

buildUI();
</script>
