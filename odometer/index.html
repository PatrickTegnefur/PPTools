<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Positionssystemet – Trippmätare</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #f6f4ff;
  --surface: #ffffff;
  --surface2:#eae6ff;
  --border:  #ccc5f0;
  --text:    #100e28;
  --muted:   #585078;
  --accent:  #306BF0;
  --accent2: #EC6095;
  --shadow:  rgba(48,107,240,.12);
  --gradient:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);
  --DH: 56px;
  --DW: 50px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Sora',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:0 1rem 3rem;
  overflow-x:hidden;position:relative;
}
.blob{position:fixed;border-radius:50%;filter:blur(72px);opacity:.22;pointer-events:none;z-index:0;}
.blob-1{width:340px;height:340px;background:#66C7C2;top:-80px;left:-100px;}
.blob-2{width:280px;height:280px;background:#F4A261;top:200px;right:-80px;}
.blob-3{width:220px;height:220px;background:#EC6095;bottom:60px;left:60px;}

header{
  width:100%;height:52px;background:var(--gradient);
  display:flex;align-items:center;padding:0 1.4rem;
  margin-bottom:1.4rem;position:relative;z-index:10;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
header h1{font-family:'Montserrat',sans-serif;font-size:1rem;font-weight:700;color:#fff;letter-spacing:.02em;}
.header-chip{
  margin-left:10px;background:rgba(255,255,255,.22);color:#fff;
  font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:99px;
  letter-spacing:.04em;text-transform:uppercase;
}

.glass-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);
  border-radius:20px;box-shadow:0 8px 40px var(--shadow);
  padding:1.1rem 1.4rem .9rem;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  margin-bottom:.9rem;
  max-width:100%;overflow-x:auto;
}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#d4813a,#F4A261);
  border-radius:20px 20px 0 0;
}

.toggle-bar{display:flex;gap:6px;margin-bottom:2px;}
.toggle-pill{
  font-size:.65rem;font-weight:600;font-family:'Sora',sans-serif;
  padding:3px 10px;border-radius:99px;
  border:1.5px solid var(--border);
  background:rgba(255,255,255,.6);color:var(--muted);
  cursor:pointer;transition:all .15s;user-select:none;
}
.toggle-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.toggle-pill:hover:not(.active){border-color:var(--accent);color:var(--accent);}

/* Label rows */
.label-row,.value-label-row{
  display:flex;align-items:flex-end;
  max-height:0;overflow:hidden;
  transition:max-height .25s ease;
  flex-shrink:0;
}
.label-row.visible     { max-height:34px; }
.value-label-row.visible{ max-height:22px; }
.place-lbl{
  width:var(--DW);text-align:center;
  font-size:.48rem;font-weight:600;color:var(--muted);
  letter-spacing:.02em;line-height:1.2;white-space:normal;padding:0 1px;
}
.place-lbl.dec{color:var(--accent2);}
.place-val-lbl{
  width:var(--DW);text-align:center;
  font-size:.55rem;font-weight:700;color:var(--accent);
  font-family:'Montserrat',sans-serif;
}
.place-val-lbl.dec{color:var(--accent2);}
.lbl-spacer{flex-shrink:0;}

/* +/- rows */
.ctrl-row{display:flex;align-items:center;flex-shrink:0;}
.drum-col{width:var(--DW);display:flex;justify-content:center;align-items:center;}
.dot-col,.sep-col{flex-shrink:0;}
.drum-btn{
  width:32px;height:22px;
  border:1.5px solid var(--border);background:rgba(255,255,255,.7);
  border-radius:6px;cursor:pointer;font-size:.95rem;font-weight:700;color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,border-color .1s,transform .08s;
  font-family:'Sora',sans-serif;line-height:1;user-select:none;
}
.drum-btn:hover{background:var(--surface2);border-color:var(--accent);}
.drum-btn:active{transform:scale(.9);}
.drum-btn.minus{color:var(--accent2);}
.drum-btn.minus:hover{border-color:var(--accent2);}

/* Odometer shell */
.drums-row{
  display:flex;align-items:center;
  background:#18131f;border-radius:12px;padding:5px 8px;
  box-shadow:inset 0 4px 16px rgba(0,0,0,.65),0 3px 12px rgba(0,0,0,.25);
  position:relative;flex-shrink:0;
}
.drums-row::after{
  content:'';position:absolute;left:8px;right:8px;top:50%;
  transform:translateY(-50%);height:var(--DH);
  border-top:1px solid rgba(255,255,255,.16);
  border-bottom:1px solid rgba(255,255,255,.16);
  pointer-events:none;z-index:4;
}
.drum{width:var(--DW);height:var(--DH);overflow:hidden;position:relative;}
.drum::before,.drum::after{
  content:'';position:absolute;left:0;right:0;height:14px;z-index:3;pointer-events:none;
}
.drum::before{top:0;   background:linear-gradient(to bottom,rgba(24,19,31,.93),transparent);}
.drum::after {bottom:0;background:linear-gradient(to top,  rgba(24,19,31,.93),transparent);}

/*
  CYCLIC TAPE — contains 30 cells: digits repeated 3 times (0-9, 0-9, 0-9).
  We track an absolute "offset" (integer, any value) and render:
    translateY = -offset * DH
  Increasing offset → tape moves up → larger digit shown (add direction).
  Decreasing offset → tape moves down → smaller digit shown (subtract direction).
  The digit shown = ((offset % 10) + 10) % 10.
  We start at offset = digit (so digit 5 → offset 10+5=15, middle repetition).
*/
.tape{position:absolute;width:100%;will-change:transform;}
.tape-digit{
  width:100%;height:var(--DH);
  display:flex;align-items:center;justify-content:center;
  font-size:2.3rem;font-weight:700;
  font-family:'Montserrat',sans-serif;
  color:rgba(240,236,252,.28);user-select:none;
}
.tape-digit.lit{color:#fff;}

.dec-dot{
  width:20px;display:flex;align-items:center;justify-content:center;
  font-size:2.2rem;font-weight:700;color:#F4A261;
  flex-shrink:0;padding-bottom:3px;
}
.drum-sep{
  width:1px;height:34px;background:rgba(255,255,255,.1);
  flex-shrink:0;align-self:center;
}

/* Op panels */
.op-panels-row{
  display:flex;gap:.65rem;
  margin-bottom:.65rem;
}
.op-section{
  position:relative;z-index:1;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.68);
  border-radius:16px;box-shadow:0 4px 20px var(--shadow);
  padding:.75rem 1rem .7rem;
  flex:1;
  display:flex;flex-direction:column;align-items:center;
}
.op-title{text-align:center;}
.op-title{
  font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin-bottom:.5rem;
  text-align:center;
}
.op-row{display:flex;gap:5px;margin-bottom:5px;justify-content:center;}
.op-row:last-child{margin-bottom:0;}
.op-btn{
  height:28px;padding:0 .7rem;border-radius:8px;
  font-family:'Sora',sans-serif;font-size:.75rem;font-weight:600;
  cursor:pointer;border:1.5px solid transparent;
  transition:opacity .12s,transform .08s,background .12s;white-space:nowrap;
}
.op-btn:active{transform:scale(.93);}
.op-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.op-btn.add{background:#e8f0fe;color:#1a56db;border-color:#c3d3fc;}
.op-btn.add:hover:not(:disabled){background:#d0e2fd;}
.op-btn.sub{background:#fde8f1;color:#b03070;border-color:#f9c2d9;}
.op-btn.sub:hover:not(:disabled){background:#fbd0e4;}
.op-btn.mul{background:#e8f7e8;color:#166534;border-color:#bbdebb;}
.op-btn.mul:hover:not(:disabled){background:#d1f0d1;}
.op-btn.div{background:#fff4e5;color:#92400e;border-color:#f8d9a8;}
.op-btn.div:hover:not(:disabled){background:#fdebc7;}

/* Input panel */
.input-panel{
  position:relative;z-index:1;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,.68);
  border-radius:16px;box-shadow:0 4px 20px var(--shadow);
  padding:.55rem 1.1rem;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.input-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.input-label{font-size:.7rem;color:var(--muted);font-weight:600;white-space:nowrap;}
.divider-v{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0;}
input[type="text"]{
  width:80px;height:26px;
  border:1.5px solid var(--border);border-radius:7px;
  padding:0 .4rem;
  font-family:'Sora',sans-serif;font-size:.8rem;
  color:var(--text);background:rgba(255,255,255,.8);
  outline:none;transition:border-color .15s;
}
input[type="text"]:focus{border-color:var(--accent);}
.action-btn{
  height:26px;padding:0 .65rem;
  border:1.5px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:7px;font-family:'Sora',sans-serif;font-size:.7rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:opacity .12s,transform .08s;
}
.action-btn:hover{opacity:.85;}
.action-btn:active{transform:scale(.96);}
.action-btn:disabled{opacity:.4;cursor:not-allowed;}
.reset-btn{background:transparent;border-color:var(--border);color:var(--muted);}
.reset-btn:hover{border-color:var(--accent2);color:var(--accent2);opacity:1;}
.error-msg{font-size:.7rem;color:#e02020;min-height:1em;}
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<header>
  <h1>Positionssystemet</h1>
  <span class="header-chip">För läraren</span>
</header>

<div class="glass-card">
  <div class="toggle-bar">
    <button class="toggle-pill" id="pillNames"  onclick="toggleNames()">Positionsnamn</button>
    <button class="toggle-pill" id="pillValues" onclick="toggleValues()">Positionsvärden</button>
  </div>
  <div class="label-row"       id="labelRow"></div>
  <div class="value-label-row" id="valueLabelRow"></div>
  <div class="ctrl-row"  id="plusRow"></div>
  <div class="drums-row" id="drumsRow"></div>
  <div class="ctrl-row"  id="minusRow"></div>
</div>

<div class="op-panels-row">
  <div class="op-section">
    <div class="op-title">Addera &amp; Subtrahera</div>
    <div class="op-row" id="addRow"></div>
    <div class="op-row" id="subRow"></div>
  </div>
  <div class="op-section">
    <div class="op-title">Multiplicera &amp; Dividera</div>
    <div class="op-row" id="mulRow"></div>
    <div class="op-row" id="divRow"></div>
  </div>
</div>
<div class="input-panel">
  <div class="input-row">
    <span class="input-label">Ange tal:</span>
    <input type="text" id="setInput" autocomplete="off">
    <button class="action-btn" onclick="applySet()">Sätt</button>
    <button class="action-btn reset-btn" onclick="resetAll()">Nollställ</button>
    <div class="divider-v"></div>
    <span class="input-label">Beräkna:</span>
    <input type="text" id="addInput" autocomplete="off">
    <button class="action-btn" id="addBtn" onclick="startCustomAdd()">Utför</button>
  </div>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  LAYOUT DEFINITION
//  15 drums: 8 integer positions + 6 decimal positions
//  Groups of 3, separated by thin spacers; decimal dot before index 8
// ═══════════════════════════════════════════════════════════════
const DRUMS = [
  // index, name, placeValue (as string for display), isDecimal
  { name:'Tio\u00admiljoner',   pv:'10\u202f000\u202f000', dec:false },  // 0
  { name:'Miljoner',            pv:'1\u202f000\u202f000',  dec:false },  // 1
  { name:'Hundra\u00adtusental',pv:'100\u202f000',         dec:false },  // 2
  { name:'Tio\u00adtusental',   pv:'10\u202f000',          dec:false },  // 3
  { name:'Tusental',            pv:'1\u202f000',            dec:false },  // 4
  { name:'Hundratal',           pv:'100',                  dec:false },  // 5
  { name:'Tiotal',              pv:'10',                   dec:false },  // 6
  { name:'Ental',               pv:'1',                    dec:false },  // 7
  // decimal dot between 7 and 8
  { name:'Tiondel',             pv:'0,1',                  dec:true  },  // 8
  { name:'Hundradel',           pv:'0,01',                 dec:true  },  // 9
  { name:'Tusendel',            pv:'0,001',                dec:true  },  // 10
  { name:'Tiontusendel',        pv:'0,0001',               dec:true  },  // 11
  { name:'Hundra\u00adtusendel',pv:'0,00001',              dec:true  },  // 12
  { name:'Miljondelar',         pv:'0,000001',             dec:true  },  // 13
];
const N = DRUMS.length; // 14
// Groups of 3 — separators inserted BEFORE these indices
const SEP_BEFORE = new Set([2, 5, 9, 12]);   // thin separator — Swedish 3+3+2 grouping
const DEC_DOT_BEFORE = 8;                     // decimal comma

// Place values for arithmetic (index 0 = tio-miljoner)
// All stored as milli-micro units: multiply by 10^9 to get micro-units
// Easier: store as BigInt nano-units (×10^9) to keep integers.
// Actually let's just use a fixed-point integer: store value * 10^6 (microunits).
// tio-miljoner = 10_000_000 → micro = 10_000_000_000_000  — too big for Number.
// Use BigInt for the accumulator.
const MICRO_PER_DRUM = [
  10000000000000n,  // 10 000 000      × 10^6
   1000000000000n,  //  1 000 000
    100000000000n,  //    100 000
     10000000000n,  //     10 000
      1000000000n,  //      1 000
       100000000n,  //        100
        10000000n,  //         10
         1000000n,  //          1
          100000n,  //          0.1
           10000n,  //          0.01
            1000n,  //          0.001
             100n,  //          0.0001
              10n,  //          0.00001
               1n,  //          0.000001
];
const MICRO_MAX = 99999999999999n; // 99 999 999.999999 in micro

// ── State ────────────────────────────────────────────────────────────────────
// offsets[i]: absolute integer offset for drum i.
// The digit shown = posmod(offset, 10).
// Tape contains 30 cells (3 repetitions of 0-9).
// Physical y = -offset * DH  (mod-corrected into [0..30*DH) window).
// We keep offset unbounded; before each animation we mod it into a safe window.
let offsets = new Array(N).fill(0); // starts at digit 0
let busy    = false;
let showNames = false;
let showVals  = false;

const DH = 56; // px — must match --DH
const TAPE_REPS = 3;
const TAPE_CELLS = 10 * TAPE_REPS; // 30

// posmod: always-positive modulo
function posmod(a, b) { return ((a % b) + b) % b; }
// digit from offset
function digitOf(off) { return posmod(off, 10); }

// ── Toggle ───────────────────────────────────────────────────────────────────
function toggleNames()  {
  showNames = !showNames;
  document.getElementById('pillNames').classList.toggle('active', showNames);
  document.getElementById('labelRow').classList.toggle('visible', showNames);
}
function toggleValues() {
  showVals = !showVals;
  document.getElementById('pillValues').classList.toggle('active', showVals);
  document.getElementById('valueLabelRow').classList.toggle('visible', showVals);
}

// ── Build DOM ─────────────────────────────────────────────────────────────────
function buildUI() {
  buildLabelRows();
  buildDrumRows();
  buildOpButtons();
}

function insertSpacer(parent, w) {
  const el = document.createElement('div');
  el.className = 'lbl-spacer';
  el.style.width = w;
  parent.appendChild(el);
}

function buildLabelRows() {
  const lr  = document.getElementById('labelRow');
  const vlr = document.getElementById('valueLabelRow');
  for (let i = 0; i < N; i++) {
    if (SEP_BEFORE.has(i)) { insertSpacer(lr,'1px'); insertSpacer(vlr,'1px'); }
    if (i === DEC_DOT_BEFORE) { insertSpacer(lr,'20px'); insertSpacer(vlr,'20px'); }
    const d = DRUMS[i];
    lr.insertAdjacentHTML ('beforeend', `<div class="place-lbl${d.dec?' dec':''}">${d.name}</div>`);
    vlr.insertAdjacentHTML('beforeend', `<div class="place-val-lbl${d.dec?' dec':''}">${d.pv}</div>`);
  }
}

function buildDrumRows() {
  const plusRow  = document.getElementById('plusRow');
  const drumsRow = document.getElementById('drumsRow');
  const minusRow = document.getElementById('minusRow');

  for (let i = 0; i < N; i++) {
    // Separators
    if (SEP_BEFORE.has(i)) {
      ['plusRow','drumsRow','minusRow'].forEach(id => {
        const el = document.createElement('div');
        if (id === 'drumsRow') { el.className = 'drum-sep'; }
        else { el.className = 'sep-col'; el.style.width = '1px'; }
        document.getElementById(id).appendChild(el);
      });
    }
    // Decimal dot
    if (i === DEC_DOT_BEFORE) {
      const dot = document.createElement('div');
      dot.className = 'dec-dot'; dot.textContent = ',';
      drumsRow.appendChild(dot);
      ['plusRow','minusRow'].forEach(id => {
        const el = document.createElement('div');
        el.className = 'dot-col'; el.style.width = '20px';
        document.getElementById(id).appendChild(el);
      });
    }

    // + button
    const pc = document.createElement('div'); pc.className = 'drum-col';
    const pb = document.createElement('button'); pb.className = 'drum-btn plus'; pb.textContent = '+';
    pb.addEventListener('click', () => userStep(i, 1));
    pc.appendChild(pb); plusRow.appendChild(pc);

    // drum
    const drum = document.createElement('div'); drum.className = 'drum'; drum.id = `d${i}`;
    drum.appendChild(makeTape(0));
    drumsRow.appendChild(drum);

    // − button
    const mc = document.createElement('div'); mc.className = 'drum-col';
    const mb = document.createElement('button'); mb.className = 'drum-btn minus'; mb.textContent = '−';
    mb.addEventListener('click', () => userStep(i, -1));
    mc.appendChild(mb); minusRow.appendChild(mc);
  }
}

function makeBtn(cls, label, onClick) {
  const btn = document.createElement('button');
  btn.className = 'op-btn ' + cls;
  btn.textContent = label;
  btn.addEventListener('click', onClick);
  return btn;
}

function buildOpButtons() {
  const addRow = document.getElementById('addRow');
  const subRow = document.getElementById('subRow');
  const mulRow = document.getElementById('mulRow');
  const divRow = document.getElementById('divRow');

  [{l:'+1 000',v:1000},{l:'+100',v:100},{l:'+10',v:10}]
    .forEach(op => addRow.appendChild(makeBtn('add', op.l, () => runDelta(op.v))));

  [{l:'−1 000',v:-1000},{l:'−100',v:-100},{l:'−10',v:-10}]
    .forEach(op => subRow.appendChild(makeBtn('sub', op.l, () => runDelta(op.v))));

  [{l:'× 10',f:10},{l:'× 100',f:100},{l:'× 1 000',f:1000}]
    .forEach(op => mulRow.appendChild(makeBtn('mul', op.l, () => runMultiply(op.f))));

  [{l:'÷ 10',f:0.1},{l:'÷ 100',f:0.01},{l:'÷ 1 000',f:0.001}]
    .forEach(op => divRow.appendChild(makeBtn('div', op.l, () => runMultiply(op.f))));
}

// ═══════════════════════════════════════════════════════════════
//  CYCLIC TAPE
//  30 cells: 0,1,2,...,9, 0,1,...,9, 0,1,...,9
//  Physical Y of cell k = k * DH
//  Tape translateY = -offset * DH  (but we keep offset in [10..20)
//  so the "lit" cell is always in the middle repetition, away from edges)
// ═══════════════════════════════════════════════════════════════
function makeTape(initialDigit) {
  const tape = document.createElement('div');
  tape.className = 'tape';
  for (let k = 0; k < TAPE_CELLS; k++) {
    const cell = document.createElement('div');
    cell.className = 'tape-digit';
    cell.textContent = k % 10;
    tape.appendChild(cell);
  }
  // Start offset in middle repetition: offset = 10 + digit
  const off = 10 + initialDigit;
  offsets[0] = off; // will be overwritten by buildDrumRows caller
  tape.style.transition = 'none';
  tape.style.transform  = `translateY(${-off * DH}px)`;
  updateTapeLit(tape, off);
  return tape;
}

function updateTapeLit(tape, offset) {
  const digit = posmod(offset, 10);
  tape.querySelectorAll('.tape-digit').forEach((el, k) => {
    el.classList.toggle('lit', k % 10 === digit);
  });
}

// Re-anchor offset into middle repetition (10..20) without moving the tape visually
function reanchorOffset(i) {
  const tape = document.getElementById(`d${i}`).querySelector('.tape');
  let off = offsets[i];
  // Shift by multiples of 10 to land in [10, 20)
  const mod = posmod(off, 10);
  const target = 10 + mod; // always in [10,19]
  // Apply difference
  const diff = target - off;
  if (diff !== 0) {
    offsets[i] = target;
    tape.style.transition = 'none';
    tape.style.transform  = `translateY(${-target * DH}px)`;
  }
}

// ── Animate one step on drum i in direction dir (+1 or -1) ───────────────────
// dir +1 → offset increases → tape scrolls upward → next digit (mod 10) appears
// dir -1 → offset decreases → tape scrolls downward → previous digit appears
// ALWAYS consistent rotational direction: +1 always up, -1 always down.
function animateDrum(i, dir) {
  return new Promise(resolve => {
    const drum = document.getElementById(`d${i}`);
    const tape = drum.querySelector('.tape');

    // Reanchor so we have room in both directions
    reanchorOffset(i);

    const startOff = offsets[i];
    const endOff   = startOff + dir;

    tape.style.transition = 'none';
    tape.style.transform  = `translateY(${-startOff * DH}px)`;
    updateTapeLit(tape, startOff);

    tape.getBoundingClientRect(); // reflow

    tape.style.transition = 'transform 0.19s cubic-bezier(0.22,0.8,0.3,1)';
    tape.style.transform  = `translateY(${-endOff * DH}px)`;

    let done = false;
    const finish = () => {
      if (done) return; done = true;
      offsets[i] = endOff;
      updateTapeLit(tape, endOff);
      resolve();
    };
    tape.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 300);
  });
}

// ── Cascade: step drum i, carry to i-1 if it wrapped ─────────────────────────
async function cascadeStep(i, dir) {
  const before = digitOf(offsets[i]);
  await animateDrum(i, dir);
  const after  = digitOf(offsets[i]);
  const wrappedUp   = dir === 1  && before === 9 && after === 0;
  const wrappedDown = dir === -1 && before === 0 && after === 9;
  if ((wrappedUp || wrappedDown) && i > 0) {
    await cascadeStep(i - 1, dir);
  }
}

// ── User drum-button press ────────────────────────────────────────────────────
async function userStep(i, dir) {
  if (busy) return;
  busy = true;
  await cascadeStep(i, dir);
  busy = false;
}

// ═══════════════════════════════════════════════════════════════
//  ARITHMETIC — BigInt micro-units (value × 10^6)
// ═══════════════════════════════════════════════════════════════
function getCurrentMicro() {
  let total = 0n;
  for (let i = 0; i < N; i++) {
    total += BigInt(digitOf(offsets[i])) * MICRO_PER_DRUM[i];
  }
  return total;
}

function microToDigits(m) {
  m = bigClamp(m, 0n, MICRO_MAX);
  const d = [];
  let rem = m;
  for (let i = 0; i < N; i++) {
    d.push(Number(rem / MICRO_PER_DRUM[i]));
    rem = rem % MICRO_PER_DRUM[i];
  }
  return d;
}

function bigClamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

// Set all drums instantly to given digit array
function setDigitsInstant(digs) {
  for (let i = 0; i < N; i++) {
    const drum = document.getElementById(`d${i}`);
    const tape = drum.querySelector('.tape');
    const off  = 10 + digs[i]; // anchor in middle rep
    offsets[i] = off;
    tape.style.transition = 'none';
    tape.style.transform  = `translateY(${-off * DH}px)`;
    updateTapeLit(tape, off);
  }
}

// ── Parse text → digit array ──────────────────────────────────────────────────
function parseInput(str) {
  str = str.trim().replace(',', '.').replace(/\s/g,'');
  const n = parseFloat(str);
  if (isNaN(n)) return null;
  // Convert to micro BigInt
  const micro = BigInt(Math.round(Math.max(0, n) * 1e6));
  const clamped = bigClamp(micro, 0n, MICRO_MAX);
  return microToDigits(clamped);
}

// ── Add/Subtract fixed delta ──────────────────────────────────────────────────
async function runDelta(delta) {
  if (busy) return;
  busy = true;
  setAllBtns(true);

  const deltaMicro  = BigInt(Math.round(delta * 1e6));
  const curMicro    = getCurrentMicro();
  const targetMicro = bigClamp(curMicro + deltaMicro, 0n, MICRO_MAX);
  const targetDigs  = microToDigits(targetMicro);
  const sign        = deltaMicro > 0n ? 1 : -1;

  // Animate from smallest drum upward, each drum exactly the steps needed
  for (let i = N - 1; i >= 0; i--) {
    const cur = digitOf(offsets[i]);
    const tgt = targetDigs[i];
    let steps = sign > 0
      ? posmod(tgt - cur, 10)
      : posmod(cur - tgt, 10);
    for (let s = 0; s < steps; s++) {
      await animateDrum(i, sign);
      await sleep(35);
    }
  }

  setDigitsInstant(targetDigs); // safety snap
  setAllBtns(false);
  busy = false;
}

// ── Multiply/Divide by power of ten ──────────────────────────────────────────
// Mechanically: digits shift left (×10) or right (÷10) by 'positions' places.
// Each pass: all drums animate simultaneously to their post-shift values.
async function runMultiply(factor) {
  if (busy) return;
  busy = true;
  setAllBtns(true);

  const positions = Math.round(Math.log10(Math.abs(factor))); // 1,2,3,...
  const dir       = factor >= 1 ? 1 : -1; // +1 shift left (×10), -1 shift right (÷10)

  for (let pass = 0; pass < Math.abs(positions); pass++) {
    // Current digit array
    const cur = Array.from({length:N}, (_,i) => digitOf(offsets[i]));
    // After one ×10: digit at position i ← digit at position i+1 (shifted left),
    // last drum ← 0.
    // After one ÷10: digit at position i ← digit at position i-1 (shifted right),
    // first drum ← 0.
    let shifted;
    if (dir > 0) {
      shifted = [...cur.slice(1), 0]; // ×10
    } else {
      shifted = [0, ...cur.slice(0, N-1)]; // ÷10
    }

    // Animate all drums in parallel
    const anims = [];
    for (let i = 0; i < N; i++) {
      if (cur[i] !== shifted[i]) {
        anims.push(animateDrumToTarget(i, cur[i], shifted[i]));
      }
    }
    // Temporarily set offsets so animateDrumToTarget reads correct current digit
    // (animateDrumToTarget uses offsets[i] internally via digitOf)
    await Promise.all(anims);
    await sleep(80);
  }

  // Compute true target and snap
  const curMicro    = getCurrentMicro();
  // factor as BigInt fraction: ×10 → *10, ÷10 → /10
  let targetMicro;
  if (dir > 0) {
    targetMicro = curMicro * BigInt(Math.round(factor));
  } else {
    // factor = 0.1, 0.01 etc → divide
    const divisor = BigInt(Math.round(1 / factor));
    targetMicro = curMicro / divisor;
  }
  setDigitsInstant(microToDigits(bigClamp(targetMicro, 0n, MICRO_MAX)));

  setAllBtns(false);
  busy = false;
}

// Animate drum i from digit 'from' to digit 'to', shortest rotational path
async function animateDrumToTarget(i, from, to) {
  if (from === to) return;
  const cwSteps  = posmod(to - from, 10);
  const ccwSteps = posmod(from - to, 10);
  const animDir  = cwSteps <= ccwSteps ? 1 : -1;
  const steps    = Math.min(cwSteps, ccwSteps);
  for (let s = 0; s < steps; s++) {
    await animateDrum(i, animDir);
    await sleep(25);
  }
}

// ── "Beräkna" field ───────────────────────────────────────────────────────────
async function startCustomAdd() {
  if (busy) return;
  clearErr();
  const raw   = document.getElementById('addInput').value;
  const str   = raw.trim().replace(',', '.').replace(/\s/g,'');
  const delta = parseFloat(str);
  if (isNaN(delta)) { showErr('Ange t.ex. +124 eller −50,5'); return; }

  const deltaMicro = BigInt(Math.round(delta * 1e6));
  if (deltaMicro === 0n) return;

  busy = true;
  document.getElementById('addBtn').disabled = true;
  const sign      = deltaMicro > 0n ? 1 : -1;
  const absMicro  = deltaMicro < 0n ? -deltaMicro : deltaMicro;

  // Step smallest-first (pedagogical: units before tens)
  for (let i = N - 1; i >= 0; i--) {
    const steps = Number((absMicro / MICRO_PER_DRUM[i]) % 10n);
    for (let s = 0; s < steps; s++) {
      await cascadeStep(i, sign);
      await sleep(45);
    }
  }

  busy = false;
  document.getElementById('addBtn').disabled = false;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function setAllBtns(disabled) {
  document.querySelectorAll('.op-btn').forEach(b => b.disabled = disabled);
  document.getElementById('addBtn').disabled = disabled;
}

function applySet() {
  clearErr();
  const d = parseInput(document.getElementById('setInput').value);
  if (!d) { showErr('Ogiltigt tal, ange t.ex. 3456,78'); return; }
  setDigitsInstant(d);
}

function resetAll() {
  clearErr();
  setDigitsInstant(new Array(N).fill(0));
  document.getElementById('setInput').value  = '';
  document.getElementById('addInput').value  = '';
}

function showErr(msg) { document.getElementById('errorMsg').textContent = msg; }
function clearErr()   { document.getElementById('errorMsg').textContent = ''; }

document.getElementById('setInput').addEventListener('keydown', e => { if (e.key==='Enter') applySet(); });
document.getElementById('addInput').addEventListener('keydown', e => { if (e.key==='Enter') startCustomAdd(); });

// ── Init ──────────────────────────────────────────────────────────────────────
// Must set offsets before buildUI touches them
offsets = new Array(N).fill(10); // digit 0 in middle rep for all drums
buildUI();
// After DOM is built, position all tapes
for (let i = 0; i < N; i++) {
  const tape = document.getElementById(`d${i}`).querySelector('.tape');
  tape.style.transition = 'none';
  tape.style.transform  = `translateY(${-offsets[i] * DH}px)`;
  updateTapeLit(tape, offsets[i]);
}
</script>
