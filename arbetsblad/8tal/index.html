<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Räkneträning — Arbetsblad</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f6f4ff;--surface:#fff;--surface2:#eae6ff;--border:#ccc5f0;
    --text:#100e28;--muted:#585078;--accent:#306BF0;--accent2:#EC6095;
    --shadow:rgba(48,107,240,.12);
    --grad:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);
    --ak7:#66C7C2;--ak8:#F4A261;--ak9:#EC6095;
    --glass-bg:rgba(255,255,255,.72);--glass-border:rgba(255,255,255,.9);
  }
  body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  /* ═══════════ "Modern vy" — glasmorfism, bara på skärm, aldrig i utskrift ═══════════ */
  .ws-ambient{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; opacity:0; transition:opacity .3s; }
  body.glass-mode .ws-ambient{ opacity:1; }
  .ws-ambient span{ position:absolute; width:420px; height:420px; border-radius:50%; filter:blur(80px); opacity:.35; }
  .ws-ambient span:nth-child(1){ background:var(--ak7); top:-120px; left:-100px; }
  .ws-ambient span:nth-child(2){ background:var(--ak8); top:30%; right:-140px; }
  .ws-ambient span:nth-child(3){ background:var(--ak9); bottom:-160px; left:20%; }
  body.glass-mode{ background:linear-gradient(160deg,#f6f4ff 0%,#eef0ff 100%); }
  body.glass-mode .ws-sidebar{
    background:transparent; border-right:none; overflow-x:hidden;
    margin:16px 0 16px 16px; border-radius:20px; box-shadow:0 20px 50px rgba(16,14,40,.10);
    max-height:calc(100vh - 47px - 32px);
  }
  body.glass-mode .ws-sidebar-top{ border-radius:20px 20px 0 0; }
  body.glass-mode .ws-table{ border-radius:0 0 18px 18px; overflow:hidden; }
  body.glass-mode .ws-sidebar-top,
  body.glass-mode .ws-sidebar-actions,
  body.glass-mode .ws-table-group{
    background:var(--glass-bg); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-color:var(--glass-border);
  }
  body.glass-mode.ws-mode-interactive .worksheet-problem{
    background:var(--glass-bg); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border); border-bottom:1px solid var(--glass-border);
    border-radius:16px; padding:16px 18px; box-shadow:0 8px 22px rgba(16,14,40,.07);
    transition:box-shadow .18s, transform .18s;
  }
  body.glass-mode.ws-mode-interactive .worksheet-problem:hover{ box-shadow:0 12px 30px rgba(16,14,40,.11); transform:translateY(-2px); }
  body.glass-mode.ws-mode-interactive .worksheet-problem.ws-correct{
    box-shadow:0 8px 22px rgba(24,163,72,.18); background:linear-gradient(120deg,rgba(24,163,72,.12),var(--glass-bg) 65%);
  }
  body.glass-mode.ws-mode-interactive .worksheet-problem.ws-wrong{
    box-shadow:0 8px 22px rgba(236,96,149,.2); background:linear-gradient(120deg,rgba(236,96,149,.13),var(--glass-bg) 65%);
  }

  /* ═══════════ ARBETSBLAD (utskriftsvänligt) ═══════════ */
  .pt-header{
    background:var(--grad); color:#fff; padding:13px 22px; display:flex; align-items:center; gap:10px;
    font-family:'Sora',sans-serif; font-weight:800; font-size:1.05rem; position:sticky; top:0; z-index:6;
    box-shadow:0 2px 10px rgba(16,14,40,.15);
  }
  .pt-header-icon{ font-size:1.2rem; }
  .pt-header-theme-btn{
    border:1.5px solid rgba(255,255,255,.6); background:rgba(255,255,255,.14); color:#fff; border-radius:20px;
    padding:6px 14px; font-weight:700; font-size:.82rem; cursor:pointer; font-family:'Sora',sans-serif;
  }
  .pt-header-theme-btn:hover{ background:rgba(255,255,255,.26); }
  .pt-header-theme-btn.active{ background:#fff; color:var(--accent); border-color:#fff; }
  .pt-header-font-select{
    border:1.5px solid rgba(255,255,255,.6); background:rgba(255,255,255,.14); color:#fff; border-radius:20px;
    padding:6px 10px; font-weight:700; font-size:.82rem; cursor:pointer; font-family:'Sora',sans-serif;
  }
  .pt-header-font-select option{ color:#100e28; }

  /* Typsnitt för själva uppgiftstexterna (skiljs från gränssnittets Sora) */
  body.font-handwritten .worksheet-page,
  body.font-handwritten .worksheet-answerkey,
  body.font-handwritten .ws-title-input,
  body.font-handwritten .ws-answer-input{ font-family:'Patrick Hand',cursive; }
  body.font-calibri .worksheet-page,
  body.font-calibri .worksheet-answerkey,
  body.font-calibri .ws-title-input,
  body.font-calibri .ws-answer-input{ font-family:Calibri,Candara,Segoe,'Segoe UI',Optima,Arial,sans-serif; }
  .worksheet-page-wrap{ min-height:100vh; background:#fff; position:relative; z-index:1; flex:1 1 auto; min-width:0; }

  /* ═══════════ VÄNSTER SIDOPANEL — allt urval av innehåll samlat här ═══════════ */
  .ws-layout{ display:flex; align-items:flex-start; }
  .ws-sidebar{
    width:440px; flex:0 0 440px; position:sticky; top:47px; align-self:flex-start;
    max-height:calc(100vh - 47px); overflow-y:auto; background:var(--surface);
    border-right:1.5px solid var(--border); font-family:'Sora',sans-serif; z-index:2;
  }
  .ws-sidebar label{ font-size:.85rem; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px; }
  .ws-sidebar input[type=checkbox]{ width:15px; height:15px; accent-color:var(--accent); flex-shrink:0; }
  .ws-sidebar-top, .ws-sidebar-actions{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 16px;
    border-bottom:1.5px solid var(--border); position:sticky; z-index:2; background:var(--surface);
  }
  .ws-sidebar-top{ top:0; }
  .ws-sidebar-actions{ top:53px; }
  body.glass-mode .ws-sidebar-top{ top:0; }
  .ws-total-count{ font-size:.8rem; color:var(--muted); font-weight:700; }
  .ws-score-line{ padding:6px 16px; font-size:.85rem; font-weight:700; color:var(--text); border-bottom:1.5px solid var(--border); }
  .ws-sidebar-actions button{
    border:1.5px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px;
    padding:7px 12px; font-weight:700; cursor:pointer; font-family:'Sora',sans-serif; font-size:.8rem;
  }
  .ws-sidebar-actions button:hover{ opacity:.88; }
  .ws-sidebar-actions button.wc-pill-btn{
    background:transparent; border-color:var(--border); color:var(--muted);
  }
  .wc-spacer{ flex:1 1 auto; min-width:4px; }

  .ws-table{ padding:10px 12px 24px; display:flex; flex-direction:column; gap:14px; }
  .ws-table-group{
    background:var(--surface2); border:1.5px solid var(--border); border-radius:12px; overflow:hidden;
  }
  .ws-table-grouphead{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; background:rgba(48,107,240,.07); border-bottom:1.5px solid var(--border);
  }
  .ws-table-group-label{ font-size:.86rem; font-weight:800; color:var(--text); }
  .ws-neg-level{ display:flex; align-items:center; gap:6px; }
  .ws-neg-level-label{ font-size:.72rem; color:var(--muted); font-weight:700; white-space:nowrap; }
  .ws-neg-toggle .ws-mode-btn{ padding:4px 8px; font-size:.7rem; }
  .ws-table-row{
    display:flex; flex-direction:column; padding:9px 12px; border-top:1px solid var(--border);
  }
  .ws-table-row:first-of-type{ border-top:none; }
  .ws-row-top{ display:flex; align-items:center; gap:8px; }
  .ws-row-check{ font-size:.84rem !important; color:var(--text) !important; font-weight:700 !important; flex:1 1 auto; }
  .ws-row-controls-wrap{
    max-height:0; opacity:0; overflow:hidden;
    transition:max-height .28s ease, opacity .2s ease, margin-top .28s ease;
  }
  .ws-row-controls{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding-left:22px; }
  .ws-row-controls label{ font-size:.74rem; white-space:nowrap; }
  .ws-table-row.ws-row-active .ws-row-controls-wrap{ max-height:140px; opacity:1; margin-top:8px; }
  .ws-row-count{
    width:40px; padding:4px 4px; border:1.5px solid var(--border); border-radius:6px; text-align:center;
    font-weight:700; font-family:'Sora',sans-serif; flex-shrink:0;
  }
  .ws-row-count:disabled{ opacity:.4; }
  .ws-table .ws-mode-toggle{ padding:2px; }
  .ws-table .ws-mode-btn{ padding:5px 9px; font-size:.72rem; }
  body.glass-mode .ws-table-group{ background:rgba(255,255,255,.4); border-color:var(--glass-border); }
  body.glass-mode .ws-table-grouphead{ background:rgba(48,107,240,.1); border-color:var(--glass-border); }
  body.glass-mode .ws-table-row{ border-color:var(--glass-border); }

  .ws-divider{ width:1.5px; align-self:stretch; background:var(--border); margin:0 4px; }
  .worksheet-page{ max-width:900px; margin:0 auto; padding:38px 34px 60px; font-family:'Sora',sans-serif; color:#100e28; }
  .worksheet-title-bar{
    height:8px; border-radius:5px; margin-bottom:20px; background:var(--grad);
    -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;
  }
  .worksheet-page h1{ font-size:1.5rem; margin:0 0 8px; }
  .ws-title-input{
    display:block; width:100%; font-size:1.5rem; font-weight:700; font-family:'Sora',sans-serif;
    color:#100e28; border:none; background:transparent; margin:0 0 8px; padding:2px 0;
    border-bottom:1.5px dashed transparent;
  }
  .ws-title-input:hover, .ws-title-input:focus{ border-bottom-color:var(--border); outline:none; }
  .ws-title-input::placeholder{ color:#b9b2e0; }
  .ws-title-print-only{ display:none; }
  .worksheet-footnote{ margin-top:22px; padding-top:10px; border-top:1px solid #e4e0f7; font-size:.78rem; color:var(--muted); }
  @media print{ .ws-title-print-only{ display:block; } }
  .worksheet-meta{ font-size:.95rem; color:#585078; margin-bottom:28px; }

  .ws-interactive-bar{
    position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:10px 22px; background:var(--surface); border-bottom:1.5px solid var(--border);
    font-family:'Sora',sans-serif;
  }
  .ws-interactive-bar button{
    border:1.5px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px;
    padding:7px 14px; font-weight:700; cursor:pointer; font-family:'Sora',sans-serif; font-size:.82rem;
  }
  .ws-interactive-bar .ws-score-display{ font-size:.85rem; font-weight:700; color:var(--text); }
  body.glass-mode .ws-interactive-bar{
    background:var(--glass-bg); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border-color:var(--glass-border);
  }
  body.ws-focus-mode .ws-sidebar{ display:none; }
  .worksheet-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px 48px; }
  .ws-empty-state{
    grid-column:1 / -1; text-align:center; padding:60px 20px; color:var(--muted);
    font-size:1rem; border:1.5px dashed var(--border); border-radius:14px;
  }
  .worksheet-grid.ws-grid-single{ grid-template-columns:1fr; max-width:700px; margin:0 auto; }
  .worksheet-problem{
    display:flex; align-items:center; gap:8px; font-size:1.15rem; font-weight:600;
    border-bottom:1.5px dotted #ccc5f0; padding-bottom:11px; flex-wrap:nowrap; min-width:0;
  }
  .worksheet-problem.ws-has-workspace{ display:block; }
  .wproblem-line{ display:flex; align-items:center; gap:8px; flex-wrap:nowrap; min-width:0; }
  .worksheet-problem .wnum{ font-weight:700; color:#585078; min-width:22px; flex-shrink:0; }
  .worksheet-problem .wexpr{ white-space:nowrap; flex-shrink:0; }
  .worksheet-problem .wanswer-line{ flex:0 0 auto; width:60px; border-bottom:1.5px solid #100e28; align-self:flex-end; margin-bottom:3px; }
  .ws-work-space{
    margin-top:10px; min-height:72px; border:1.5px dashed var(--border); border-radius:8px;
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 19px, #e4e0f7 20px, #e4e0f7 21.5px, transparent 21.5px);
  }
  .ws-numline-row{ flex-direction:column; align-items:stretch; gap:2px; padding-bottom:22px; margin-bottom:6px; }
  .ws-numline{ width:100%; max-width:640px; height:auto; display:block; margin-top:6px; }
  .worksheet-answerkey{ page-break-before:always; }
  .worksheet-answer-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:11px 22px; font-size:.92rem; color:#100e28; }
  .ws-mode-toggle{
    display:flex; gap:3px; background:var(--surface2); border-radius:10px; padding:3px;
  }
  .ws-mode-btn{
    border:1.5px solid transparent; background:transparent; color:var(--muted); padding:7px 14px;
    font-weight:700; border-radius:7px; cursor:pointer; font-family:'Sora',sans-serif; font-size:.82rem;
    white-space:nowrap; transition:all .15s;
  }
  .ws-mode-btn:hover{ background:rgba(255,255,255,.6); }
  .ws-mode-btn.active{ background:#fff; border-color:var(--accent); color:var(--accent); box-shadow:0 1px 3px rgba(48,107,240,.18); }
  .ws-mode-btn.ws-topic-btn{ font-size:1rem; padding:7px 16px; }
  .ws-answer-input{
    width:64px; padding:5px 7px; border:1.5px solid var(--border); border-radius:6px;
    font-family:'Sora',sans-serif; font-size:1rem; font-weight:700; color:#100e28;
  }
  /* Inga stegnings-pilar på svarsfälten — för lätta att råka klicka i, stör vidare inmatning */
  .ws-answer-input::-webkit-inner-spin-button, .ws-answer-input::-webkit-outer-spin-button,
  .ws-frac-input input::-webkit-inner-spin-button, .ws-frac-input input::-webkit-outer-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .ws-answer-input[type=number], .ws-frac-input input[type=number]{ -moz-appearance:textfield; }
  .ws-feedback{ font-weight:700; font-size:.82rem; min-width:100px; display:inline-flex; align-items:center; gap:5px; }
  .worksheet-problem.ws-correct{
    border-bottom-color:#18a348; background:linear-gradient(90deg,rgba(24,163,72,.08),transparent 60%);
  }
  .worksheet-problem.ws-correct .ws-feedback{ color:#0f8038; }
  .worksheet-problem.ws-wrong{
    border-bottom-color:#EC6095; background:linear-gradient(90deg,rgba(236,96,149,.09),transparent 60%);
  }
  .worksheet-problem.ws-wrong .ws-feedback{ color:#d1367a; }
  .ws-feedback-badge{
    display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    border-radius:50%; font-size:.72rem; color:#fff; flex:none;
  }
  .worksheet-problem.ws-correct .ws-feedback-badge{ background:#18a348; }
  .worksheet-problem.ws-wrong .ws-feedback-badge{ background:#EC6095; }
  .ws-frac{
    display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
    margin:0 5px; font-size:.9em; line-height:1.2;
  }
  .ws-frac-num{ padding:0 5px 2px; border-bottom:1.8px solid #100e28; }
  .ws-frac-den{ padding:2px 5px 0; }
  .ws-mixed{ display:inline-flex; align-items:center; gap:3px; vertical-align:middle; }
  .ws-mixed-whole{ font-weight:700; }
  .ws-bigfrac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 8px; }
  .ws-bigfrac-top{ padding:0 7px 5px; border-bottom:2.2px solid #100e28; }
  .ws-bigfrac-bottom{ padding:5px 7px 0; }

  /* ═══ Bråksvar: täljare/nämnare-rutor i interaktivt läge ═══ */
  .ws-frac-input{ display:inline-flex; flex-direction:column; align-items:center; gap:3px; }
  .ws-frac-input input{ width:52px; text-align:center; }
  .ws-frac-input-bar{ width:52px; height:1.8px; background:#100e28; }
  body.glass-mode .worksheet-page-wrap{ background:transparent; }
  body.glass-mode .worksheet-page{
    background:#fff; border-radius:20px; box-shadow:0 20px 50px rgba(16,14,40,.10); margin:24px auto;
  }
  @media print{
    .no-print{ display:none !important; }
    html, body{ background:#fff !important; margin:0 !important; padding:0 !important; }
    .worksheet-page{ padding:8px 4px 24px; max-width:100%; margin:0; }
    .worksheet-grid{ gap:20px 60px; }
    .worksheet-title-bar,
    .worksheet-problem.ws-correct, .worksheet-problem.ws-wrong{
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
    }
    /* "Modern vy" är enbart för skärmen — nolla den helt om utskrift ändå triggas medan den är på */
    .ws-ambient{ display:none !important; }
    body.glass-mode .worksheet-page-wrap,
    body.glass-mode .worksheet-page{
      background:#fff !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
      box-shadow:none !important; border-radius:0 !important; margin:0 !important;
    }
    body.glass-mode.ws-mode-interactive .worksheet-problem{
      background:#fff !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
      box-shadow:none !important; border-radius:0 !important; padding-bottom:11px !important;
      border-left:none !important; border-right:none !important; border-top:none !important;
      border-bottom:1.5px dotted #ccc5f0 !important;
    }
  }
</style>
</head>
<body class="glass-mode">

<header class="pt-header no-print">
  <span class="pt-header-icon">📝</span><span>Arbetsblad — Matematikportalen</span>
  <div class="wc-spacer"></div>
  <select id="wsFontSelect" class="pt-header-font-select" title="Typsnitt för uppgiftstexterna">
    <option value="default">Aa Sora</option>
    <option value="handwritten">Aa Patrick Hand</option>
    <option value="calibri">Aa Calibri</option>
  </select>
  <button type="button" id="wsGlassToggle" class="pt-header-theme-btn" title="Byt mellan modern och klassisk vy — påverkar aldrig utskriften">🌓 Tema</button>
</header>
<div class="ws-ambient"><span></span><span></span><span></span></div>
<div class="ws-layout">
  <aside class="ws-sidebar no-print">
    <div class="ws-sidebar-top">
      <div class="ws-mode-toggle">
        <button type="button" id="wsModePrint" class="ws-mode-btn active">📄 Skrivbar</button>
        <button type="button" id="wsModeInteractive" class="ws-mode-btn">💻 Interaktiv</button>
      </div>
      <label id="wsNumlineLabel" style="display:none;"><input type="checkbox" id="wsNumlineToggle"> 📏 Som tallinjeblad</label>
      <div class="ws-mode-toggle" id="wsNumlineTypeToggle" style="display:none;">
        <button type="button" class="ws-mode-btn ws-numline-type-btn active" data-type="graderad" title="Omärkta streck, bara 0:an utsatt">Graderad</button>
        <button type="button" class="ws-mode-btn ws-numline-type-btn" data-type="oppen" title="Tom linje med pilar — eleven placerar själv sina markeringar">Öppen</button>
      </div>
      <label id="wsWorkSpaceLabel" title="Lägger till ett linjerat fält under varje uppgift för stödberäkningar — färre uppgifter får då plats per utskrift"><input type="checkbox" id="wsWorkSpace"> 📝 Utrymme för uträkningar</label>
    </div>

    <div class="ws-sidebar-actions">
      <label id="wsAnswerKeyLabel"><input type="checkbox" id="wsAnswerKey" checked> Facit</label>
      <span id="wsTotalCount" class="ws-total-count"></span>
      <div class="wc-spacer"></div>
      <button id="wsRegenerate">🔄 Nytt</button>
      <button id="wsPrint">🖨️ Skriv ut</button>
      <button id="wsCheck" style="display:none;">✅ Rätta</button>
      <button type="button" id="wsResetAll" class="wc-pill-btn" title="Avmarkerar alla val och tömmer arbetsbladet">🗑️ Nollställ</button>
    </div>
    <div id="wsScore" class="ws-score-line" style="display:none;"></div>

    <div class="ws-table">
      <div class="ws-table-group">
        <div class="ws-table-grouphead">
          <span class="ws-table-group-label">Heltal</span>
          <div class="ws-neg-level"><span class="ws-neg-level-label">Negativa tal</span><div class="ws-mode-toggle ws-neg-toggle"><button type="button" class="ws-mode-btn ws-int-neg-btn active" data-level="inga">Inga</button><button type="button" class="ws-mode-btn ws-int-neg-btn" data-level="ett">Ett</button><button type="button" class="ws-mode-btn ws-int-neg-btn" data-level="flera">Flera</button></div></div>
        </div>
        <div class="ws-table-row" data-row="intAddSub">
          <div class="ws-row-top">
            <label class="ws-row-check"><input type="checkbox" class="ws-row-toggle" data-cat="intAddSub"> Addition och subtraktion</label>
            <input type="number" class="ws-row-count" data-cat="intAddSub" min="0" max="60" value="15">
          </div>
          <div class="ws-row-controls-wrap">
            <div class="ws-row-controls">
            <label><input type="checkbox" id="wsAdvanced"> Avancerad</label>
            <div class="ws-mode-toggle">
              <button type="button" class="ws-mode-btn ws-int-addsub-level-btn active" data-level="1" title="Tal ca 1–10">Nivå 1</button>
              <button type="button" class="ws-mode-btn ws-int-addsub-level-btn" data-level="2" title="Tal ca 1–100">Nivå 2</button>
            </div>
          </div>
          </div>
        </div>
        <div class="ws-table-row" data-row="intMul">

<script>
// ═══════════════════════════════════════════════════════════════════
//  ARBETSBLAD — blandad ("interleaved") träning, utskriftsvänligt
//
//  Utlyft ur "Tallinje"-verktyget som en fristående grund. Byggd kring
//  ett KATEGORIREGISTER (se CATEGORIES nedan): varje kategori är en
//  kombination av talform × räknesätt (t.ex. "Heltal +/−", "Bråk ×")
//  och registrerar bara en label, grupp och en gen()-funktion.
//
//  wsActiveCategories (ett Set) håller reda på vilka kategorier som
//  är ikryssade just nu. Ett RENT arbetsblad = en kategori ikryssad.
//  Ett BLANDAT arbetsblad = flera. Det finns ingen separat "mix-logik"
//  — genOneProblem() slumpar bara vilken av de aktiva kategorierna
//  som ska generera nästa uppgift. Det gör att mixning kommer gratis
//  så fort en ny kategori registreras korrekt.
//
//  Varje gen()-funktion returnerar { parts, answerKind, answer }:
//  - parts: en lista av uttrycks-"tokens" som wsProblemHTML() ritar
//    upp i tur och ordning — {t:'txt', text} för vanlig text/operatorer,
//    {t:'frac', num, den} för ett stapelbråk. Detta ersätter det gamla
//    {text}/{num,den,isFraction}-kontraktet (adaptLegacy() nedan gör
//    integer-generatorerna bakåtkompatibla utan att de behöver skrivas om).
//  - answerKind: 'integer' eller 'fraction' — styr både hur facit
//    formateras (wsAnswerHTML) och hur inmatningen ser ut i interaktivt
//    läge (en sifferruta, respektive täljare/nämnare-rutor).
//  - answer: ett tal (integer) eller {num, den} (fraction, alltid
//    förkortat, nämnare > 0).
//
//  TÄNKT VIDAREUTVECKLING:
//  - Decimaltal blir en egen grupp i CATEGORIES ("Decimal +/−" osv.)
//    med en egen fmtDecimal() (komma, samma parentesregel som fmtNum).
//  - "Blandad form" (decimal + bråk) blir sin egen kategori vars
//    gen() väljer vilken form svaret ska anges i.
//  - simplifyFrac()/toMixed() nedan är redan generella nog att
//    återanvändas av alla framtida bråk-/blandad-form-kategorier.
// ═══════════════════════════════════════════════════════════════════

function fmtNum(n) { return n < 0 ? `(${n})` : String(n); }

// ═══════════════════════════════════════════════════════════════════
//  BRÅK — hjälpfunktioner delade av alla bråkkategorier (och senare
//  även "blandad form"). Konventionen: en förkortad bråk har alltid
//  nämnare > 0 (tecknet flyttas till täljaren av simplifyFrac).
// ═══════════════════════════════════════════════════════════════════
function wsGcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { [a, b] = [b, a % b]; }
  return a || 1;
}
function simplifyFrac(num, den) {
  if (den < 0) { num = -num; den = -den; }
  const g = wsGcd(num, den);
  return { num: num / g, den: den / g };
}
// Delar upp en förkortad bråk i heltalsdel + resterande bråkdel, för
// visning som blandad form i facit (t.ex. 7/2 → {whole:3, num:1, den:2}).
function toMixed(num, den) {
  const sign = num < 0 ? -1 : 1;
  const an = Math.abs(num);
  return { whole: sign * Math.floor(an / den), num: sign * (an % den), den };
}

function wsRandInt(lo, hi) { return Math.floor(Math.random() * (hi - lo + 1)) + lo; }
function wsRandNonZero(lo, hi) {
  let n;
  do { n = wsRandInt(lo, hi); } while (n === 0);
  return n;
}

// Delad av alla Heltal-generatorer: respekterar "Negativa tal"-kryssrutan.
// Delad hjälpare för alla tre domäner (Heltal/Bråk/Decimal): tar en lista med
// POSITIVA storlekar och en nivå ('inga'|'ett'|'flera'), och returnerar dem
// med tecken enligt nivån:
//  - 'inga'  : alla positiva
//  - 'ett'   : exakt EN slumpmässig term blir negativ, resten positiva
//  - 'flera' : varje term slantsinglas oberoende (kan bli 0 upp till alla negativa)
function wsApplyNegLevel(mags, level) {
  if (level === 'inga') return mags.slice();
  if (level === 'ett') {
    const idx = wsRandInt(0, mags.length - 1);
    return mags.map((m, i) => (i === idx) ? -m : m);
  }
  return mags.map(m => (Math.random() < 0.5) ? -m : m);
}
// Ren magnitud (aldrig 0), respektive magnitud som utesluter ental (1) —
// används för nämnare/divisorer/multiplikationsfaktorer så vi undviker
// triviala uppgifter som "5/1" eller "1 × 7".
function wsIntMag(maxAbs) { return wsRandNonZero(1, maxAbs); }
function wsIntMagNoUnit(maxAbs) { return wsRandInt(2, Math.max(2, maxAbs)); }

function genWorksheetProblem(advanced) {
  const big = (wsIntAddSubLevel === 2);
  const t1Max = big ? 200 : 10, termMax = big ? 99 : 9;
  const termCount = advanced ? wsRandInt(3, 4) : 2; // totalt antal termer
  const mags = [wsIntMag(t1Max)];
  for (let i = 1; i < termCount; i++) mags.push(wsIntMag(termMax));
  const signed = wsApplyNegLevel(mags, wsIntNegLevel);
  let total = signed[0];
  const parts = [fmtNum(signed[0])];
  for (let i = 1; i < termCount; i++) {
    const op = Math.random() < 0.5 ? '+' : '−';
    total += (op === '+') ? signed[i] : -signed[i];
    parts.push(op, fmtNum(signed[i]));
  }
  return { text: parts.join(' '), answer: total, isFraction: false };
}

// ═══════════════════════════════════════════════════════════════════
//  MULTIPLIKATION & DIVISION — tre nivåer styr multiplikationens
//  komplexitet (faktorantal/storlek); wsIntMethod styr HUR divisions-
//  halvan konstrueras, oberoende av nivå:
//   - 'kort'   : klassisk kortdivision, komplexitet skalar med nivå
//                (samma som tidigare — täljare/nämnare, ev. som
//                produkter eller summor som måste räknas ut först).
//   - 'delar'  : täljaren delas medvetet upp i en "rund" tiotals-del +
//                en entals-del (t.ex. 91 ÷ 7 = 70 ÷ 7 + 21 ÷ 7).
//   - 'stort'  : 3–4-siffrig täljare ÷ en ensam siffra; oftast ett
//                jämnt heltal som kvot, men ibland (kortdivision
//                fortsatt förbi kommat) en kvot med 1–2 decimaler.
//  "isFraction" avgör om uttrycket ritas som ett bråk (täljare/nämnare)
//  eller som vanlig text.
// ═══════════════════════════════════════════════════════════════════

function genIntDivisionKort(level) {
  if (level === 1) {
    const [d, q] = wsApplyNegLevel([wsIntMagNoUnit(9), wsIntMag(9)], wsIntNegLevel);
    const n = d * q;
    return { num: fmtNum(n), den: fmtNum(d), answer: q, isFraction: true };
  }
  if (level === 2) {
    for (let i = 0; i < 60; i++) {
      const [a, b, c, d] = wsApplyNegLevel([wsIntMag(6), wsIntMag(6), wsIntMagNoUnit(5), wsIntMagNoUnit(5)], wsIntNegLevel);
      const N = a * b, D = c * d;
      if (D !== 0 && N % D === 0) {
        return { num: `${fmtNum(a)} · ${fmtNum(b)}`, den: `${fmtNum(c)} · ${fmtNum(d)}`, answer: N / D, isFraction: true };
      }
    }
    // Garanterat jämnt fallback om slumpen inte gav en delbar kombination
    const c = wsIntMagNoUnit(5), d = wsIntMagNoUnit(5);
    const q = wsIntMag(6);
    const D = c * d;
    return { num: `${fmtNum(D * q)} · 1`, den: `${fmtNum(c)} · ${fmtNum(d)}`, answer: q, isFraction: true };
  }
  // level 3: täljare och/eller nämnare är en summa/differens som måste
  // räknas ut innan själva divisionen utförs.
  for (let i = 0; i < 100; i++) {
    const singleDen = Math.random() < 0.5;
    const rawMags = singleDen
      ? [wsIntMag(9), wsIntMag(9), wsIntMagNoUnit(6)]
      : [wsIntMag(9), wsIntMag(9), wsIntMag(6), wsIntMag(6)];
    const signed = wsApplyNegLevel(rawMags, wsIntNegLevel);
    const n1 = signed[0], n2 = signed[1];
    const nOp = Math.random() < 0.5 ? '+' : '−';
    const N = (nOp === '+') ? n1 + n2 : n1 - n2;

    let denText, D;
    if (singleDen) {
      D = signed[2];
      denText = fmtNum(D);
    } else {
      const d1 = signed[2], d2 = signed[3];
      const dOp = Math.random() < 0.5 ? '+' : '−';
      D = (dOp === '+') ? d1 + d2 : d1 - d2;
      denText = `${fmtNum(d1)} ${dOp} ${fmtNum(d2)}`;
    }
    if (D !== 0 && Math.abs(D) !== 1 && N !== 0 && N % D === 0) {
      return { num: `${fmtNum(n1)} ${nOp} ${fmtNum(n2)}`, den: denText, answer: N / D, isFraction: true };
    }
  }
  // Garanterat jämnt fallback
  const d = wsRandInt(2, 6);
  const q = wsIntMag(6);
  const n1 = wsRandInt(1, 5);
  const n2 = d * q - n1;
  return { num: `${fmtNum(n1)} + ${fmtNum(n2)}`, den: fmtNum(d), answer: q, isFraction: true };
}

// "Uppdelning i delar": kvoten är alltid ett tvåsiffrigt tal (tiotal +
// ental), så täljaren går att dela upp rent, t.ex. 91 ÷ 7 = 70÷7 + 21÷7.
// Metoden handlar om positiva tals platsvärde, så negativa tal kopplas
// bort här oavsett negativ-nivå.
function genIntDivisionDelning() {
  const d = wsRandInt(2, 9);
  const tens = wsRandInt(1, 9), ones = wsRandInt(1, 9);
  const q = tens * 10 + ones;
  const n = d * q;
  return { num: String(n), den: String(d), answer: q, isFraction: true };
}

// "Stort tal": 3–4-siffrig täljare ÷ en ensam siffra. Oftast (60%) ett
// jämnt heltal som kvot; annars (40%) fortsätter kortdivisionen förbi
// kommat och ger en kvot med 1–2 decimaler — nämnaren är då alltid
// 2, 4 eller 5, vilket garanterar att den decimalutvecklingen alltid
// tar slut inom två decimaler, oavsett täljare. Positiva tal, av samma
// skäl som "Uppdelning i delar".
function genIntDivisionStort() {
  if (Math.random() < 0.6) {
    const d = wsRandInt(2, 9);
    const lo = Math.ceil(100 / d), hi = Math.floor(9999 / d);
    const q = wsRandInt(lo, hi);
    const n = d * q;
    return { num: String(n), den: String(d), answer: q, isFraction: true };
  }
  const d = [2, 4, 5][wsRandInt(0, 2)];
  const dp = (d === 4) ? 2 : 1;
  const scale = Math.pow(10, dp);
  const n = wsRandInt(100, 9999);
  const scaledQuotient = n * scale / d; // alltid ett heltal eftersom d delar scale jämnt
  return { num: String(n), den: String(d), answer: { value: scaledQuotient, dp }, isFraction: true };
}

function genIntDivision(level) {
  if (wsIntMethod === 'delar') return genIntDivisionDelning();
  if (wsIntMethod === 'stort') return genIntDivisionStort();
  return genIntDivisionKort(level);
}

// Multiplikation — egen rad, egen nivåskala (oberoende av divisionens Nivå/Metod).
// Nivå 1: två faktorer. Nivå 2: tre faktorer. Nivå 3: fyra faktorer.
function genIntMultiplication(level) {
  const counts = { 1: 2, 2: 3, 3: 4 };
  const maxAbs = { 1: 9, 2: 6, 3: 5 }[level];
  const mags = Array.from({ length: counts[level] }, () => wsIntMagNoUnit(maxAbs));
  const signed = wsApplyNegLevel(mags, wsIntNegLevel);
  return { text: signed.map(fmtNum).join(' · '), answer: signed.reduce((a, b) => a * b, 1), isFraction: false };
}

// ═══════════════════════════════════════════════════════════════════
//  DECIMALTAL — multiplikation, division.
//  wsDecLevel (1|2) och wsDecNegLevel delas av alla tre kategorierna.
//
//  Tal representeras internally som {n: heltal, dp: antal decimaler}
//  (n / 10^dp) istället för JS-flyttal, för att undvika
//  avrundningsfel och för att kunna bygga uppgifter "baklänges" från
//  heltalskärnan — precis den metod som faktiskt lärs ut:
//   × : räkna kärnorna (n1×n2) som heltal, flytta sen decimaltecknet
//       dp1+dp2 steg — inget annat facit behövs än den uträkningen.
//   ÷ : nämnaren konstrueras alltid så att den, gjord till ett heltal,
//       går att förkorta ner till en ensam siffra (kortdivision).
// ═══════════════════════════════════════════════════════════════════
function intToDecimalStr(n, dp, wrapNeg) {
  const neg = n < 0;
  const s = String(Math.abs(n)).padStart(dp + 1, '0');
  const whole = s.slice(0, s.length - dp) || '0';
  const frac = dp > 0 ? ',' + s.slice(s.length - dp) : '';
  const str = whole + frac;
  if (!neg) return str;
  return wrapNeg ? `(-${str})` : `-${str}`;
}

// Addition/subtraktion: båda talen har SAMMA antal decimaler (Nivå 1: 1 decimal,
// Nivå 2: 2 decimaler) — det är en förutsättning för att kunna räkna direkt.
function genDecimalAddSub() {
  const twoDp = (wsDecAddSubLevel === 2);
  const dp = twoDp ? wsRandInt(1, 2) : 1;
  const coreMax = twoDp ? 999 : 99;
  const [n1, n2] = wsApplyNegLevel([wsRandNonZero(1, coreMax), wsRandNonZero(1, coreMax)], wsDecNegLevel);
  const op = Math.random() < 0.5 ? '+' : '−';
  const total = (op === '+') ? n1 + n2 : n1 - n2;
  return {
    parts: [
      { t: 'txt', text: intToDecimalStr(n1, dp, true) },
      { t: 'txt', text: op },
      { t: 'txt', text: intToDecimalStr(n2, dp, true) },
    ],
    answerKind: 'decimal', answer: { value: total, dp },
  };
}

function genDecimalMul() {
  const bothDecimal = (wsDecLevel === 2);
  const coreMax = bothDecimal ? 45 : 9; // "siffrorna" i multiplikationen
  const c1 = wsRandNonZero(1, coreMax), c2 = wsRandNonZero(1, coreMax);
  const dp1 = wsRandInt(1, 2);
  const dp2 = bothDecimal ? wsRandInt(1, 2) : 0;
  const roundFactor = bothDecimal ? 1 : Math.pow(10, wsRandInt(2, 4)); // gör faktor 2 rund, t.ex. 30 000
  const [n1, n2] = wsApplyNegLevel([c1, c2 * roundFactor], wsDecNegLevel);
  const rawProduct = n1 * n2;
  const totalDp = dp1 + dp2;
  return {
    parts: [
      { t: 'txt', text: intToDecimalStr(n1, dp1, true) },
      { t: 'txt', text: '·' },
      { t: 'txt', text: intToDecimalStr(n2, dp2, true) },
    ],
    answerKind: 'decimal', answer: { value: rawProduct, dp: totalDp },
  };
}

function genDecimalDiv() {
  const d = wsRandInt(2, 9);                         // målnämnare efter förkortning — en ensam siffra
  const k = (wsDecLevel === 2) ? wsRandInt(2, 9) : 1; // hur mycket som måste förkortas bort
  const divisorInt  = d * k;
  const q = wsRandInt(2, 12);                         // kvoten hålls som ett rent heltal (kortdivisionen går jämnt upp)
  const dividendInt = divisorInt * q;
  const p = (wsDecLevel === 2) ? wsRandInt(1, 2) : 1;  // antal decimaler i den presenterade uppgiften

  const [n1, n2] = wsApplyNegLevel([dividendInt, divisorInt], wsDecNegLevel);
  const sign = (n1 < 0 ? -1 : 1) * (n2 < 0 ? -1 : 1);

  return {
    // Bråkform — samma stapelbråks-utseende (täljare/nämnare) som Bråk +/−,
    // inte ÷-tecken och inte en amerikansk "long division"-bracket.
    parts: [{ t: 'frac', num: intToDecimalStr(n1, p, true), den: intToDecimalStr(n2, p, true) }],
    answerKind: 'integer', answer: sign * q,
  };
}

// ═══════════════════════════════════════════════════════════════════
//  BRÅKFORM — addition/subtraktion, multiplikation, division.
//  wsFracNegLevel styr om täljarna får bli negativa (samma tema som
//  heltalsdelen: negativa tal ska inte vara ett specialfall utan en
//  naturlig del av träningen).
//
//  VIKTIGT: svårighetsgraden vid +/− drivs av RELATIONEN mellan
//  nämnarna (samma nämnare → multipel av varandra → relativt prima),
//  inte av hur stora talen är — det är det steget som avgör om man
//  kan skala om en enda nämnare eller måste multiplicera ihop båda,
//  och om uppgiften går att rita/visualisera. Vid × och ÷ finns inget
//  gemensam-nämnare-steg, så där styr wsFracMagLevel (talens storlek)
//  precis som tidigare. Därför två separata nivå-variabler.
// ═══════════════════════════════════════════════════════════════════
function genFracMag(maxAbs) {
  return wsRandNonZero(1, maxAbs);
}

// Nivå 1 (relation): samma nämnare — enklast, ingen omskalning alls.
function genFracPairSameDen() {
  const den = wsRandInt(4, 10);
  return { a: { num: genFracMag(den + 2), den }, b: { num: genFracMag(den + 2), den } };
}
// Nivå 2 (relation): en nämnare är en multipel av den andra — bara ETT
// av bråken behöver skalas om för att få gemensam nämnare.
function genFracPairMultiple() {
  const denSmall = wsRandInt(2, 6);
  const denBig = denSmall * wsRandInt(2, 3);
  const small = { num: genFracMag(denSmall), den: denSmall };
  const big   = { num: genFracMag(denBig), den: denBig };
  return (Math.random() < 0.5) ? { a: small, b: big } : { a: big, b: small };
}
// Nivå 3 (relation): nämnare utan gemensam faktor — BÅDA måste skalas
// om (gemensam nämnare = produkten), går sällan att rita enkelt.
function genFracPairCoprime() {
  let den1, den2;
  do { den1 = wsRandInt(2, 9); den2 = wsRandInt(2, 9); } while (wsGcd(den1, den2) !== 1);
  return { a: { num: genFracMag(den1), den: den1 }, b: { num: genFracMag(den2), den: den2 } };
}
// "Avancerad": en kedja av 3–4 termer istället för ett par. Nämnarrelationen
// (Nivå 1/2/3) tillämpas genom hela kedjan på samma sätt som för paren ovan.
function genFracTermsChain(count) {
  if (wsFracRelLevel === 1) {
    const den = wsRandInt(4, 10);
    return Array.from({ length: count }, () => ({ num: genFracMag(den + 2), den }));
  }
  if (wsFracRelLevel === 2) {
    let den = wsRandInt(2, 6);
    const terms = [{ num: genFracMag(den), den }];
    for (let i = 1; i < count; i++) {
      den = den * wsRandInt(2, 3);
      terms.push({ num: genFracMag(den), den });
    }
    return terms;
  }
  const dens = [];
  while (dens.length < count) {
    const cand = wsRandInt(2, 9);
    if (dens.every(d => wsGcd(d, cand) === 1)) dens.push(cand);
  }
  return dens.map(den => ({ num: genFracMag(den), den }));
}

// Används av × och ÷, där bara storleken (inte nämnarrelationen) spelar roll.
function genFractionTerm(denMax) {
  return { num: genFracMag(denMax), den: wsRandInt(2, denMax) };
}

function genFractionAddSub() {
  if (wsFracAdvanced.checked) return genFractionAddSubAdvanced();
  const { a, b } = (wsFracRelLevel === 1) ? genFracPairSameDen()
                  : (wsFracRelLevel === 2) ? genFracPairMultiple()
                  : genFracPairCoprime();
  const [aNum, bNum] = wsApplyNegLevel([a.num, b.num], wsFracNegLevel);
  const op = Math.random() < 0.5 ? '+' : '−';
  const an = aNum * b.den, bn = bNum * a.den, commonDen = a.den * b.den;
  const answer = simplifyFrac(op === '+' ? an + bn : an - bn, commonDen);
  return {
    parts: [
      { t: 'frac', num: fmtNum(aNum), den: String(a.den) },
      { t: 'txt', text: op },
      { t: 'frac', num: fmtNum(bNum), den: String(b.den) },
    ],
    answerKind: 'fraction', answer,
  };
}

// 3–4 termer i kedja, kombinerade med gemensam nämnare = produkten av
// samtliga (enklast, om än inte alltid den minsta gemensamma nämnaren).
function genFractionAddSubAdvanced() {
  const terms = genFracTermsChain(wsRandInt(3, 4));
  const signed = wsApplyNegLevel(terms.map(t => t.num), wsFracNegLevel);
  const commonDen = terms.reduce((p, t) => p * t.den, 1);
  let totalNum = signed[0] * (commonDen / terms[0].den);
  const parts = [{ t: 'frac', num: fmtNum(signed[0]), den: String(terms[0].den) }];
  for (let i = 1; i < terms.length; i++) {
    const op = Math.random() < 0.5 ? '+' : '−';
    const scaled = signed[i] * (commonDen / terms[i].den);
    totalNum += (op === '+') ? scaled : -scaled;
    parts.push({ t: 'txt', text: op }, { t: 'frac', num: fmtNum(signed[i]), den: String(terms[i].den) });
  }
  const answer = simplifyFrac(totalNum, commonDen);
  return { parts, answerKind: 'fraction', answer };
}

function genFractionMul() {
  const denMax = (wsFracMagLevel === 1) ? 6 : 12;
  // "Förkortningsbara faktorer": bygger två bråk med en gemensam faktor snett
  // över täljare/nämnare (t.ex. 7/25 × 5/49 → 1/5 × 1/7), så uppgiften går att
  // förkorta INNAN man multiplicerar ut, istället för att bara råka bli enkel.
  if (wsFracMulCancel.checked) {
    const primes = [2, 3, 5, 7, 11];
    let p, q;
    do { p = primes[wsRandInt(0, primes.length - 1)]; q = primes[wsRandInt(0, primes.length - 1)]; } while (p === q);
    const [xNum, yNum] = wsApplyNegLevel([p, q], wsFracNegLevel);
    const x = { num: xNum, den: q * q }, y = { num: yNum, den: p * p };
    const answer = simplifyFrac(x.num * y.num, x.den * y.den);
    return {
      parts: [
        { t: 'frac', num: fmtNum(x.num), den: String(x.den) },
        { t: 'txt', text: '·' },
        { t: 'frac', num: fmtNum(y.num), den: String(y.den) },
      ],
      answerKind: 'fraction', answer,
    };
  }
  const a = genFractionTerm(denMax), b = genFractionTerm(denMax);
  const [aNum, bNum] = wsApplyNegLevel([a.num, b.num], wsFracNegLevel);
  const answer = simplifyFrac(aNum * bNum, a.den * b.den);
  return {
    parts: [
      { t: 'frac', num: fmtNum(aNum), den: String(a.den) },
      { t: 'txt', text: '·' },
      { t: 'frac', num: fmtNum(bNum), den: String(b.den) },
    ],
    answerKind: 'fraction', answer,
  };
}

// Ett heltal (nämnare 1) skrivs som vanlig text, ett äkta bråk som ett stapelbråk —
// alltid som en LISTA av parts, så att en täljare/nämnare i det stora bråkstrecket
// kan vara antingen en enda term eller ett helt uttryck (se genFractionDiv nedan).
function fracOrIntParts(num, den) {
  return [(den === 1) ? { t: 'txt', text: fmtNum(num) } : { t: 'frac', num: fmtNum(num), den: String(den) }];
}

function genFractionDiv() {
  const denMax = (wsFracMagLevel === 1) ? 6 : 12;

  if (wsFracDivNested.checked) {
    // "Nästlad täljare": täljaren i det stora bråkstrecket är själv en
    // multiplikation av två bråk som måste räknas ut innan man kan utföra
    // själva divisionen.
    const xTerm = genFractionTerm(Math.min(denMax, 9)), yTerm = genFractionTerm(Math.min(denMax, 9));
    const bTerm = genFractionTerm(denMax);
    const [xNum, yNum, bNum] = wsApplyNegLevel([xTerm.num, yTerm.num, bTerm.num], wsFracNegLevel);
    const topVal = simplifyFrac(xNum * yNum, xTerm.den * yTerm.den);
    const topParts = [
      { t: 'frac', num: fmtNum(xNum), den: String(xTerm.den) },
      { t: 'txt', text: '·' },
      { t: 'frac', num: fmtNum(yNum), den: String(yTerm.den) },
    ];
    const answer = simplifyFrac(topVal.num * bTerm.den, topVal.den * bNum);
    return {
      parts: [{ t: 'bigfrac', top: topParts, bottom: fracOrIntParts(bNum, bTerm.den) }],
      answerKind: 'fraction', answer,
    };
  }

  if (Math.random() < 0.4) {
    // Innehållsdivision-vänligt specialfall: heltal ÷ enkelt bråk, t.ex. 3 ÷ 1/2
    // ("hur många halvor får plats i 3 hela?").
    const [topNum, bNum] = wsApplyNegLevel([genFracMag(9), 1], wsFracNegLevel);
    const bDen = wsRandInt(2, 5);
    const answer = simplifyFrac(topNum * bDen, bNum);
    return {
      parts: [{ t: 'bigfrac', top: fracOrIntParts(topNum, 1), bottom: fracOrIntParts(bNum, bDen) }],
      answerKind: 'fraction', answer,
    };
  }

  const aTerm = genFractionTerm(denMax), bTerm = genFractionTerm(denMax);
  const [aNum, bNum] = wsApplyNegLevel([aTerm.num, bTerm.num], wsFracNegLevel);
  const answer = simplifyFrac(aNum * bTerm.den, aTerm.den * bNum);
  return {
    // Stort vågrätt bråkstreck istället för ÷ eller snedstreck, enligt önskemål —
    // tydlig täljare (bråk, heltal eller ett uttryck) dividerad med tydlig nämnare.
    parts: [{ t: 'bigfrac', top: fracOrIntParts(aNum, aTerm.den), bottom: fracOrIntParts(bNum, bTerm.den) }],
    answerKind: 'fraction', answer,
  };
}

// Gör om de äldre heltals-generatorernas {text}/{num,den,isFraction}-form
// till det gemensamma parts-kontraktet, utan att skriva om dem. Svaret är
// vanligtvis ett rent heltal, men "Stort tal"-metoden kan ge ett
// {value,dp}-objekt (kvot med decimaler) — samma form som decimalkategorierna
// redan använder, så vi känner igen den och sätter rätt answerKind.
function adaptLegacy(p) {
  const parts = p.isFraction
    ? [{ t: 'frac', num: p.num, den: p.den }]
    : [{ t: 'txt', text: p.text }];
  const isDecimalAnswer = p.answer && typeof p.answer === 'object' && 'value' in p.answer && 'dp' in p.answer;
  return { parts, answerKind: isDecimalAnswer ? 'decimal' : 'integer', answer: p.answer };
}

// Rendera ett uttryck utifrån dess parts-lista (se kommentaren högst upp i filen).
function renderPart(part) {
  if (part.t === 'frac') {
    return `<span class="ws-frac"><span class="ws-frac-num">${part.num}</span><span class="ws-frac-den">${part.den}</span></span>`;
  }
  if (part.t === 'bigfrac') {
    const topHTML = part.top.map(renderPart).join(' ');
    const bottomHTML = part.bottom.map(renderPart).join(' ');
    return `<span class="ws-bigfrac"><span class="ws-bigfrac-top">${topHTML}</span><span class="ws-bigfrac-bottom">${bottomHTML}</span></span>`;
  }
  return `<span>${part.text}</span>`;
}
function wsProblemHTML(p) {
  return `<span class="wexpr">${p.parts.map(renderPart).join(' ')}</span>`;
}

// Formaterar ett svar för facit/rättning. Heltal och decimaltal skrivs rakt
// av; bråk visas förkortat, och om det är oäkta (|num| ≥ nämnare) läggs
// blandad form till inom parentes, eftersom pedagogiken vill se svar i
// blandad form när det är naturligt — men eleven matar in täljare/nämnare,
// så båda behöver visas.
function fracInlineHTML(n, d) {
  return `<span class="ws-frac" style="margin:0 3px;"><span class="ws-frac-num">${n}</span><span class="ws-frac-den">${d}</span></span>`;
}
function wsAnswerHTML(p) {
  if (p.answerKind === 'integer') return String(p.answer);
  if (p.answerKind === 'decimal') return intToDecimalStr(p.answer.value, p.answer.dp, false);
  const { num, den } = p.answer;
  if (den === 1) return String(num);
  if (Math.abs(num) < den) return fracInlineHTML(num, den);
  const m = toMixed(num, den);
  return `${fracInlineHTML(num, den)}<span style="color:var(--muted);font-weight:400;">&nbsp;(=&nbsp;${m.whole}&nbsp;</span>${fracInlineHTML(m.num, m.den)}<span style="color:var(--muted);font-weight:400;">)</span>`;
}

function genOneProblem() {

}

// En blank tallinje med bara 0:an markerad — eleven får själv peka ut var
// starttalet ligger, rita pilar för riktning och skriva ut antal steg.
function wsGradedNumberLineSVG() {
  const W = 640, H = 46, marginX = 16, N = 31; // 31 omärkta streck: -15..15, bara 0 får en siffra
  const usableW = W - marginX * 2;
  let ticks = '';
  for (let i = 0; i < N; i++) {
    const val = i - 15;
    const x = marginX + (usableW * i / (N - 1));
    const isZero = val === 0;
    const tickH = isZero ? 13 : 7;
    ticks += `<line x1="${x.toFixed(1)}" y1="${H/2-tickH}" x2="${x.toFixed(1)}" y2="${H/2+tickH}" stroke="#100e28" stroke-width="${isZero?2.2:1.1}"/>`;
    if (isZero) {
      ticks += `<text x="${x.toFixed(1)}" y="${H/2+24}" font-family="Sora" font-size="12" font-weight="700" text-anchor="middle" fill="#100e28">0</text>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H+16}" class="ws-numline" preserveAspectRatio="none">
    <line x1="${marginX}" y1="${H/2}" x2="${W-marginX}" y2="${H/2}" stroke="#100e28" stroke-width="1.5"/>
    ${ticks}
  </svg>`;
}

// "Öppen" tallinje: helt tom, bara en linje med EN solid pil åt höger —
// inget 0-läge alls. Eleven markerar själv var sitt första tal "bor" (även
// för stora tal som 245, där det inte är rimligt att skala mot en synlig
// 0:a) och gör sedan egna hopp för nästa term, gärna uppdelat i runda steg.
function wsOpenNumberLineSVG() {
  const W = 640, H = 46, m = 24, cy = H / 2;
  return `<svg viewBox="0 0 ${W} ${H+16}" class="ws-numline" preserveAspectRatio="none">
    <line x1="${m}" y1="${cy}" x2="${W-m-2}" y2="${cy}" stroke="#100e28" stroke-width="1.5"/>
    <polygon points="${W-m-14},${cy-7} ${W-m+2},${cy} ${W-m-14},${cy+7}" fill="#100e28"/>
  </svg>`;
}
function wsNumberLineSVG() {
  return (wsNumlineType === 'oppen') ? wsOpenNumberLineSVG() : wsGradedNumberLineSVG();
}

// Uppdaterar totalsumman som visas ovanför tabellen — summan av antalet
// för varje rad vars kryssruta är ikryssad.
function updateTotalCount() {

  wsRowCounts.forEach(inp => {
    if (wsActiveCategories.has(inp.dataset.cat)) sum += Math.max(0, parseInt(inp.value, 10) || 0);

  wsTotalCountEl.textContent = `Totalt: ${sum} uppgift${sum === 1 ? '' : 'er'}`;
  return sum;
}

// Bygger uppgiftslistan: exakt så många av VARJE ikryssad rad som dess eget
// antalsfält anger, sedan blandade så att samma typ inte klumpar ihop sig.
// Det är samma mekanism oavsett om en eller flera rader är ikryssade —
// mixning är bara "flera rader aktiva samtidigt", precis som i kategori-
// registret ovan.
function buildProblemSet() {
  let list = [];
  wsRowCounts.forEach(inp => {
    const cat = inp.dataset.cat;
    if (!wsActiveCategories.has(cat)) return;
    const count = Math.max(0, parseInt(inp.value, 10) || 0);
    for (let i = 0; i < count; i++) list.push(CATEGORIES[cat].gen());
  });
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  if (wsMode === 'numline' && list.length > 20) list = list.slice(0, 20);
  return list;
}

function renderWorksheet() {
  wsProblems = buildProblemSet();
  wsScoreEl.textContent = '';
  document.querySelectorAll('.ws-score-display').forEach(el => { el.textContent = ''; });
  worksheetGrid.classList.toggle('ws-grid-single', wsMode === 'numline');

  if (wsProblems.length === 0) {
    worksheetGrid.innerHTML = `<div class="ws-empty-state">Välj minst ett räknesätt i panelen till vänster för att fylla arbetsbladet.</div>`;
    worksheetAnswerGrid.innerHTML = '';
    worksheetAnswerPage.style.display = 'none';
    return;
  }

  if (wsMode === 'interactive') {
    worksheetAnswerPage.style.display = 'none'; // facit ska inte synas direkt i interaktivt läge
    worksheetGrid.innerHTML = wsProblems.map((p, i) => {
      const inputHTML = (p.answerKind === 'fraction')
        ? `<span class="ws-frac-input no-print">
             <input type="number" id="wsAnsNum${i}" title="Täljare">
             <span class="ws-frac-input-bar"></span>
             <input type="number" id="wsAnsDen${i}" title="Nämnare">
           </span>`
        : (p.answerKind === 'decimal')
          ? `<input type="text" inputmode="decimal" class="ws-answer-input no-print" id="wsAns${i}" placeholder="t.ex. 3,5">`
          : `<input type="number" class="ws-answer-input no-print" id="wsAns${i}">`;
      return `
      <div class="worksheet-problem" data-idx="${i}">
        <span class="wnum">${i + 1}.</span>
        ${wsProblemHTML(p)}<span>&nbsp;=</span>
        ${inputHTML}
        <span class="ws-feedback no-print" id="wsFeedback${i}"></span>
      </div>`;
    }).join('');
  } else if (wsMode === 'numline') {
    worksheetGrid.innerHTML = wsProblems.map((p, i) => `
      <div class="worksheet-problem ws-numline-row">
        <div><span class="wnum">${i + 1}.</span> ${wsProblemHTML(p)}<span>&nbsp;=&nbsp;______</span></div>
        ${wsNumberLineSVG()}
      </div>`).join('');
    worksheetAnswerGrid.innerHTML = wsProblems.map((p, i) =>
      `<div><b>${i + 1}.</b> ${wsAnswerHTML(p)}</div>`).join('');
    worksheetAnswerPage.style.display = wsAnswerKey.checked ? '' : 'none';
  } else {
    const showWork = wsWorkSpace.checked;
    worksheetGrid.innerHTML = wsProblems.map((p, i) => showWork ? `
      <div class="worksheet-problem ws-has-workspace">
        <div class="wproblem-line">
          <span class="wnum">${i + 1}.</span>
          ${wsProblemHTML(p)}<span>&nbsp;=</span>
          <span class="wanswer-line"></span>
        </div>
        <div class="ws-work-space"></div>
      </div>` : `
      <div class="worksheet-problem">
        <span class="wnum">${i + 1}.</span>
        ${wsProblemHTML(p)}<span>&nbsp;=</span>
        <span class="wanswer-line"></span>
      </div>`).join('');
    worksheetAnswerGrid.innerHTML = wsProblems.map((p, i) =>
      `<div><b>${i + 1}.</b> ${wsAnswerHTML(p)}</div>`).join('');
    worksheetAnswerPage.style.display = wsAnswerKey.checked ? '' : 'none';
  }
}

// Bygger en liten rund badge (✓/✗) + text, delas av alla tre svarstyper.
function wsFeedbackHTML(isCorrect, correctAnswerHTML) {
  const badge = `<span class="ws-feedback-badge">${isCorrect ? '✓' : '✗'}</span>`;
  return isCorrect ? `${badge} Rätt` : `${badge} Rätt svar: ${correctAnswerHTML}`;
}

function checkWorksheetAnswers() {
  let correct = 0, answered = 0;
  wsProblems.forEach((p, i) => {
    const fb  = document.getElementById('wsFeedback' + i);
    const row = document.querySelector(`.worksheet-problem[data-idx="${i}"]`);

    if (p.answerKind === 'fraction') {
      const numEl = document.getElementById('wsAnsNum' + i), denEl = document.getElementById('wsAnsDen' + i);
      if (numEl.value === '' || denEl.value === '') { row.classList.remove('ws-correct','ws-wrong'); fb.textContent=''; return; }
      answered++;
      const sn = parseInt(numEl.value, 10), sd = parseInt(denEl.value, 10);
      const isCorrect = sd !== 0 && sn * p.answer.den === p.answer.num * sd; // korsvis likhet — godtar icke förkortade svar
      if (isCorrect) correct++;
      row.classList.toggle('ws-correct', isCorrect);
      row.classList.toggle('ws-wrong', !isCorrect);
      fb.innerHTML = wsFeedbackHTML(isCorrect, wsAnswerHTML(p));
      return;
    }

    if (p.answerKind === 'decimal') {
      const input = document.getElementById('wsAns' + i);
      if (input.value.trim() === '') { row.classList.remove('ws-correct','ws-wrong'); fb.textContent=''; return; }
      answered++;
      const parsed = parseFloat(input.value.trim().replace(',', '.'));
      const expected = p.answer.value / Math.pow(10, p.answer.dp);
      const isCorrect = !isNaN(parsed) && Math.abs(parsed - expected) < 1e-6;
      if (isCorrect) correct++;
      row.classList.toggle('ws-correct', isCorrect);
      row.classList.toggle('ws-wrong', !isCorrect);
      fb.innerHTML = wsFeedbackHTML(isCorrect, wsAnswerHTML(p));
      return;
    }

    const input = document.getElementById('wsAns' + i);
    if (input.value === '') { row.classList.remove('ws-correct','ws-wrong'); fb.textContent=''; return; }
    answered++;
    const isCorrect = parseInt(input.value, 10) === p.answer;
    if (isCorrect) correct++;
    row.classList.toggle('ws-correct', isCorrect);
    row.classList.toggle('ws-wrong', !isCorrect);
    fb.innerHTML = wsFeedbackHTML(isCorrect, String(p.answer));
  });
  const scoreText = `${correct} av ${answered} besvarade rätt (${wsProblems.length} totalt)`;
  wsScoreEl.textContent = scoreText;
  document.querySelectorAll('.ws-score-display').forEach(el => { el.textContent = scoreText; });
}

function setWorksheetMode(mode) {
  wsMode = mode;
  wsModePrint.classList.toggle('active', mode === 'print' || mode === 'numline');
  wsModeInteractive.classList.toggle('active', mode === 'interactive');
  wsAnswerKeyLabel.style.display = (mode === 'interactive') ? 'none' : '';
  wsPrintBtn.style.display       = (mode === 'interactive') ? 'none' : '';
  wsCheckBtn.style.display       = (mode === 'interactive') ? '' : 'none';
  wsScoreEl.style.display        = (mode === 'interactive') ? '' : 'none';
  wsInteractiveBar.style.display = (mode === 'interactive') ? '' : 'none';
  if (mode !== 'interactive') document.body.classList.remove('ws-focus-mode');
  document.body.classList.toggle('ws-mode-interactive', mode === 'interactive');
  renderWorksheet();
}

// Tallinjeblad är egentligen en variant av "Skrivbar", inte ett eget jämbördigt
// läge — och det blir bara märkligt för bråk/decimal (t.ex. bråkdivision på en
// tallinje ger inte mening). Så kryssrutan visas bara när enbart heltalskategorier
// är aktiva, och faller automatiskt tillbaka till vanlig "Skrivbar" annars.
function numlineEligible() {
  return Array.from(wsActiveCategories).every(id => id === 'intAddSub' || id === 'intMul' || id === 'intDiv');
}
function updateNumlineAvailability() {
  const eligible = numlineEligible();
  wsNumlineLabel.style.display = eligible ? '' : 'none';
  if (!eligible && wsNumlineToggle.checked) {
    wsNumlineToggle.checked = false;
    if (wsMode === 'numline') setWorksheetMode('print');
  }
  wsNumlineTypeGroup.style.display = (eligible && wsNumlineToggle.checked) ? '' : 'none';
}
function applyPrintFamilyMode() {
  setWorksheetMode((wsNumlineToggle.checked && numlineEligible()) ? 'numline' : 'print');
  updateNumlineAvailability();
}

// Radens kryssruta styr en riktig accordion: kontrollerna (nivåer, metod,
// checkboxar) fälls ut mjukt när räknesättet är aktiverat, och fälls ihop
// kompakt annars — förutsägbart och begränsat till just den egna raden.
function updateRowEnabledState(row) {
  const cb = row.querySelector('.ws-row-toggle');
  const on = cb.checked;
  row.classList.toggle('ws-row-active', on);
  row.querySelectorAll('.ws-row-controls button, .ws-row-controls input, .ws-row-count').forEach(el => { el.disabled = !on; });
}
function updateAllRowStates() {
  document.querySelectorAll('.ws-table-row').forEach(updateRowEnabledState);
}

// Rubriken (wsTitle) är fritt redigerbar av läraren och rörs aldrig
// automatiskt. Den löpande sammanfattningen av vad arbetsbladet tränar på
// hamnar istället i en fotnot längst ner på sidan.
function updateTitle() {
  const ids = Array.from(wsActiveCategories);
  wsFootnote.textContent = ids.length
    ? 'Tränar på: ' + ids.map(id => CATEGORIES[id].label).join(', ')
    : '';
}
function syncTitlePrint() {
  wsTitlePrint.textContent = wsTitle.value.trim() || '\u00A0';
}
wsTitle.addEventListener('input', syncTitlePrint);

// Sätter en pill-knappsgrupp tillbaka till sitt första (standard-)alternativ
// och returnerar den knappen, så anroparen kan läsa av dataset-värdet.
function resetButtonGroup(btns) {
  btns.forEach((b, i) => b.classList.toggle('active', i === 0));
  return btns[0];
}

function resetAllSettings() {
  // Kategorier: allt avmarkerat, arbetsbladet blir tomt igen
  wsRowToggles.forEach(cb => { cb.checked = false; });
  wsActiveCategories.clear();
  updateAllRowStates();

  // Antal per rad tillbaka till ursprungsvärdena
  const defaultCounts = { intAddSub: 15, intMul: 10, intDiv: 10, fracAddSub: 10, fracMul: 10, fracDiv: 10, decAddSub: 10, decMul: 10, decDiv: 10 };
  wsRowCounts.forEach(inp => { inp.value = defaultCounts[inp.dataset.cat] ?? 10; });

  // Svårighetsgrader och metoder tillbaka till första alternativet
  wsIntAddSubLevel = 1; resetButtonGroup(wsIntAddSubLevelBtns);
  wsIntMulLevel = 1; resetButtonGroup(wsIntMulLevelBtns);
  wsIntDivLevel = 1; resetButtonGroup(wsIntDivLevelBtns);
  wsIntMethod = 'kort'; resetButtonGroup(wsIntMethodBtns);
  wsFracRelLevel = 1; resetButtonGroup(wsFracRelBtns);
  wsFracMagLevel = 1; resetButtonGroup(wsFracMagBtns);
  wsDecAddSubLevel = 1; resetButtonGroup(wsDecAddSubLevelBtns);
  wsDecLevel = 1; resetButtonGroup(wsDecLevelBtns);
  wsNumlineType = 'graderad'; resetButtonGroup(wsNumlineTypeBtns);

  // Negativ-nivåer tillbaka till "Inga"
  wsIntNegLevel = 'inga'; resetButtonGroup(wsIntNegBtns);
  wsFracNegLevel = 'inga'; resetButtonGroup(wsFracNegBtns);
  wsDecNegLevel = 'inga'; resetButtonGroup(wsDecNegBtns);

  // Övriga kryssrutor
  wsAdvanced.checked = false;
  wsFracAdvanced.checked = false;
  wsFracMulCancel.checked = false;
  wsFracDivNested.checked = false;
  wsAnswerKey.checked = true;
  wsNumlineToggle.checked = false;
  wsWorkSpace.checked = false;

  // Rubrik tillbaka till tom platshållare
  wsTitle.value = '';
  syncTitlePrint();

  updateNumlineAvailability();
  updateTotalCount();
  updateTitle();
  renderWorksheet();
}
wsResetAll.addEventListener('click', resetAllSettings);

document.getElementById('wsRegenerate').addEventListener('click', renderWorksheet);

wsDecAddSubLevelBtns.forEach(btn => {

    wsNumlineTypeBtns.forEach(b => b.classList.toggle('active', b === btn));
    renderWorksheet();
  });
});
wsRowToggles.forEach(cb => {
  cb.addEventListener('change', () => {
    const cat = cb.dataset.cat;
    if (cb.checked) wsActiveCategories.add(cat); else wsActiveCategories.delete(cat);
    updateRowEnabledState(cb.closest('.ws-table-row'));
    updateNumlineAvailability();
    updateTotalCount();
    updateTitle();
    renderWorksheet();
  });
});
wsRowCounts.forEach(inp => {
  inp.addEventListener('input', () => {
    updateTotalCount();
    renderWorksheet();
  });
});
wsFocusToggle.addEventListener('click', () => {
  const on = document.body.classList.toggle('ws-focus-mode');
  wsFocusToggle.classList.toggle('active', on);
});
document.querySelectorAll('.ws-btn-regenerate').forEach(btn => btn.addEventListener('click', renderWorksheet));
document.querySelectorAll('.ws-btn-check').forEach(btn => btn.addEventListener('click', checkWorksheetAnswers));

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
updateAllRowStates();
updateNumlineAvailability();
syncTitlePrint();

updateGlassToggleUI();
