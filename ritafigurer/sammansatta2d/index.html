<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sammansatta figurer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sora:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#f6f4ff;color:#100e28;font:15px/1.45 'Sora',sans-serif;min-height:100vh}
.amb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
.a1{width:440px;height:440px;background:#66C7C2;top:-100px;left:-120px}
.a2{width:380px;height:380px;background:#F4A261;right:-120px;top:32%}
.a3{width:420px;height:420px;background:#EC6095;bottom:-160px;left:28%}
header{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;padding:0 24px;background:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);box-shadow:0 4px 24px rgba(0,0,0,.18);color:#fff}
header h1{font:700 20px 'Montserrat',sans-serif;margin:0;color:#fff}
header span{margin-left:14px;font-size:13px;color:rgba(255,255,255,.9)}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:350px 1fr;gap:16px;padding:16px 24px 32px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:18px;box-shadow:0 10px 22px rgba(48,107,240,.12),0 2px 6px rgba(16,14,40,.05)}
h2{font:700 14px 'Montserrat',sans-serif;margin:0 0 8px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;font-size:13px;color:#585078}
input[type=text],select{width:150px;min-height:36px;padding:4px 8px;border:1.5px solid #ccc5f0;border-radius:8px;background:#fff;color:#100e28;font:inherit;font-size:13px}
input[type=color]{width:48px;height:36px;border:1.5px solid #ccc5f0;border-radius:8px;background:#fff;padding:2px}
input[type=range]{width:150px}
input[type=checkbox]{width:20px;height:20px;accent-color:#306BF0}
.tp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tp button{min-height:40px;padding:0 12px;border:1.5px solid #ccc5f0;background:#eae6ff;color:#306BF0;border-radius:8px;cursor:pointer;font:600 12px 'Sora',sans-serif}
.btn{min-height:44px;border:0;background:#306BF0;color:#fff;padding:0 18px;border-radius:8px;cursor:pointer;font:600 13px 'Sora',sans-serif;margin:4px 6px 4px 0}
.btn.alt{background:#eae6ff;color:#306BF0;border:1.5px solid #ccc5f0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #306BF0;outline-offset:2px}
#cv{width:100%;height:auto;background:#fff;border-radius:14px;border:1px solid #ccc5f0;touch-action:none;display:block;user-select:none}
.hint{font-size:13px;color:#585078;margin:0 0 6px}
#wrap{position:relative}
#pop{position:absolute;z-index:5;display:none;width:290px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px) saturate(160%);border:1px solid #ccc5f0;border-radius:14px;padding:10px 12px;box-shadow:0 10px 22px rgba(48,107,240,.2)}
#pop .pr{display:flex;gap:6px;margin-bottom:8px}
#pop .pb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px;padding:4px;border:1.5px solid #ccc5f0;border-radius:8px;background:#eae6ff;color:#306BF0;cursor:pointer;font:600 11px 'Sora',sans-serif}
#pop .pcs{flex-wrap:wrap}#pop .pcs .pb{flex:1 1 28%}
#pop .pb.on{background:#306BF0;color:#fff;border-color:#306BF0}
#pop input[type=text],#pop select{width:110px}
</style>
</head>
<body>
<div class="amb a1"></div><div class="amb a2"></div><div class="amb a3"></div>
<header><h1>Sammansatta figurer</h1><span>Bygg egna figurer med hörn, hjälplinjer, vinklar och flyttbara etiketter</span></header>
<main>
<div class="col">
<div class="card"><h2>Börja med</h2>
<div class="tp" id="ps"></div>
<button class="btn alt" id="bcut">Hjälplinje mellan två hörn</button><button class="btn alt" id="bcir">+ Cirkel</button><button class="btn alt" id="btxt">+ Egen text</button>
<div style="margin-top:6px"><button class="btn alt" id="bun">Ångra</button><button class="btn alt" id="bre">Gör om</button><button class="btn alt" id="bsv">Spara figur</button><button class="btn alt" id="bop">Öppna figur</button><input type="file" id="fo" accept=".json,application/json" hidden></div></div>
<div class="card"><h2>Markerat</h2><p class="hint" id="hint"></p><div id="insp"></div></div>
<div class="card"><h2>Mått och utseende</h2>
<label>Enhet<input type="text" id="unit" value="cm"></label>
<label>Längd per ruta<input type="text" id="per" value="1"></label>
<label>Visa längder<input type="checkbox" id="len" checked></label>
<label>Visa hörnnamn<input type="checkbox" id="names" checked></label>
<label>Hörnpunkter<input type="checkbox" id="dots"></label>
<label>Fastna på<select id="snap"><option value="1">Hela rutor</option><option value=".5">Halva rutor</option></select></label>
<label>Visa rutnät<input type="checkbox" id="grid" checked></label>
<label>Fyllning på<input type="checkbox" id="fillon"></label>
<label>Fyllning<input type="color" id="fill" value="#cdeeec"></label>
<label>Linjefärg<input type="color" id="stroke" value="#100e28"></label>
<label>Linjetjocklek<input type="range" id="sw" min="1" max="6" step=".5" value="2"></label>
<label>Textstorlek<input type="range" id="fs" min="12" max="28" value="17"></label>
<label>Storlek på markeringar<input type="range" id="ms" min="10" max="40" value="20"></label>
<label>Svartvit utskrift<input type="checkbox" id="bw"></label>
<label>Genomskinlig bakgrund<input type="checkbox" id="tp"></label>
</div>
</div>
<div class="card"><div id="wrap"><svg id="cv" viewBox="0 0 640 480"></svg><div id="pop"></div></div>
<div style="margin-top:12px"><button class="btn" id="cp">Kopiera bild</button><button class="btn alt" id="png">Ladda ner PNG</button><button class="btn alt" id="svg">Ladda ner SVG</button></div></div>
</main>
<script>
const W=640,H=480,C=40,OX=40,OY=40,ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const $=id=>document.getElementById(id),fmt=n=>String(+n.toFixed(2)).replace('.',','),num=s=>parseFloat(String(s).replace(',','.'));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const gr=c=>{if(!c||c=='none')return c;const n=parseInt(c.slice(1),16),y=.3*(n>>16)+.59*(n>>8&255)+.11*(n&255),v=Math.round(255-(255-y)*.55);return'#'+(v*65793).toString(16).padStart(6,'0')};
const PS={'Rektangel':[[5,3],[11,3],[11,7],[5,7]],'Kvadrat':[[6,3],[10,3],[10,7],[6,7]],'L-form':[[1,1],[4,1],[4,4],[8,4],[8,7],[1,7]],'T-form':[[1,1],[9,1],[9,3],[6,3],[6,8],[4,8],[4,3],[1,3]],'Hus':[[1,4],[5,1],[9,4],[9,8],[1,8]],'Trapets':[[1,7],[10,7],[8,2],[3,2]],'Triangel':[[1,7],[9,7],[4,2]],'Port':[[2,7],[2,3],[8,3],[8,7]],'Stadion':[[3,2],[9,2],[9,6],[3,6]],'Cirkel':[[6,5],[10,5]]};
const PB={'Port':{1:1},'Stadion':{1:1,3:1},'Cirkel':{0:1,1:1}};
let N,E,K,A,O,TX,CIR=[],SEL=null,MODE=null,pend=null,drag=null,DEF={};
let hist=[],redo=[];
const snapJ=()=>JSON.stringify({N,E,K,A,O,TX,CIR});
function push(){if(!N)return;hist.push(snapJ());if(hist.length>80)hist.shift();redo=[]}
function setS(j){const d=JSON.parse(j);if(!Array.isArray(d.N)||d.N.length<2||!Array.isArray(d.E)||d.E.length!=d.N.length)throw 0;N=d.N;E=d.E;K=d.K||[];A=d.A||{};O=d.O||{};TX=d.TX||[];CIR=d.CIR||[];SEL=null;MODE=null;pend=null;ui();render()}
function undo(){if(!hist.length)return;redo.push(snapJ());setS(hist.pop())}
function redoF(){if(!redo.length)return;hist.push(snapJ());setS(redo.pop())}
function asg(Ns){return Ns.reduce((t,a,k)=>{const c=Ns[(k+1)%Ns.length];return t+a.x*c.y-c.x*a.y},0)>=0?1:-1}
function arcPts(a,c,bu,sg,k){k=k||10;const L=Math.hypot(c.x-a.x,c.y-a.y);if(!L)return[];const q=Math.abs(bu)==2,r=q?L/Math.SQRT2:L/2,m={x:(a.x+c.x)/2,y:(a.y+c.y)/2},u=[(c.x-a.x)/L,(c.y-a.y)/L],sb=Math.sign(bu),bd=[sg*u[1]*sb,-sg*u[0]*sb],h=q?L/2:0,cen={x:m.x-bd[0]*h,y:m.y-bd[1]*h},th=q?Math.PI/2:Math.PI,a0=Math.atan2(a.y-cen.y,a.x-cen.x);
const pmx=cen.x+r*Math.cos(a0+th/2),pmy=cen.y+r*Math.sin(a0+th/2),sgn=((pmx-m.x)*bd[0]+(pmy-m.y)*bd[1])>0?1:-1,out=[];
for(let t=1;t<k;t++){const an=a0+sgn*th*t/k;out.push({x:cen.x+r*Math.cos(an),y:cen.y+r*Math.sin(an)})}return out}
const arcs=P=>{const n=N.length,sg=asg(N);return E.flatMap((e,i)=>e.bu?arcPts(N[i],N[(i+1)%n],e.bu,sg,12).map(px):[])};
const px=n=>[OX+n.x*C,OY+n.y*C],un=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
const ar=P=>P.reduce((s,p,i)=>{const q=P[(i+1)%P.length];return s+p[0]*q[1]-q[0]*p[1]},0);
function load(n){push();N=PS[n].map(([x,y])=>({x,y}));E=N.map((_,i)=>({st:0,t:'',bu:(PB[n]||{})[i]||0}));K=[];A={};O={};TX=[];CIR=[];if(n=='Cirkel')E[1].t='-';SEL=null;MODE=null;pend=null;ui();render()}
function opts(){const bw=$('bw').checked,f=$('fillon').checked?$('fill').value:'none';return{fill:bw?gr(f):f,s:bw?'#000000':$('stroke').value,w:+$('sw').value,fs:+$('fs').value,ms:+$('ms').value,len:$('len').checked,names:$('names').checked,dots:$('dots').checked,unit:$('unit').value,per:num($('per').value)||1}}
function figure(o,ui){const P=N.map(px),n=P.length,sg=ar(P)>=0?1:-1,labs=[];DEF={};
const add=(key,x,y,t,an)=>{if(t===''||t==null)return;DEF[key]={x,y};const f=O[key]||{dx:0,dy:0};labs.push({key,x:x+f.dx,y:y+f.dy,t,an:an||'middle'})};
const sw=`stroke="${o.s}" stroke-width="${o.w}" stroke-linecap="round"`,ds=' stroke-dasharray="7 6"',ln=(a,c,st)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" ${sw}${st?ds:''}/>`;
const pa=i=>{const a=P[i],c=P[(i+1)%n];if(!E[i].bu)return`L${c[0]} ${c[1]}`;const r=Math.hypot(c[0]-a[0],c[1]-a[1])/(Math.abs(E[i].bu)==2?Math.SQRT2:2);return`A${r} ${r} 0 0 ${(E[i].bu>0)==(sg>0)?1:0} ${c[0]} ${c[1]}`};
const pdp=`M${P[0][0]} ${P[0][1]}${P.map((_,i)=>pa(i)).join('')}Z`,cs=CIR.map(c=>({x:OX+c.x*C,y:OY+c.y*C,r:c.r*C,m:c.m})),adds=cs.filter(c=>!c.m),subs=cs.filter(c=>c.m);
const mk=(id,inner,bg)=>`<mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${bg||'#fff'}"/>${inner}</mask>`,cc=(c,f)=>`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="${f}"/>`,pf=f=>`<path d="${pdp}" fill="${f}"/>`;
let defs='';
if(subs.length)defs+=mk('mS',subs.map(c=>cc(c,'#000')).join(''));
if(cs.length)defs+=mk('m1',cs.map(c=>cc(c,'#000')).join(''));
adds.forEach((c,k)=>{defs+=mk('mA'+k,pf('#000')+adds.filter(x=>x!=c).map(x=>cc(x,'#000')).join('')+subs.map(x=>cc(x,'#000')).join(''))});
subs.forEach((c,k)=>{defs+=mk('mB'+k,pf('#fff')+adds.map(x=>cc(x,'#fff')).join('')+subs.filter(x=>x!=c).map(x=>cc(x,'#000')).join(''),'#000')});
let b=(defs?`<defs>${defs}</defs>`:'')+`<g${subs.length?' mask="url(#mS)"':''}><path d="${pdp}" fill="${o.fill}"/>${adds.map(c=>cc(c,o.fill)).join('')}</g>`;
let eg='';E.forEach((e,i)=>{if(e.st!=2)eg+=`<path d="M${P[i][0]} ${P[i][1]}${pa(i)}" fill="none" ${sw}${e.st==1?ds:''}/>`});
b+=`<g${cs.length?' mask="url(#m1)"':''}>${eg}</g>`;
adds.forEach((c,k)=>b+=`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="none" ${sw} mask="url(#mA${k})"/>`);
subs.forEach((c,k)=>b+=`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="none" ${sw} mask="url(#mB${k})"/>`);
K.forEach(k=>b+=ln(P[k.a],P[k.b],k.st));
const G=P.map((p,i)=>{let a=un(p,P[(i+1)%n]),c=un(p,P[(i+n-1)%n]);if(sg<0){const t=a;a=c;c=t}let th=Math.atan2(a[0]*c[1]-a[1]*c[0],a[0]*c[0]+a[1]*c[1]);if(th<0)th+=2*Math.PI;const h=th/2;return{a,c,th,bi:[a[0]*Math.cos(h)-a[1]*Math.sin(h),a[0]*Math.sin(h)+a[1]*Math.cos(h)]}});
const lt=(l,u)=>(o.len?fmt(l/C*o.per)+(o.unit?' '+o.unit:''):'');
E.forEach((e,i)=>{const a=P[i],c=P[(i+1)%n],dx=c[0]-a[0],dy=c[1]-a[1],l=Math.hypot(dx,dy)||1,d=16+o.ms*.3+(e.bu==1?l/2:e.bu==2?l*.207:0);add('e'+i,(a[0]+c[0])/2+sg*dy/l*d,(a[1]+c[1])/2-sg*dx/l*d,e.t==='-'?'':e.t||lt(l))});
K.forEach((k,j)=>{const a=P[k.a],c=P[k.b],dx=c[0]-a[0],dy=c[1]-a[1],l=Math.hypot(dx,dy)||1;add('c'+j,(a[0]+c[0])/2+dy/l*14,(a[1]+c[1])/2-dx/l*14,k.t==='-'?'':k.t||lt(l))});
P.forEach((p,i)=>{const g=G[i],an=A[i];if(!an||!an.on)return;const deg=g.th*180/Math.PI,s=o.ms;
if(Math.abs(deg-90)<.05){b+=`<path d="M${p[0]+g.a[0]*s} ${p[1]+g.a[1]*s} L${p[0]+(g.a[0]+g.c[0])*s} ${p[1]+(g.a[1]+g.c[1])*s} L${p[0]+g.c[0]*s} ${p[1]+g.c[1]*s}" fill="none" ${sw}/>`;const d=s*1.5+o.fs*.5;add('a'+i,p[0]+g.bi[0]*d,p[1]+g.bi[1]*d,an.t||'')}
else{const k=s*1.3,d=k+o.fs*.8+6;b+=`<path d="M${p[0]+g.a[0]*k} ${p[1]+g.a[1]*k} A${k} ${k} 0 ${g.th>Math.PI?1:0} 1 ${p[0]+g.c[0]*k} ${p[1]+g.c[1]*k}" fill="none" ${sw}/>`;add('a'+i,p[0]+g.bi[0]*d,p[1]+g.bi[1]*d,an.t||fmt(Math.round(deg*10)/10)+'°')}});
if(o.names)P.forEach((p,i)=>{const d=16+o.fs*.5;add('n'+i,p[0]-G[i].bi[0]*d,p[1]-G[i].bi[1]*d,N[i].n||ABC[i%26])});
if(o.dots)P.forEach(p=>b+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${o.s}"/>`);
CIR.forEach((c,j)=>{const cx=OX+c.x*C,cy=OY+c.y*C,r=c.r*C,mt=+c.mt,tx=(p,v)=>c.t==='-'?'':c.t||p+fmt(v*o.per)+(o.unit?' '+o.unit:'');
if(mt==1){b+=ln([cx,cy],[cx+r,cy],0)+`<circle cx="${cx}" cy="${cy}" r="3" fill="${o.s}"/>`;add('k'+j,cx+r/2,cy-14,tx('r = ',c.r))}
else if(mt==2){b+=ln([cx-r,cy],[cx+r,cy],0)+`<circle cx="${cx}" cy="${cy}" r="3" fill="${o.s}"/>`;add('k'+j,cx,cy-14,tx('d = ',2*c.r))}
else if(c.t&&c.t!=='-')add('k'+j,cx,cy,c.t)});
TX.forEach((t,i)=>{DEF['t'+i]={x:t.x,y:t.y};labs.push({key:'t'+i,x:t.x,y:t.y,t:t.t||'text',an:'middle'})});
const l=labs.map(q=>{const sel=ui&&SEL&&SEL.t=='l'&&SEL.key==q.key;return`<text x="${q.x.toFixed(1)}" y="${q.y.toFixed(1)}" text-anchor="${q.an}" dominant-baseline="central" font-size="${o.fs}" fill="${sel?'#306BF0':o.s}" font-family="Arial,Helvetica,sans-serif"${ui?` data-k="lab:${q.key}" style="cursor:move"`:''}>${esc(q.t)}</text>`}).join('');
return[b,l,labs]}
const svg=$('cv');
function render(){const o=opts(),[b,l]=figure(o,1),P=N.map(px),n=P.length;let g='',hit='';
if($('grid').checked)for(let i=0;i<=15;i++)for(let j=0;j<=11;j++)g+=`<circle cx="${OX+i*C}" cy="${OY+j*C}" r="1.4" fill="#c9c2e8"/>`;
const hl=(a,c,k,sel)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="${sel?'rgba(48,107,240,.35)':'transparent'}" stroke-width="${sel?9:14}" data-k="${k}" style="cursor:pointer"/>`;
CIR.forEach((c,j)=>{const s=SEL&&SEL.t=='k'&&SEL.i==j;hit+=`<circle cx="${OX+c.x*C}" cy="${OY+c.y*C}" r="${c.r*C}" fill="${s?'rgba(48,107,240,.08)':'rgba(0,0,0,0)'}" stroke="${s?'rgba(48,107,240,.5)':'none'}" stroke-width="3" data-k="cir:${j}" style="cursor:move"/>`});
E.forEach((e,i)=>hit+=hl(P[i],P[(i+1)%n],'edge:'+i,SEL&&SEL.t=='e'&&SEL.i==i));K.forEach((k,j)=>hit+=hl(P[k.a],P[k.b],'cut:'+j,SEL&&SEL.t=='c'&&SEL.i==j));
const hs=P.map((p,i)=>{const s=SEL&&SEL.t=='n'&&SEL.i==i;return`<circle cx="${p[0]}" cy="${p[1]}" r="${s||pend==i?10:7}" fill="${pend==i?'#EC6095':s?'#306BF0':'#fff'}" stroke="#306BF0" stroke-width="2" data-k="node:${i}" style="cursor:grab"/>`}).join('');
let ex='';if(SEL&&SEL.t=='e'&&E[SEL.i]&&!E[SEL.i].bu){const a=P[SEL.i],c=P[(SEL.i+1)%n],x=(a[0]+c[0])/2,y=(a[1]+c[1])/2;ex=`<path d="M${x} ${y-9} L${x+9} ${y} L${x} ${y+9} L${x-9} ${y} Z" fill="#EC6095" stroke="#fff" stroke-width="2" data-k="mv:${SEL.i}" style="cursor:move"/>`}
CIR.forEach((c,j)=>{if(SEL&&SEL.t=='k'&&SEL.i==j)ex+=`<circle cx="${OX+(c.x+c.r)*C}" cy="${OY+c.y*C}" r="7" fill="#EC6095" stroke="#fff" stroke-width="2" data-k="crd:${j}" style="cursor:ew-resize"/>`});
svg.innerHTML=`<rect width="${W}" height="${H}" fill="#fff"/>`+g+b+hit+l+hs+ex;posPop();try{localStorage.setItem('sf_last',snapJ())}catch(e){}}
const snap=v=>{const s=+$('snap').value;return Math.round(v/s)*s};
const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return[q.x,q.y]};
svg.addEventListener('pointerdown',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k){SEL=null;pend=null;ui();render();return}
const[t,i]=k.split(':');
if(MODE=='cut'&&t=='node'){const m=+i;if(pend==null)pend=m;else if(pend!=m){push();K.push({a:pend,b:m,st:1,t:''});SEL={t:'c',i:K.length-1};MODE=null;pend=null;ui()}render();return}
svg.setPointerCapture(e.pointerId);
