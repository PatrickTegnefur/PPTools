<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematikfigurer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sora:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#f6f4ff;color:#100e28;font:15px/1.45 'Sora',sans-serif;min-height:100vh}
.amb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
.a1{width:440px;height:440px;background:#66C7C2;top:-100px;left:-120px}
.a2{width:380px;height:380px;background:#F4A261;right:-120px;top:32%}
.a3{width:420px;height:420px;background:#EC6095;bottom:-160px;left:28%}
header{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;padding:0 24px;background:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);box-shadow:0 4px 24px rgba(0,0,0,.18);color:#fff}
header h1{font:700 20px 'Montserrat',sans-serif;margin:0;color:#fff}
header span{margin-left:14px;font-size:13px;color:rgba(255,255,255,.9)}
nav,main{position:relative;z-index:1;max-width:1700px;margin:0 auto}
nav{display:flex;flex-direction:column;gap:8px;padding:16px 24px 0}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:4px}
.row>*{flex-shrink:0}
.grp{font:600 11px 'Montserrat',sans-serif;color:#585078;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 0 8px}
.tab{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);color:#100e28;padding:0;border-radius:11px;cursor:pointer}
.col{display:flex;flex-direction:column;gap:16px}
details{border-top:1px solid #e3def8}details:first-of-type{border-top:0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:10px 2px;font:700 13px 'Montserrat',sans-serif;color:#100e28;min-height:44px}
summary::-webkit-details-marker{display:none}summary::after{content:'\25BE';color:#306BF0;transition:transform .2s}details[open]>summary::after{transform:rotate(180deg)}
details>.dbody{padding:0 2px 10px}
.tab.on{background:#306BF0;color:#fff;border-color:#306BF0}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px 32px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:20px;box-shadow:0 10px 22px rgba(48,107,240,.12),0 2px 6px rgba(16,14,40,.05)}
h2{font:700 14px 'Montserrat',sans-serif;margin:0 0 8px;color:#100e28}
h2:not(:first-child){margin-top:20px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;font-size:13px;color:#585078}
input[type=text],select{width:150px;min-height:36px;padding:4px 8px;border:1.5px solid #ccc5f0;border-radius:8px;background:#fff;color:#100e28;font:inherit;font-size:13px}
input[type=color]{width:48px;height:36px;border:1.5px solid #ccc5f0;border-radius:8px;background:#fff;padding:2px}
input[type=range]{width:150px}
input[type=checkbox]{width:20px;height:20px;accent-color:#306BF0}
.pre{display:flex;gap:8px;flex-wrap:wrap}
.pre{align-items:center}.pre button{width:26px;height:26px;border-radius:50%;border:2px solid #ccc5f0;cursor:pointer;padding:0}
.tp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tp button{min-height:30px;padding:0 8px;border:1.5px solid #ccc5f0;background:#eae6ff;color:#306BF0;border-radius:7px;cursor:pointer;font:600 11px 'Sora',sans-serif}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #306BF0;outline-offset:2px}
#fig{background:#fff;border-radius:14px;padding:8px;display:flex;justify-content:center;border:1px solid #ccc5f0}
#fig svg{width:100%;height:auto;touch-action:none}
.lab{cursor:move;user-select:none;-webkit-user-select:none}.lab:hover{fill:#306BF0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:44px;border:0;background:#306BF0;color:#fff;padding:0 20px;border-radius:8px;cursor:pointer;font:600 13px 'Sora',sans-serif}
.btn.alt{background:#eae6ff;color:#306BF0;border:1.5px solid #ccc5f0}
#msg{min-height:22px;margin-top:8px;font-size:13px;color:#e02020}
.d3{display:none}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.tools a,.tools button{color:#fff;text-decoration:none;font:600 12px 'Montserrat',sans-serif;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);cursor:pointer}
.tools a.on{background:#fff;color:#100e28;cursor:default}
@media(max-width:1100px){header span{display:none}}
#navp{position:fixed;z-index:200;right:16px;top:72px;width:360px;max-width:calc(100vw - 32px);background:rgba(255,255,255,.97);border:1px solid #ccc5f0;border-radius:16px;padding:16px;box-shadow:0 12px 30px rgba(16,14,40,.25);display:none}
#navp h3{font:700 14px 'Montserrat',sans-serif;margin:0 0 8px;color:#100e28}
#navp label{display:flex;flex-direction:column;gap:3px;margin:6px 0;font-size:12px;color:#585078}
#navp input[type=text]{width:100%}
#navp .row2{display:flex;align-items:center;gap:8px;margin:8px 0}
</style>
</head>
<body>
<div class="amb a1"></div><div class="amb a2"></div><div class="amb a3"></div>
<header><h1>Matematikfigurer</h1><span>Figurer till prov, arbetsblad och presentationer</span><div class="tools" id="tools"></div></header>
<nav id="tabs"></nav>
<main>
<div class="col">
<div class="card"><h2 title="Tips: skriv enheten efter måttet, till exempel 5 dm, för att få olika enheter på olika sidor.">Mått</h2><div id="fields"></div></div>
<div class="card">
<details open><summary>Färger</summary><div class="dbody">
<label>Färgtema<span class="pre" id="pre"></span></label>
<label class="d2">Fyllning (2D)<input type="color" id="fill" value="#cdeeec"></label>
<label class="d2">Fyllning på<input type="checkbox" id="fillon"></label>
<div id="surf" class="d3"></div>
<label>Ljushet på färger<input type="range" id="lj" min="0" max="80" step="5" value="0"></label>
</div></details>
<details><summary>Linjer och text</summary><div class="dbody">
<label>Linjefärg<input type="color" id="stroke" value="#100e28"></label>
<label>Linjetjocklek<input type="range" id="sw" min="1" max="6" step=".5" value="2.5"></label>
<label>Textstorlek<input type="range" id="fs" min="12" max="28" value="21"></label>
<label>Storlek på markeringar<input type="range" id="ms" min="10" max="40" value="20"></label>
<label title="Visar handtag i figuren som du kan dra i för att ändra måtten">Dra i figuren (handtag)<input type="checkbox" id="hon" checked></label>
<label>Ritytans storlek<select id="cz"><option value="0">Normal</option><option value="1">Stor</option><option value="2">Extra stor</option></select></label>
</div></details>
<details><summary>Enheter</summary><div class="dbody">
<label>Enhet visas<select id="um"><option value="0">Vid måtten</option><option value="1">I parentes ovanför figuren</option></select></label>
</div></details>
<details><summary title="Bocka i de etiketter som ska stå i en lista vid sidan. På figuren ersätts de av bokstäver.">Lista vid sidan</summary><div class="dbody">
<div id="labs"></div>
<label style="flex-direction:column;align-items:stretch"><span>Egen notering (en rad per post)</span><textarea id="note" rows="3" style="width:100%;border:1.5px solid #ccc5f0;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px"></textarea></label>
</div></details>
<details><summary>Utskrift och export</summary><div class="dbody">
<label>Svartvit utskrift<input type="checkbox" id="bw"></label>
<label>Genomskinlig bakgrund (PNG/SVG)<input type="checkbox" id="tp"></label>
<button class="btn alt" id="psv" title="Sparar färger, linjer, textstorlek, enhet och utskriftsval som standard nästa gång du öppnar verktyget">Spara som standard</button><button class="btn alt" id="prs" title="Tar bort det sparade standardutseendet">Återställ standard</button>
</div></details>
</div>
</div>
<div class="card"><div id="fig" title="Dra i en etikett för att flytta den, till exempel in i figuren."></div><div id="msg"></div>
<div class="bar"><button class="btn" id="cp">Kopiera bild</button><button class="btn alt" id="png">Ladda ner PNG</button><button class="btn alt" id="svg">Ladda ner SVG</button><button class="btn alt" id="rl" title="Lägger tillbaka alla flyttade etiketter på sina ursprungliga platser">Återställ etikettpositioner</button></div>
</div>
</main>
