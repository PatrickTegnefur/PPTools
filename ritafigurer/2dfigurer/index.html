<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematikfigurer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sora:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#f6f4ff;color:#100e28;font:15px/1.45 'Sora',sans-serif;min-height:100vh}
.amb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
.a1{width:440px;height:440px;background:#66C7C2;top:-100px;left:-120px}
.a2{width:380px;height:380px;background:#F4A261;right:-120px;top:32%}
.a3{width:420px;height:420px;background:#EC6095;bottom:-160px;left:28%}
header{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;padding:0 24px;background:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);box-shadow:0 4px 24px rgba(0,0,0,.18);color:#fff}
header h1{font:700 20px 'Montserrat',sans-serif;margin:0;color:#fff}
header span{margin-left:14px;font-size:13px;color:rgba(255,255,255,.9)}
nav,main{position:relative;z-index:1;max-width:1120px;margin:0 auto}
nav{display:flex;flex-direction:column;gap:8px;padding:16px 24px 0}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-bottom:4px}
.row>*{flex-shrink:0}
.grp{font:600 11px 'Montserrat',sans-serif;color:#585078;text-transform:uppercase;letter-spacing:.06em;margin:0 4px 0 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:86px;min-height:64px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);color:#100e28;padding:8px 10px;border-radius:14px;cursor:pointer;font:600 11px 'Montserrat',sans-serif}
.tab.on{background:#306BF0;color:#fff;border-color:#306BF0}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px 32px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:20px;box-shadow:0 10px 22px rgba(48,107,240,.12),0 2px 6px rgba(16,14,40,.05)}
h2{font:700 14px 'Montserrat',sans-serif;margin:0 0 8px;color:#100e28}
h2:not(:first-child){margin-top:20px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;font-size:13px;color:#585078}
input[type=text],select{width:150px;min-height:36px;padding:4px 8px;border:1.5px solid #ccc5f0;border-radius:8px;background:#fff;color:#100e28;font:inherit;font-size:13px}
input[type=color]{width:48px;height:36px;border:1.5px solid #ccc5f0;border-radius:8px;background:#fff;padding:2px}
input[type=range]{width:150px}
input[type=checkbox]{width:20px;height:20px;accent-color:#306BF0}
.pre{display:flex;gap:8px;flex-wrap:wrap}
.pre{align-items:center}.pre button{width:26px;height:26px;border-radius:50%;border:2px solid #ccc5f0;cursor:pointer;padding:0}
.tp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tp button{min-height:36px;padding:0 10px;border:1.5px solid #ccc5f0;background:#eae6ff;color:#306BF0;border-radius:8px;cursor:pointer;font:600 12px 'Sora',sans-serif}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #306BF0;outline-offset:2px}
#fig{background:#fff;border-radius:14px;padding:8px;display:flex;justify-content:center;border:1px solid #ccc5f0}
#fig svg{width:100%;max-width:680px;height:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:44px;border:0;background:#306BF0;color:#fff;padding:0 20px;border-radius:8px;cursor:pointer;font:600 13px 'Sora',sans-serif}
.btn.alt{background:#eae6ff;color:#306BF0;border:1.5px solid #ccc5f0}
#msg{min-height:22px;margin-top:8px;font-size:13px;color:#e02020}
.d3{display:none}
</style>
</head>
<body>
<div class="amb a1"></div><div class="amb a2"></div><div class="amb a3"></div>
<header><h1>Matematikfigurer</h1><span>Figurer till prov, arbetsblad och presentationer</span></header>
<nav id="tabs"></nav>
<main>
<div class="card">
<h2>Mått</h2><div id="fields"></div>
<h2>Utseende</h2>
<label>Färgtema<span class="pre" id="pre"></span></label>
<label class="d2">Fyllning (2D)<input type="color" id="fill" value="#cdeeec"></label>
<label class="d2">Fyllning på<input type="checkbox" id="fillon"></label>
<div id="surf" class="d3"></div>
<label>Linjefärg<input type="color" id="stroke" value="#100e28"></label>
<label>Linjetjocklek<input type="range" id="sw" min="1" max="6" step=".5" value="2"></label>
<label>Textstorlek<input type="range" id="fs" min="12" max="28" value="17"></label>
<label>Storlek på markeringar<input type="range" id="ms" min="10" max="40" value="20"></label>
<label>Svartvit utskrift<input type="checkbox" id="bw"></label>
<label>Genomskinlig bakgrund (PNG/SVG)<input type="checkbox" id="tp"></label>
</div>
<div class="card"><div id="fig"></div><div id="msg"></div>
<div class="bar"><button class="btn" id="cp">Kopiera bild</button><button class="btn alt" id="png">Ladda ner PNG</button><button class="btn alt" id="svg">Ladda ner SVG</button></div></div>
</main>
<script>
const W=560,H=400,KC=.5*Math.cos(.7),KS=.5*Math.sin(.7),U=[-KC,1,-KS];

const d3=(w,d,h,hm)=>[['w','Bredd',w],['d','Djup',d],['h','Höjd',h],['lw','Etikett bredd','text',''],['ld','Etikett djup','text',''],['lh','Etikett höjd','text',''],['unit','Enhet','text','cm'],['hm','Visa höjd','sel',HM,hm],['tr','Genomskinliga ytor','chk',1]];
const rd=(r,h,hm)=>[['r','Radie',r],['h','Höjd',h],['lr','Etikett radie','text',''],['lh','Etikett höjd','text',''],['unit','Enhet','text','cm'],['hm','Visa höjd','sel',HM,hm],['tr','Genomskinliga ytor','chk',1],['rad','Visa radie','chk',1]];
const F={
grid:{n:'Koordinatsystem',f:[['xmin','x från',-6],['xmax','x till',6],['ymin','y från',-6],['ymax','y till',6],['step','Steg',1],['gl','Rutnät','chk',1],['nums','Siffror','chk',1],['arr','Pilar','sel',AR,0],['gpts','Punkter','text',''],['gcon','Förbind punkterna','sel',['Nej','Linje (öppen)','Månghörning (sluten)'],0],['gcoord','Visa koordinater','chk',0],['glin','Linjer','text',''],['glbw','Svarta linjer','chk',0]],d:grid,
p:[['Rensa',{gpts:'',glin:'',gcon:0}],['Punkter',{gpts:'A(2,3) B(-3,1) C(-2,-4)',glin:'',gcon:0}],['Rät linje',{gpts:'',glin:'y=2x+1',gcon:0}],['Två linjer',{gpts:'',glin:'y=x+2; y=-0.5x+5',gcon:0}],['Triangel',{gpts:'A(1,1) B(5,1) C(3,4)',glin:'',gcon:2}]]},
line:{n:'Tallinje',f:[['min','Från',-5],['max','Till',5],['step','Steg',1],['pts','Punkter (komma)','text','-2, 3'],['open','Ofyllda punkter','chk',0],['arr','Pilar','sel',AR,0]],d:nline},
tri:{n:'Triangel',f:[['a','Sida a (BC)',4],['b','Sida b (CA)',3],['c','Sida c (AB)',5],['la','Etikett a','text',''],['lb','Etikett b','text',''],['lc','Etikett c','text',''],['ta','Markering sida a','sel',TK,0],['tb','Markering sida b','sel',TK,0],['tc','Markering sida c','sel',TK,0],['unit','Enhet','text','cm'],['bs','Sida längst ned','sel',['c (AB)','a (BC)','b (CA)'],0],['mir','Spegla','chk',0],['ang','Visa vinklar','chk',0],['corn','Hörnnamn','chk',1]],d:tri,
p:[['Liksidig',{a:5,b:5,c:5,ta:1,tb:1,tc:1,bs:0}],['Likbent',{a:5,b:5,c:6,ta:1,tb:1,tc:0,bs:0}],['Rätvinklig 3-4-5',{a:4,b:3,c:5,ta:0,tb:0,tc:0,bs:2}],['Rätvinklig likbent',{a:4,b:4,c:5.657,ta:1,tb:1,tc:0,bs:2}],['30°-60°-90°',{a:5,b:8.66,c:10,ta:0,tb:0,tc:0,bs:2}],['Trubbvinklig',{a:3,b:2.5,c:5,ta:0,tb:0,tc:0,bs:0}]]},
rect:{n:'Rektangel',f:[['w','Bredd',6],['h','Höjd',4],['lw','Etikett bredd','text',''],['lh','Etikett höjd','text',''],['tw','Markering bredd','sel',TK,0],['th','Markering höjd','sel',TK,0],['unit','Enhet','text','cm'],['ra','Rätvinkelmarkering','chk',1],['corn','Hörnnamn','chk',1]],d:rect},
para:{n:'Parallellogram',f:[['b','Bas',6],['s','Sida',4],['al','Vinkel vid A (°)',60],['lb','Etikett bas','text',''],['ls','Etikett sida','text',''],['tb','Markering bas','sel',TK,0],['ts','Markering sida','sel',TK,0],['unit','Enhet','text','cm'],['hh','Visa höjd','chk',0],['lh','Etikett höjd','text',''],['par','Parallellmarkering','chk',1],['ang','Visa vinklar','chk',0],['corn','Hörnnamn','chk',1]],d:para},
trap:{n:'Parallelltrapets',f:[['a','Nedre bas',8],['c','Övre bas',4],['h','Höjd',3],['d','Förskjutning vänster',2],['la','Etikett nedre bas','text',''],['lc','Etikett övre bas','text',''],['tl','Markering på benen','sel',TK,1],['legs','Visa benens längd','chk',0],['unit','Enhet','text','cm'],['hh','Visa höjd','chk',0],['lh','Etikett höjd','text',''],['par','Parallellmarkering','chk',1],['ang','Visa vinklar','chk',0],['corn','Hörnnamn','chk',1]],d:trap,
p:[['Likbent',{a:8,c:4,h:3,d:2,tl:1}],['Rätvinklig',{a:8,c:5,h:3,d:0,tl:0}],['Allmän',{a:8,c:4,h:3,d:1,tl:0}]]},
romb:{n:'Romb',f:[['s','Sida',5],['al','Vinkel vid A (°)',60],['ls','Etikett sida','text',''],['ts','Likhetsmarkering sidor','sel',TK,1],['unit','Enhet','text','cm'],['diag','Visa diagonaler','chk',0],['par','Parallellmarkering','chk',0],['ang','Visa vinklar','chk',0],['corn','Hörnnamn','chk',1]],d:romb},
kite:{n:'Drake',f:[['a','Kort sida',3],['b','Lång sida',5],['al','Vinkel vid A (°)',90],['la','Etikett kort sida','text',''],['lb','Etikett lång sida','text',''],['ta','Markering korta sidor','sel',TK,1],['tb','Markering långa sidor','sel',TK,2],['unit','Enhet','text','cm'],['diag','Visa diagonaler','chk',0],['ang','Visa vinklar','chk',0],['corn','Hörnnamn','chk',1]],d:kite},
ngon:{n:'Månghörning',f:[['n','Antal sidor',6],['s','Sida',4],['ls','Etikett sida','text',''],['tk','Likhetsmarkering sidor','sel',TK,1],['unit','Enhet','text','cm'],['sh','Visa','sel',['Inget','Radie','Apotem','Radie och apotem'],0],['lr','Etikett radie','text',''],['lp','Etikett apotem','text',''],['ang','Visa vinklar','chk',0],['corn','Hörnnamn','chk',0]],d:ngon},
angl:{n:'Vinklar',f:[['a1','Vinkel 1 (°)',40],['a2','Vinkel 2 (°)',50],['a3','Vinkel 3 (°)',0],['rot','Startriktning (°)',20],['l1','Etikett 1','text',''],['l2','Etikett 2','text',''],['l3','Etikett 3','text',''],['deg','Visa gradtal','chk',1],['corn','Namn på punkter','chk',1]],d:angl},
parl:{n:'Parallella linjer',f:[['th','Vinkel (°)',60],['dist','Avstånd mellan linjerna',3],['lab','Markera vinklar (nr 1–8)','text','1, 5'],['xs','Visa som x (nr)','text','5'],['nr','Numrera alla vinklar','chk',0],['par','Parallellmarkering','chk',1],['corn','Linjenamn (m, n, t)','chk',1]],d:parl},
box:{n:'Rätblock',f:d3(5,3,4,2),d:box,d3:1},
prism:{n:'Triangulärt prisma',f:d3(4,3,5,2),d:prism,d3:1},
pyr:{n:'Pyramid',f:d3(4,4,5,1),d:pyr,d3:1},

const S={};let cur='grid';
for(const k in F){S[k]={};F[k].f.forEach(x=>S[k][x[0]]=x[2]=='sel'?x[4]:x[2]=='chk'||x[2]=='text'?x[3]:x[2])}
function tabs(){$('tabs').innerHTML='';let g='',row;for(const k in F){const t=F[k].d3?'3D':'2D';if(t!=g){g=t;row=document.createElement('div');row.className='row';const s=document.createElement('span');s.className='grp';s.textContent=t;row.appendChild(s);$('tabs').appendChild(row)}
const b=document.createElement('button');b.className='tab'+(k==cur?' on':'');b.innerHTML=`<svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${IC[k]}</svg><span>${F[k].n}</span>`;b.onclick=()=>{cur=k;tabs();fields();draw()};row.appendChild(b)}}

mb(NONE,()=>{C[k].on=0;draw()},'Genomskinlig');SWC.forEach(c=>mb(c,()=>{C[k]={on:1,c};ci.value=c;draw()},c));
ci.type='color';ci.value=C[k].c;ci.oninput=()=>{C[k]={on:1,c:ci.value};draw()};sp.appendChild(ci);l.appendChild(sp);$('surf').appendChild(l)})}
const gr=c=>{if(!c||c=='none')return c;const n=parseInt(c.slice(1),16),y=.3*(n>>16)+.59*(n>>8&255)+.11*(n&255),v=Math.round(255-(255-y)*.55);return'#'+(v*65793).toString(16).padStart(6,'0')};
function st(){const b=$('bw').checked,q=c=>b?gr(c):c;return{fill:q($('fillon').checked?$('fill').value:'none'),base:q(C.base.on?C.base.c:'none'),side:q(C.side.on?C.side.c:'none'),top:q(C.top.on?C.top.c:'none'),s:b?'#000000':$('stroke').value,w:$('sw').value,fs:$('fs').value,ms:+$('ms').value,bw:b}}
const T=(x,y,t,o,a='middle')=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" dominant-baseline="central" font-size="${o.fs}" fill="${o.s}" font-family="Arial,Helvetica,sans-serif">${t}</text>`;
const L=(x1,y1,x2,y2,c,w,x='')=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" ${x}/>`;
const ah=(x,y,dx,dy,o,z=10)=>{const px=-dy,py=dx;return`<path d="M${x} ${y} L${x-dx*z+px*z*.42} ${y-dy*z+py*z*.42} L${x-dx*z-px*z*.42} ${y-dy*z-py*z*.42}Z" fill="${o.s}"/>`};
function fit(p,pad){const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);const x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0,h=Math.max(...ys)-y0;
const s=Math.min((W-2*pad)/w,(H-2*pad)/h),ox=(W-w*s)/2-x0*s,oy=(H+h*s)/2+y0*s;const q=z=>[ox+z[0]*s,oy-z[1]*s];q.s=s;return q}
function tk(p,q,n,o){let r='';if(!n)return r;const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l,m=[(p[0]+q[0])/2,(p[1]+q[1])/2],h=o.ms*.4;
for(let i=0;i<n;i++){const k=(i-(n-1)/2)*8,cx=m[0]+ux*k,cy=m[1]+uy*k;r+=L(cx+uy*h,cy-ux*h,cx-uy*h,cy+ux*h,o.s,o.w)}return r}
