<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geometriska kroppar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#f6f4ff;color:#100e28;font:400 15px/1.45 'Sora',sans-serif}
header{background:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);height:64px;display:flex;align-items:center;padding:0 24px;box-shadow:0 4px 24px rgba(0,0,0,0.18)}
header h1{margin:0;font:700 1.25rem 'Montserrat',sans-serif;color:#ffffff}
.wrap{position:relative}
#stage{height:clamp(420px,72vh,800px);perspective:1800px;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:#f6f4ff}
#scene{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
/* glaspaneler */
.gl{background:rgba(255,255,255,0.78);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,0.9);border-radius:14px;box-shadow:0 10px 22px rgba(48,107,240,0.14),0 2px 6px rgba(16,14,40,0.05)}
.pn{padding:8px 12px}
.pn h2{margin:0;font:600 .8rem 'Montserrat',sans-serif;color:#585078}
.tb{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px}
.hd{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.hd h2{flex:1}
.ln{display:flex;align-items:center;gap:6px;min-height:32px;font-size:.88rem}
.ln .lbl{min-width:96px}.ln .u{color:#585078;font-size:.8rem}
input[type=number]{width:54px;height:30px;text-align:center;font:600 .9rem 'Sora',sans-serif;color:#100e28;background:#ffffff;border:1.5px solid #ccc5f0;border-radius:8px;padding:0 4px}
select{height:28px;font:600 .8rem 'Sora',sans-serif;color:#100e28;background:#ffffff;border:1.5px solid #ccc5f0;border-radius:8px;padding:0 2px}
button{font:600 .8rem 'Sora',sans-serif;color:#306BF0;background:#eae6ff;border:1.5px solid #ccc5f0;border-radius:8px;min-height:28px;padding:0 10px;cursor:pointer}
button.main{background:#306BF0;color:#ffffff;border-color:#306BF0;min-height:32px;padding:0 16px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #306BF0;outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:center;min-height:30px;font-size:.85rem;cursor:pointer}
label.chk input{width:16px;height:16px;accent-color:#306BF0;margin:0}
.fold{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#585078}
.fold input{width:150px;accent-color:#306BF0}
.bar{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap}
.vy{display:flex;gap:6px;align-items:center}
.zoom{display:flex;gap:4px;align-items:center;padding:4px}
.zoom button{min-width:32px;padding:0 8px}
#zr{min-width:56px}
.nb{white-space:nowrap}
#defCard{display:none;position:absolute;right:12px;top:12px;z-index:6;width:min(320px,calc(100% - 24px));padding:12px 16px;font-size:.9rem}
#defCard.on{display:block}
#defCard .hd h2{font-size:.95rem;color:#100e28}
.chips{display:flex;flex-direction:column;gap:6px}.chips button{text-align:left;min-height:32px;padding:4px 10px}
@media (max-width:759px){#defCard{position:static;width:auto;margin:8px}}
#scene[data-hl="bas"] .f:not([data-g="bas"]) .sh,#scene[data-hl="sid"] .f:not([data-g="sid"]) .sh{background-image:none;background-color:color-mix(in srgb,var(--c) 14%,transparent)}
#scene[data-hl="bas"] .f:not([data-g="bas"]) polygon,#scene[data-hl="sid"] .f:not([data-g="sid"]) polygon{stroke:rgba(16,14,40,.22)}
#scene[data-hl="bas"] .f[data-g="bas"] polygon,#scene[data-hl="sid"] .f[data-g="sid"] polygon{stroke:#306BF0;stroke-width:7}
#scene[data-hl="bas"] .f:not([data-g="bas"]) em,#scene[data-hl="sid"] .f:not([data-g="sid"]) em{display:none}
.sep{height:1px;background:#ccc5f0;margin:4px 0}
.eb{position:absolute;left:0;top:0;pointer-events:none;display:none;font:600 12px 'Sora',sans-serif;color:#100e28;background:#ffffff;border:1.5px solid #100e28;border-radius:6px;padding:1px 6px;white-space:nowrap}
@media (pointer:coarse){button,input[type=number],select{min-height:44px;height:44px}label.chk,.ln{min-height:44px}}
@media (min-width:760px){
 #stage{height:calc(100vh - 64px);height:calc(100dvh - 64px);min-height:520px}
 .tb{position:absolute;left:12px;top:12px;z-index:5;flex-direction:column;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;width:236px}
 .bar{position:absolute;left:12px;right:12px;bottom:12px;justify-content:center;flex-wrap:wrap;padding:0 140px;pointer-events:none;z-index:5}
 .zoom{position:absolute;left:0}
 .bar>*{pointer-events:auto}
 #openC{position:absolute;right:0}
}
/* figur, golv, väggar */
#root,.f,.nd{transform-style:preserve-3d}
.nd{position:absolute;left:0;top:0;width:0;height:0}
#floor{position:absolute;background-color:rgba(208,200,244,0.55);pointer-events:none}
.wall{position:absolute;pointer-events:none;transform-origin:0 0;background-color:rgba(48,107,240,0.20);background-image:linear-gradient(rgba(48,107,240,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(48,107,240,.5) 1px,transparent 1px);-webkit-mask-image:radial-gradient(ellipse 100% 100% at 0 0,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 100% 100% at 0 0,#000 30%,transparent 100%)}
.f{position:absolute}
.sh{position:absolute;inset:0;background-color:var(--c);background-image:linear-gradient(rgba(16,14,40,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(16,14,40,.32) 1px,transparent 1px)}
.f i{position:absolute;width:0;height:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;pointer-events:none;font-style:normal}
.f em{font:600 13px/1.25 'Sora',sans-serif;font-style:normal;color:#100e28;background:rgba(255,255,255,.9);padding:2px 6px;border-radius:6px;text-align:center;white-space:nowrap}
.f em b{font-weight:700}
.focus .f:not(.base) .sh{background-image:none;background-color:color-mix(in srgb,var(--c) 12%,transparent)}
.focus .f:not(.base) polygon{stroke:rgba(16,14,40,.22)}
.focus .base polygon{stroke:#306BF0}
.focus .f:not(.base) em{display:none}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.2}
.frac>span:first-child{border-bottom:1.5px solid #100e28;padding:0 3px}
.sub{display:flex;align-items:center;gap:8px;margin:0 0 2px 24px;font-size:.75rem;color:#585078}
.sub input{width:110px;accent-color:#306BF0}
.pl{display:inline-block;min-width:22px;padding:0 5px;border:1.5px solid #100e28;border-radius:6px;text-align:center;font-weight:600;color:#100e28;line-height:1.35}
.tip{position:absolute;left:14px;bottom:10px;font-size:.78rem;color:#585078;pointer-events:none}
@media (min-width:760px){.tip{left:auto;right:14px;bottom:58px}}
/* beräkningar */
#drawer{display:none;position:absolute;right:12px;bottom:60px;z-index:6;width:min(360px,calc(100% - 24px));max-height:min(70%,560px);overflow:auto;padding:12px 16px}
#drawer.on{display:block}
.tabs{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.tabs label.chk{margin-left:auto}
button[aria-pressed=true]{background:#306BF0;color:#ffffff;border-color:#306BF0}
.rw{display:grid;grid-template-columns:20px 1fr;gap:0 8px;margin:0 0 8px}
.rw span.n{font:600 .75rem 'Montserrat',sans-serif;color:#585078;padding-top:2px}
.rw div{line-height:1.5}.q{color:#585078}
.ans{color:#18a348;font-weight:600}
</style>
</head>
<body>
<header><h1>Geometriska kroppar</h1></header>
<div class="wrap">
 <div class="tb" id="tb">
  <section class="gl pn" aria-label="Figur"><div class="hd"><h2>Figur</h2>
   <select id="fig" aria-label="Välj figur"><option value="rb">Rätblock</option><option value="kub">Kub</option><option value="pr">Triangulärt prisma</option><option value="p5">Femhörnigt prisma</option><option value="p6">Sexhörnigt prisma</option><option value="py">Rektangulär pyramid</option></select></div>
   <div class="hd"><label class="chk" id="lieWrap" style="display:none"><input type="checkbox" id="sLie"> Liggande</label><button id="defB" style="margin-left:auto">Definition</button></div></section>
  <section class="gl pn" aria-label="Mått">
   <div class="hd"><h2>Mått</h2>
    <select id="unit" aria-label="Enhet"><option>m</option><option>dm</option><option selected>cm</option><option>mm</option></select></div>
   <div id="dims"></div>
  </section>
  <section class="gl pn" aria-label="Visa"><div class="hd"><h2>Visa</h2></div>
   <label class="chk"><input type="checkbox" id="sEdge"> Mått på kanterna</label>
   <label class="chk"><input type="checkbox" id="sMeas"> Mått på sidoytorna</label>
   <label class="chk"><input type="checkbox" id="sAns"> Svar på sidoytorna</label>
   <div class="sep"></div>
   <label class="chk"><input type="checkbox" id="sFloor" checked> Golvrutor</label>
   <label class="chk"><input type="checkbox" id="sWalls"> Väggar</label>
   <div class="sub">Synlighet <input type="range" id="wallOp" min="20" max="100" value="75" aria-label="Väggarnas synlighet"></div>
   <label class="chk"><input type="checkbox" id="sFocus"> Fokusera golvytan</label>
  </section>
 </div>
 <div id="stage" aria-label="Rätblockets nät. Dra för att vrida."><div id="scene"></div><div class="tip">Dra för att vrida figuren</div></div>
 <div class="bar">
  <section class="gl pn fold" aria-label="Vik"><button class="main" id="play">Vik ihop</button>Nät <input type="range" id="fold" min="0" max="100" value="100" aria-label="Hur hopvikt nätet är"> Kropp</section>
  <div class="gl zoom" aria-label="Zoom"><button id="zo" aria-label="Zooma ut" title="Zooma ut">−</button><button id="zr" aria-label="Återställ vy" title="Återställ vy (kamera och zoom)">100 %</button><button id="zi" aria-label="Zooma in" title="Zooma in">+</button></div>
  <section class="gl pn vy" aria-label="Vy"><button id="reset">Återställ vy</button><button id="below">Se basytan</button></section>
  <button class="gl" id="openC" aria-expanded="false" aria-controls="drawer">Beräkningar</button>
 </div>
 <aside class="gl" id="defCard" aria-label="Definition"><div class="hd"><h2 id="defT"></h2><button id="defX" aria-label="Stäng definition">✕</button></div><div id="defBody"></div></aside>
 <aside class="gl" id="drawer" aria-label="Beräkningar">
  <div class="tabs"><button id="tV" aria-pressed="true">Volym</button><button id="tA" aria-pressed="false">Begränsningsyta</button>
   <label class="chk"><input type="checkbox" id="sCalc"> Uträkning</label></div>
  <div id="res"></div>
 </aside>
</div>

<script>
const $=id=>document.getElementById(id);
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
//PURE
const D=Math.PI/180,MAX=12;
const fm=x=>String(Math.round(x*10)/10).replace('.',','),r1=x=>Math.round(x*10)/10;
const frac=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const mm=(A,B)=>A.map(r=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));
const mv=(M,v)=>M.map(r=>r[0]*v[0]+r[1]*v[1]+r[2]*v[2]);
const RZ=a=>[[Math.cos(a),-Math.sin(a),0],[Math.sin(a),Math.cos(a),0],[0,0,1]];
const RX=a=>[[1,0,0],[0,Math.cos(a),-Math.sin(a)],[0,Math.sin(a),Math.cos(a)]];
const I3=[[1,0,0],[0,1,0],[0,0,1]];
const cen=P=>[P.reduce((a,q)=>a+q[0],0)/P.length,P.reduce((a,q)=>a+q[1],0)/P.length];
const FIG={rb:{P:[['l','Längd'],['b','Bredd'],['h','Höjd']]},kub:{P:[['l','Sida']]},
 pr:{lie:1,P:[['tb','Triangel bas'],['th','Triangel höjd'],['ph','Prisma höjd']]},
 p5:{lie:1,P:[['a','Sida a',8],['ph','Prisma höjd']]},p6:{lie:1,P:[['a','Sida a',8],['ph','Prisma höjd']]},
 py:{P:[['l','Bas längd'],['b','Bas bredd'],['h','Höjd']]}};
let fig='rb',lie=false;
const dm={rb:{l:4,b:3,h:2},kub:{l:3},pr:{tb:3,th:4,ph:5},p5:{a:3,ph:5},p6:{a:3,ph:5},py:{l:4,b:4,h:3}};
const TE='#66C7C2',AM='#F4A261',PK='#EC6095',BL='#8FB0F7';
const fm2=x=>String(Math.round(x*100)/100).replace('.',','),gi=x=>Math.abs(x-Math.round(x))<1e-9?1:0;
const reg=(n,a)=>{const P=[[0,0]];for(let k=0;k<n-1;k++){const q=P[k],e=2*Math.PI/n*k;P.push([q[0]+a*Math.cos(e),q[1]+a*Math.sin(e)])}return P};
const RF=(id,p,hinge,pts,fold,c,ltr,mt,ar,g,grp)=>({id,p,hinge,pts,fold,c,ltr,mt,ar,g,grp});
function prism(P0,p,LT,CL,mtB){
 const n=P0.length,R=RF,gp=n===3?1:0,F=[];
 const w=i=>Math.hypot(P0[(i+1)%n][0]-P0[i][0],P0[(i+1)%n][1]-P0[i][1]);
 const ang=i=>{const a=P0[(i+n-1)%n],b=P0[i],c=P0[(i+1)%n],x1=a[0]-b[0],y1=a[1]-b[1],x2=c[0]-b[0],y2=c[1]-b[1];return Math.abs(Math.atan2(x1*y2-y1*x2,x1*x2+y1*y2))/D};
 const Ar=Math.abs(P0.reduce((s,q,i)=>{const r=P0[(i+1)%n];return s+q[0]*r[1]-r[0]*q[1]},0))/2;
 const mt=i=>`${fm(w(i))} × ${p}`;let ctr,H;
 if(!lie){
  const mx=Math.min(...P0.map(q=>q[0])),P=P0.map(q=>[q[0]-mx,q[1]]);ctr=cen(P);H=p;
  F.push(R('base',0,0,P,0,TE,'B',mtB,Ar,gp,'bas'));
  for(let i=0;i<n;i++){
   const A=P[i],B=P[(i+1)%n],L=w(i);let nx=(B[1]-A[1])/L,ny=-(B[0]-A[0])/L;
   if(nx*((A[0]+B[0])/2-ctr[0])+ny*((A[1]+B[1])/2-ctr[1])<0){nx=-nx;ny=-ny}
   F.push(R('r'+i,'base',[A,B],[A,B,[B[0]+nx*p,B[1]+ny*p],[A[0]+nx*p,A[1]+ny*p]],90,CL[i],LT[i],mt(i),L*p,gi(L),'sid'));
  }
  F.push(R('lid','r0',[[P[0][0],-p],[P[1][0],-p]],P.map(q=>[q[0],-p-q[1]]),90,TE,'B',mtB,Ar,gp,'bas'));
 }else{
  const w0=w(0);ctr=[w0/2,p/2];H=Math.max(...P0.map(q=>q[1]));
  F.push(R('base',0,0,[[0,0],[w0,0],[w0,p],[0,p]],0,CL[0],LT[0],mt(0),w0*p,gi(w0),'sid'));
  F.push(R('pb','base',[[0,p],[w0,p]],P0.map(q=>[q[0],p+q[1]]),90,TE,'B',mtB,Ar,gp,'bas'));
  F.push(R('pt','base',[[0,0],[w0,0]],P0.map(q=>[q[0],-q[1]]),90,TE,'B',mtB,Ar,gp,'bas'));
  const nr=Math.ceil((n-1)/2),nl=n-1-nr;let X=w0,pv='base';
  for(let i=1;i<=nr;i++){const L=w(i);F.push(R('e'+i,pv,[[X,0],[X,p]],[[X,0],[X+L,0],[X+L,p],[X,p]],180-ang(i),CL[i],LT[i],mt(i),L*p,gi(L),'sid'));X+=L;pv='e'+i}
  X=0;pv='base';
  for(let j=1;j<=nl;j++){const i=n-j,L=w(i);F.push(R('l'+j,pv,[[X,0],[X,p]],[[X-L,0],[X,0],[X,p],[X-L,p]],180-ang((i+1)%n),CL[i],LT[i],mt(i),L*p,gi(L),'sid'));X-=L;pv='l'+j}
 }
 return {faces:F,ctr,H,Ar};
}
function geo(){
 const d=dm[fig],R=RF;
 if(fig==='rb'||fig==='kub'){
  const k=fig==='kub',l=d.l,b=k?l:d.b,h=k?l:d.h,lb=`${l} × ${b}`,lh=`${l} × ${h}`,hb=`${h} × ${b}`,s=k?['s','s','s']:['l','b','h'];
  return {ctr:[l/2,b/2],H:h,
   faces:[R('base',0,0,[[0,0],[l,0],[l,b],[0,b]],0,TE,'x',lb,l*b,1,'bas'),
    R('back','base',[[0,0],[l,0]],[[0,-h],[l,-h],[l,0],[0,0]],90,AM,'z',lh,l*h,1,'sid'),
    R('front','base',[[0,b],[l,b]],[[0,b],[l,b],[l,b+h],[0,b+h]],90,AM,'z',lh,l*h,1,'sid'),
    R('left','base',[[0,0],[0,b]],[[-h,0],[0,0],[0,b],[-h,b]],90,PK,'y',hb,b*h,1,'sid'),
    R('right','base',[[l,0],[l,b]],[[l,0],[l+h,0],[l+h,b],[l,b]],90,PK,'y',hb,b*h,1,'sid'),
    R('top','front',[[0,b+h],[l,b+h]],[[0,b+h],[l,b+h],[l,2*b+h],[0,2*b+h]],90,TE,'x',lb,l*b,1,'bas')],
   E:[{f:'base',pt:[l/2,b],txt:`${s[0]} = ${l}`,dx:0,dy:16},{f:'base',pt:[l,b/2],txt:`${s[1]} = ${b}`,dx:22,dy:0},{f:'right',pt:[l+h/2,0],txt:`${s[2]} = ${h}`,dx:18,dy:-12}],
   def:k?{t:'Kub',text:'En kub har sex sidoytor som alla är lika stora kvadrater. En kub är ett slags rätblock.',groups:[['bas','Basytor (2 st): kvadrater'],['sid','Sidoytor (4 st): kvadrater']]}
        :{t:'Rätblock',text:'Ett rätblock har sex sidoytor som alla är rektanglar. Motstående sidoytor är lika stora. Ett rätblock är ett slags prisma.',groups:[['bas','Basytor (2 st): rektanglar'],['sid','Sidoytor (4 st): rektanglar']]},
   info:{vol:'prism',shape:l===b?'kvadrat':'rektangel',bs:'l · b',be:`${l} · ${b}`,B:l*b,h,V:l*b*h,
    areas:[{k:'x',c:TE,m:2,e:`${l} · ${b}`,v:l*b},{k:'y',c:PK,m:2,e:`${h} · ${b}`,v:b*h},{k:'z',c:AM,m:2,e:`${l} · ${h}`,v:l*h}]}};
 }
 if(fig==='py'){
  const l=d.l,b=d.b,h=d.h,sl=Math.hypot(h,b/2),sb=Math.hypot(h,l/2),fl=180-Math.atan2(h,b/2)/D,fb=180-Math.atan2(h,l/2)/D,tl=`${l} · ${fm(sl)} / 2`,tbm=`${b} · ${fm(sb)} / 2`;
  return {ctr:[l/2,b/2],H:h,
   faces:[R('base',0,0,[[0,0],[l,0],[l,b],[0,b]],0,TE,'B',`${l} × ${b}`,l*b,1,'bas'),
    R('front','base',[[0,b],[l,b]],[[0,b],[l,b],[l/2,b+sl]],fl,AM,'x',tl,l*sl/2,0,'sid'),
    R('back','base',[[0,0],[l,0]],[[0,0],[l,0],[l/2,-sl]],fl,AM,'x',tl,l*sl/2,0,'sid'),
    R('left','base',[[0,0],[0,b]],[[0,0],[0,b],[-sb,b/2]],fb,PK,'y',tbm,b*sb/2,0,'sid'),
    R('right','base',[[l,0],[l,b]],[[l,0],[l,b],[l+sb,b/2]],fb,PK,'y',tbm,b*sb/2,0,'sid')],
   E:[{f:'base',pt:[l/2,b],txt:`l = ${l}`,dx:0,dy:16},{f:'base',pt:[l,b/2],txt:`b = ${b}`,dx:22,dy:0},{f:'base',pt:[l/2,b/2],z:h/2,txt:`h = ${h}`,dx:0,dy:0}],
   def:{t:'Rektangulär pyramid',text:'En pyramid har en basyta som är en månghörning (här en rektangel). Alla sidoytor är trianglar som möts i en spets.',groups:[['bas','Basyta (1 st): rektangel'],['sid','Sidoytor (4 st): trianglar']]},
   info:{vol:'pyr',shape:l===b?'kvadrat':'rektangel',bs:'l · b',be:`${l} · ${b}`,B:l*b,h,V:l*b*h/3,approx:!(gi(sl)&&gi(sb)),
    note:u=>`Sidohöjderna är ${fm(sl)} ${u} och ${fm(sb)} ${u} (Pythagoras).`,
    areas:[{k:'B',c:TE,m:1,e:`${l} · ${b}`,v:l*b},{k:'x',c:AM,m:2,e:frac(`${l} · ${fm(sl)}`,'2'),v:r1(l*sl/2)},{k:'y',c:PK,m:2,e:frac(`${b} · ${fm(sb)}`,'2'),v:r1(b*sb/2)}]}};
 }
 // prismor: triangel, femhörning, sexhörning
 const n=fig==='pr'?3:fig==='p5'?5:6,p=d.ph,pl=n===3?'trianglar':n===5?'femhörningar':'sexhörningar',nm=n===3?'Triangulärt prisma':n===5?'Femhörnigt prisma':'Sexhörnigt prisma';
 const df={t:nm,text:`Ett prisma har två basytor som är lika stora månghörningar (här ${pl}). Alla andra sidoytor är rektanglar. Prismat får sitt namn av basytan. Basytorna behöver inte vara botten och lock – ett prisma kan ligga ner!`,groups:[['bas',`Basytor (2 st): ${pl}`],['sid',`Sidoytor (${n} st): rektanglar`]]};
 if(n===3){
  const a=d.tb,b=d.th,c=Math.hypot(a,b),Bv=a*b/2,F=prism([[0,0],[a,0],[0,b]],p,['x','z','y'],[AM,BL,PK],`(${a} · ${b}) / 2`);
  F.E=lie?[{f:'base',pt:[a/2,p],txt:`bas = ${a}`,dx:0,dy:16},{f:'pb',pt:[0,p+b/2],txt:`höjd = ${b}`,dx:-30,dy:0},{f:'base',pt:[0,p/2],txt:`prismans höjd = ${p}`,dx:-70,dy:0}]
        :[{f:'base',pt:[a/2,0],txt:`bas = ${a}`,dx:0,dy:-14},{f:'base',pt:[0,b/2],txt:`höjd = ${b}`,dx:-30,dy:0},{f:'r0',pt:[0,-p/2],txt:`prismans höjd = ${p}`,dx:-60,dy:0}];
  F.def=df;
  F.info={vol:'prism',shape:'triangel',bs:frac('b · h','2'),be:frac(`${a} · ${b}`,'2'),B:Bv,h:p,V:Bv*p,approx:!gi(c),
   note:u=>`Sidan c = ${fm(c)} ${u} (Pythagoras).`,
   areas:[{k:'B',c:TE,m:2,e:frac(`${a} · ${b}`,'2'),v:Bv},{k:'x',c:AM,m:1,e:`${a} · ${p}`,v:a*p},{k:'y',c:PK,m:1,e:`${b} · ${p}`,v:b*p},{k:'z',c:BL,m:1,e:`${fm(c)} · ${p}`,v:r1(c*p)}]};
  return F;
 }
 const a=d.a,kk=a/(2*Math.tan(Math.PI/n)),F=prism(reg(n,a),p,Array(n).fill('x'),Array(n).fill(AM),`${n} · ${a} · ${fm2(kk)} / 2`),Br=r1(F.Ar),bf=frac(`${a} · ${fm2(kk)}`,'2');
 const b0=F.faces[0].pts;
 F.E=lie?[{f:'base',pt:[a/2,p],txt:`a = ${a}`,dx:0,dy:16},{f:'base',pt:[0,p/2],txt:`prismans höjd = ${p}`,dx:-70,dy:0}]
       :[{f:'base',pt:[(b0[1][0]+b0[2][0])/2,(b0[1][1]+b0[2][1])/2],txt:`a = ${a}`,dx:18,dy:0},{f:'r1',pt:[(F.faces[2].pts[1][0]+F.faces[2].pts[2][0])/2,(F.faces[2].pts[1][1]+F.faces[2].pts[2][1])/2],txt:`prismans höjd = ${p}`,dx:50,dy:0}];
 F.def=df;
 F.info={vol:'prism',shape:`regelbunden ${n===5?'femhörning':'sexhörning'}`,bs:`${n} · ${frac('a · k','2')}`,be:`${n} · ${bf}`,B:Br,h:p,V:Br*p,approx:true,
  note:u=>`Basytan delas i ${n} trianglar med basen a och höjden k ≈ ${fm2(kk)} ${u}.`,
  areas:[{k:'B',c:TE,m:2,e:`${n} · ${bf}`,v:Br},{k:'x',c:AM,m:n,e:`${a} · ${p}`,v:a*p}]};

}
function layout(G){
 const by={};
 G.faces.forEach(f=>{
  by[f.id]=f;let P=[0,0],al=0,par=null;
  if(f.p){
   par=by[f.p];let [A,B]=f.hinge;const c=cen(f.pts);let dx=B[0]-A[0],dy=B[1]-A[1];
   if((c[0]-A[0])*(-dy)+(c[1]-A[1])*dx<0){[A,B]=[B,A];dx=-dx;dy=-dy}
   P=A;al=Math.atan2(dy,dx);
   const v=[P[0]-par.o[0],P[1]-par.o[1]],k=Math.cos(par.al),s=Math.sin(par.al);
   f.rel={x:v[0]*k+v[1]*s,y:-v[0]*s+v[1]*k,a:al-par.al};
  }else f.rel={x:0,y:0,a:0};
  f.par=par;f.o=P;f.al=al;
  const k=Math.cos(al),s=Math.sin(al);
  f.loc=f.pts.map(q=>{const x=q[0]-P[0],y=q[1]-P[1];return [x*k+y*s,-x*s+y*k]});
  f.M=par?mm(par.M,mm(RZ(f.rel.a),RX(f.fold*D))):I3;
 });
 G.faces.forEach(f=>{
  const n=mv(f.M,[0,0,1]).map(v=>-v),tg=n[2]>.9?[0,-1,0]:n[2]<-.9?[0,1,0]:[0,0,1];
  let best=0,bs=-9;
  for(let p=0;p<360;p+=5){const u=mv(f.M,[-Math.sin(p*D),-Math.cos(p*D),0]),sc=u[0]*tg[0]+u[1]*tg[1]+u[2]*tg[2];if(sc>bs){bs=sc;best=p}}
  f.phi=best;
 });
 G.by=by;return G;
}
function pos(f,q,tt){
 const k=Math.cos(f.al),s=Math.sin(f.al),x=q[0]-f.o[0],y=q[1]-f.o[1];
 let p=[x*k+y*s,-x*s+y*k,0];
 for(let n=f;n;n=n.par){p=mv(RZ(n.rel.a),mv(RX(n.fold*tt*D),p));p=[p[0]+n.rel.x,p[1]+n.rel.y,p[2]]}
 return p;
}
//ENDPURE
let t=1,rz=0,rx=0,zm=1,anim=null,camA=null,S=20,tab='V',G=null;
const stage=$('stage'),scene=$('scene'),tb=$('tb');
const mod=(a,n)=>((a%n)+n)%n;

function nodeHTML(f){
 const xs=f.loc.map(q=>q[0]),ys=f.loc.map(q=>q[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=(Math.max(...xs)-x0)*S,h=(Math.max(...ys)-y0)*S;
 const pts=f.loc.map(q=>`${(q[0]-x0)*S},${(q[1]-y0)*S}`).join(' '),cp=f.loc.map(q=>`${(q[0]-x0)*S}px ${(q[1]-y0)*S}px`).join(',');
 const c=cen(f.loc),cx=(c[0]-x0)*S,cy=(c[1]-y0)*S;
 const bg=f.g?`background-size:${S}px ${S}px;background-position:${mod(-x0*S,S)}px ${mod(-y0*S,S)}px;`:'background-image:none;';
 return `<div class="nd" id="nd_${f.id}"><div class="f${f.p?'':' base'}" data-id="${f.id}" data-g="${f.grp}" style="--c:${f.c};left:${x0*S}px;top:${y0*S}px;width:${w}px;height:${h}px">`+
  `<div class="sh" style="${bg}clip-path:polygon(${cp})"><svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;overflow:visible"><polygon points="${pts}" fill="none" stroke="#100e28" stroke-width="4" stroke-linejoin="round"/></svg></div>`+
  `<i class="a" style="left:${cx}px;top:${cy}px;transform:rotateZ(${-f.al/D}deg) translateZ(1px)"></i>`+
  `<i class="b" style="left:${cx}px;top:${cy}px;transform:rotateY(180deg) rotateZ(${f.phi}deg) translateZ(1px)"></i></div>`+
  G.faces.filter(g=>g.p===f.id).map(nodeHTML).join('')+`</div>`;
}
function build(){
 G=layout(geo());
 const all=G.faces.flatMap(f=>f.pts),ex=all.map(q=>q[0]),ey=all.map(q=>q[1]);
 const nx0=Math.min(...ex),nx1=Math.max(...ex),ny0=Math.min(...ey),ny1=Math.max(...ey);
 G.nc=[(nx0+nx1)/2,(ny0+ny1)/2];
 const desk=getComputedStyle(tb).position==='absolute',offX=desk?tb.offsetWidth+36:0,offY=desk?64:0;
 S=Math.max(6,Math.min(40,(stage.clientWidth-offX-24)/(nx1-nx0),(stage.clientHeight-offY-48)/(ny1-ny0)));
 scene.style.left=`calc(50% + ${offX/2}px)`;scene.style.top=`calc(50% - ${offY/2}px)`;
 const c=G.ctr,ext=Math.max(...all.map(q=>Math.hypot(q[0]-c[0],q[1]-c[1]))),R1=(ext+1)*S,R2=R1+8*S,fl=c[0]*S-R2,ft=c[1]*S-R2;
 const mk=`radial-gradient(circle at ${R2}px ${R2}px,#000 ${R1}px,transparent ${R2}px)`;
 const floor=`<div id="floor" style="left:${fl}px;top:${ft}px;width:${2*R2}px;height:${2*R2}px;background-size:${S}px ${S}px;background-position:${mod(-fl,S)}px ${mod(-ft,S)}px;-webkit-mask-image:${mk};mask-image:${mk};transform:translateZ(-1px)"></div>`;
 const bx=G.faces[0].pts.map(q=>q[0]),by=G.faces[0].pts.map(q=>q[1]),bw=Math.max(...bx),bh=Math.max(...by),Hw=G.H+3;
 const walls=`<div class="wall" id="wB" style="width:${(bw+3)*S}px;height:${Hw*S}px;background-size:${S}px ${S}px"></div><div class="wall" id="wL" style="width:${Hw*S}px;height:${(bh+3)*S}px;background-size:${S}px ${S}px"></div>`;
 scene.innerHTML=`<div id="root" style="position:absolute;left:${-c[0]*S}px;top:${-c[1]*S}px">${floor}${walls}${nodeHTML(G.faces[0])}${G.E.map((e,i)=>`<div class="eb" id="e${i}"></div>`).join('')}</div>`;
 labels();apply();
}
function labels(){
 const u=$('unit').value,m=$('sMeas').checked,a=$('sAns').checked,fo=$('sFocus').checked;
 document.querySelectorAll('.u').forEach(e=>e.textContent=u);
 document.querySelectorAll('.f').forEach(e=>{
  const f=G.by[e.dataset.id];let txt;
  if(!f.p&&fo)txt=(f.grp==='bas'?`Basyta`:`Golvyta`)+(m?`<br>${f.mt}`:'')+(a?`<br>B = ${fm(f.ar)} ${u}²`:'');
  else{txt=`<b>${f.ltr}</b>`+(m?` = ${f.mt}`:'');if(a)txt+=m?`<br>= ${fm(f.ar)} ${u}²`:` = ${fm(f.ar)} ${u}²`}
  const h=`<em>${txt}</em>`;e.querySelector('i.a').innerHTML=h;e.querySelector('i.b').innerHTML=h;
 });
 const ed=$('sEdge').checked;
 G.E.forEach((e,i)=>{const n=$('e'+i);n.textContent=`${e.txt} ${u}`;n.style.display=ed?'block':'none'});
 $('floor').style.backgroundImage=$('sFloor').checked?'linear-gradient(rgba(130,120,200,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(130,120,200,.45) 1px,transparent 1px)':'none';
}
function apply(){
 const tilt=Math.min(180,Math.max(0,t*55+rx)),rzE=t*30+rz;
 G.faces.forEach(f=>{if(f.p)$('nd_'+f.id).style.transform=`translate(${f.rel.x*S}px,${f.rel.y*S}px) rotate(${f.rel.a/D}deg) rotateX(${f.fold*t}deg)`});
 const wo=$('sWalls').checked?Math.max(0,(t-0.15)/0.85)*($('wallOp').value/100)*($('sFocus').checked?0.3:1):0;
 const W=(id,tr)=>{const e=$(id);e.style.transform=tr;e.style.opacity=wo;e.style.display=wo?'block':'none'};
 W('wB','translate3d(0,-1px,0) rotateX(90deg)');W('wL','translate3d(-1px,0,0) rotateY(-90deg)');
 G.E.forEach((e,i)=>{const p=pos(G.by[e.f],e.pt,t);
  $('e'+i).style.transform=`translate3d(${p[0]*S}px,${p[1]*S}px,${(p[2]+(e.z||0)*t)*S}px) rotateZ(${-rzE}deg) rotateX(${-tilt}deg) translateZ(30px) translate(-50%,-50%) translate(${e.dx}px,${e.dy}px)`});
 scene.style.transform=`scale(${zm}) translate(${-(1-t)*(G.nc[0]-G.ctr[0])*S}px,${-(1-t)*(G.nc[1]-G.ctr[1])*S+t*G.H*S*0.4}px) rotateX(${tilt}deg) rotateZ(${rzE}deg)`;
 $('fold').value=Math.round(t*100);
 $('zr').textContent=Math.round(zm*100)+' %';
 $('play').textContent=t>0.5?'Vik ut':'Vik ihop';
 $('below').textContent=tilt>110?'Tillbaka':'Se golvytan';
}
const R=(n,x)=>`<div class="rw"><span class="n">${n}</span><div>${x}</div></div>`,pl=(x,c)=>`<span class="pl" style="background:${c}">${x}</span>`;
function results(){
 const u=$('unit').value,c=$('sCalc').checked,q='<span class="q">?</span>',I=G.info;let x='';
 if(tab==='V'){
  const py=I.vol==='pyr',B=I.B,h=I.h,ap=I.approx?'≈':'=';
  x=R(1,py?`V = ${frac('B · h','3')}`:'V = B · h')+
   R(2,c?`Basytan är en ${I.shape}.<br>${pl('B',TE)} = ${I.bs} = ${I.be} ${ap} ${fm(B)} ${u}²`:`${pl('B',TE)} = ${q}`)+
   R(3,c?`h = ${fm(h)} ${u}`:`h = ${q}`)+
   R(4,c?(py?`V = ${frac(`${fm(B)} · ${fm(h)}`,'3')}<br>V = ${frac(fm(B*h),'3')}<br>V ${ap} ${fm(I.V)} ${u}³`:`V = ${fm(B)} · ${fm(h)}<br>V ${ap} ${fm(I.V)} ${u}³`):`V = ${q}`)+
   R(5,c?`Svar: Volymen är ${I.approx?'ungefär ':''}<span class="ans">${fm(I.V)} ${u}³</span>.`:`Svar: ${q}`);
 }else{
  const T=I.areas,tot=T.reduce((a,t)=>a+t.m*t.v,0),term=(a,v)=>`<span class="nb">${a.m>1?a.m+' · ':''}${v}</span>`;
  x=`<div class="q" style="font-size:.78rem;margin:0 0 6px">B.Y. = begränsningsytan${I.note?'<br>'+I.note(u):''}</div>`+
   R(1,'B.Y. = '+T.map(a=>term(a,pl(a.k,a.c))).join(' + '))+
   T.map((a,i)=>R(i+2,c?`${pl(a.k,a.c)} = ${a.e} = ${fm(a.v)} ${u}²`:`${pl(a.k,a.c)} = ${q}`)).join('')+
   R(T.length+2,c?`B.Y. = ${T.map(a=>term(a,pl(fm(a.v),a.c))).join(' + ')}<br>= ${T.map(a=>pl(fm(a.m*a.v),a.c)).join(' + ')}<br>${I.approx?'≈':'='} ${fm(tot)} ${u}²`:`B.Y. = ${q}`)+
   R(T.length+3,c?`Svar: ${I.approx?'ungefär ':''}<span class="ans">${fm(tot)} ${u}²</span>.`:`Svar: ${q}`);
 }
 $('res').innerHTML=x;
}
function dimsUI(){
 const sp=FIG[fig].P;
 $('dims').innerHTML=sp.map(([k,lab,mx])=>`<label class="ln"><span class="lbl">${lab} =</span><input type="number" id="in_${k}" min="1" max="${mx||MAX}" step="1" inputmode="numeric" value="${dm[fig][k]}"><span class="u"></span></label>`).join('');
 $('lieWrap').style.display=FIG[fig].lie?'flex':'none';
 sp.forEach(([k,,mx])=>{const el=$('in_'+k),MX=mx||MAX;
  el.oninput=()=>{const v=parseInt(el.value,10);if(v>=1&&v<=MX){dm[fig][k]=v;all()}};
  el.onchange=()=>{let v=parseInt(el.value,10);if(isNaN(v))v=dm[fig][k];v=Math.min(MX,Math.max(1,v));dm[fig][k]=v;el.value=v;all()};
 });
}
let hl='';
function setHl(g){hl=g;if(g)scene.dataset.hl=g;else delete scene.dataset.hl;defUI()}
function openDef(on){$('defCard').classList.toggle('on',on);if(!on)setHl('');else defUI()}
function defUI(){
 if(!G)return;const D=G.def;$('defT').textContent=D.t;
 $('defBody').innerHTML=`<p style="margin:0 0 8px">${D.text}</p><div class="chips">${D.groups.map(([k,l])=>`<button data-k="${k}" aria-pressed="${hl===k}">${l}</button>`).join('')}</div>`;
 $('defBody').querySelectorAll('button').forEach(b=>b.onclick=()=>setHl(hl===b.dataset.k?'':b.dataset.k));
}
function all(){build();results();defUI()}
$('fig').onchange=()=>{fig=$('fig').value;hl='';delete scene.dataset.hl;dimsUI();all()};
$('sLie').onchange=()=>{lie=$('sLie').checked;all()};
$('defB').onclick=()=>openDef(!$('defCard').classList.contains('on'));
$('defX').onclick=()=>openDef(false);
['unit','sEdge','sMeas','sAns','sFloor'].forEach(i=>$(i).onchange=()=>{labels();results()});
$('sWalls').onchange=apply;$('wallOp').oninput=apply;
$('sFocus').onchange=()=>{scene.classList.toggle('focus',$('sFocus').checked);labels();apply()};
$('sCalc').onchange=results;
function cam(rxT,rzT,T,zT){
 cancelAnimationFrame(camA);const a=rx,b=rz,z0=zm,t0=performance.now();
 const run=n=>{const p=Math.min(1,(n-t0)/T),e=ease(p);rx=a+(rxT-a)*e;rz=b+(rzT-b)*e;if(zT!==undefined)zm=z0+(zT-z0)*e;apply();if(p<1)camA=requestAnimationFrame(run)};
 camA=requestAnimationFrame(run);
}
const ZC=v=>Math.min(3,Math.max(.4,v));
$('reset').onclick=$('zr').onclick=()=>cam(0,0,800,1);
$('zi').onclick=()=>cam(rx,rz,220,ZC(zm*1.25));
$('zo').onclick=()=>cam(rx,rz,220,ZC(zm/1.25));
stage.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(camA);zm=ZC(zm*Math.exp(-e.deltaY*0.0015));apply()},{passive:false});
$('below').onclick=()=>{const tilt=Math.min(180,Math.max(0,t*55+rx));tilt>110?cam(0,0,1100):cam(165-t*55,0,1400)};
$('fold').oninput=e=>{cancelAnimationFrame(anim);t=e.target.value/100;apply()};
function go(to,T){
 cancelAnimationFrame(anim);const from=t,t0=performance.now();
 const run=n=>{const p=Math.min(1,(n-t0)/T);t=from+(to-from)*ease(p);apply();if(p<1)anim=requestAnimationFrame(run)};
 anim=requestAnimationFrame(run);
}
$('play').onclick=()=>go(t>0.5?0:1,1800);
$('openC').onclick=()=>{const on=$('drawer').classList.toggle('on');$('openC').setAttribute('aria-expanded',on);$('openC').textContent=on?'Dölj beräkningar':'Beräkningar'};
[['tV','V'],['tA','A']].forEach(([id,k])=>$(id).onclick=()=>{tab=k;$('tV').setAttribute('aria-pressed',k==='V');$('tA').setAttribute('aria-pressed',k==='A');results()});
let drag=null,pinch=null,dn=null;const ptr=new Map();
stage.onpointerdown=e=>{
 const ff=e.target.closest&&e.target.closest('.f');dn={x:e.clientX,y:e.clientY,id:ff?ff.dataset.id:null};
 cancelAnimationFrame(camA);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing';
 if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:zm};drag=null}
 else drag={x:e.clientX,y:e.clientY,rz,rx};
};
stage.onpointermove=e=>{
 if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2&&pinch){const [a,b]=[...ptr.values()];zm=ZC(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);apply();return}
 if(!drag)return;
 rz=drag.rz+(e.clientX-drag.x)*.5;rx=Math.max(-t*55,Math.min(180-t*55,drag.rx-(e.clientY-drag.y)*.5));apply();
};
stage.onpointerup=e=>{if(dn&&dn.id&&ptr.size===1&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<5){const g=G.by[dn.id].grp;setHl(hl===g?'':g);$('defCard').classList.add('on');defUI()}dn=null;ptr.delete(e.pointerId);pinch=null;drag=null;if(!ptr.size)stage.style.cursor='grab'};
stage.onpointercancel=e=>{dn=null;ptr.delete(e.pointerId);pinch=null;drag=null;if(!ptr.size)stage.style.cursor='grab'};
window.onresize=build;
dimsUI();all();
