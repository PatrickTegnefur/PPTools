<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tärning</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ─── PT Ljus — hämtat rakt av från brand.md ─── */
      --bg:        #f6f4ff;
      --surface:   #ffffff;
      --surface2:  #eae6ff;
      --border:    #ccc5f0;
      --text:      #100e28;
      --muted:     #585078;

      --accent:    #306BF0;
      --accent2:   #EC6095;
      --ak7:       #66C7C2;
      --ak8:       #F4A261;
      --ak9:       #EC6095;

      --gradient:  linear-gradient(120deg, #66C7C2 0%, #F4A261 50%, #EC6095 100%);
      --shadow:    rgba(48, 107, 240, 0.12);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;

      /* Mörkt läge — samma familj av kulörer, mörkare ytor */
      --bg-dark:      #0f0e22;
      --surface-dark: #1c1a3a;
      --surface2-dark:#262452;
      --border-dark:  #3a3768;
      --text-dark:    #f2f0ff;
      --muted-dark:   #a39cc9;

      --die1-ink:    var(--accent2);
      --die1-shadow: rgba(236, 96, 149, .28);
      --die1-glow:   rgba(236, 96, 149, .7);

      --die2-ink:    var(--ak7);
      --die2-shadow: rgba(102, 199, 194, .3);
      --die2-glow:   rgba(102, 199, 194, .7);

      --die-size: 150px;
    }

    html[data-theme="dark"] body { background: var(--bg-dark); color: var(--text-dark); }
    html[data-theme="dark"] .panel > summary,
    html[data-theme="dark"] .panel-body { background: var(--surface-dark); border-color: var(--border-dark); }
    html[data-theme="dark"] select,
    html[data-theme="dark"] .num-input { background: var(--surface-dark); border-color: var(--border-dark); color: var(--text-dark); }
    html[data-theme="dark"] .control-label,
    html[data-theme="dark"] .hist-label,
    html[data-theme="dark"] .toggle-wrap { color: var(--muted-dark); }
    html[data-theme="dark"] .hist-section { border-color: var(--border-dark); }
    html[data-theme="dark"] .toggle-track { background: var(--surface2-dark); border-color: var(--border-dark); }
    html[data-theme="dark"] .hist-chip { background: var(--surface2-dark); border-color: var(--border-dark); }

    /* Tärningarnas sidor: ljust läge = fyllda kulörer + vit siffra (poppar mot ljus botten),
       mörkt läge = ljusa neutrala sidor + kulört bläck (poppar mot mörk botten). */
    #scene1 .face.front  { background: #f17ba6; }
    #scene1 .face.top    { background: #f492b7; }
    #scene1 .face.right  { background: #EC6095; }
    #scene1 .face.left   { background: #d8558a; }
    #scene1 .face.back   { background: #c04a79; }
    #scene1 .face.bottom { background: #a83f68; }

    #scene2 .face.front  { background: #85d4cf; }
    #scene2 .face.top    { background: #9adcd8; }
    #scene2 .face.right  { background: #66C7C2; }
    #scene2 .face.left   { background: #55b0ab; }
    #scene2 .face.back   { background: #479c98; }
    #scene2 .face.bottom { background: #3a8884; }

    .face-value { color: #ffffff; }

    html[data-theme="dark"] .face.front  { background: #ffffff; }
    html[data-theme="dark"] .face.back   { background: #f5f3ff; }
    html[data-theme="dark"] .face.top    { background: #fafafe; }
    html[data-theme="dark"] .face.bottom { background: #eae6fc; }
    html[data-theme="dark"] .face.right  { background: #f0eeff; }
    html[data-theme="dark"] .face.left   { background: #ece8ff; }
    html[data-theme="dark"] #scene1 .face-value { color: var(--die1-ink); }
    html[data-theme="dark"] #scene2 .face-value { color: var(--die2-ink); }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .25s, color .25s;
    }

    /* ── Toppbanner — PT Ljus signaturgradient, alltid synlig ── */
    .topbar {
      position: sticky;
      top: 0;
      height: 64px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      z-index: 100;
    }
    .topbar .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: #ffffff;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .banner-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.5);
      background: rgba(255,255,255,.15);
      color: #ffffff;
      font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.28); }

    body.present-mode .hide-in-present { display: none !important; }

    /* ─── Layout: liten diskret verktygsrad + scen ─── */
    .main { display: flex; justify-content: center; padding: 5.5rem 1.5rem 2.5rem; }
    .layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      max-width: 860px;
    }

    /* Vertikal rad med tre diskreta ikonknappar: inställningar, kasta, historik.
       Var och en har sin egen flytande popover (position: absolute) så att
       öppning/stängning aldrig trycker på tärningarnas layout. */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .panel { position: relative; }
    .panel > summary {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      list-style: none;
      font-size: 1.05rem;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background .15s, border-color .25s;
    }
    .panel > summary::-webkit-details-marker { display: none; }
    .panel[open] > summary { border-color: var(--accent); }

    .panel-body {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 30;
      width: 220px;
      max-width: 82vw;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 28px var(--shadow);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      transition: background .25s, border-color .25s;
    }
    .hist-section { border-top: 1px solid var(--border); padding-top: .9rem; }
    #historyPanel .panel-body { width: 190px; }

    /* Den runda "kasta"-knappen — medvetet liten, tärningarna gör jobbet
       med att förklara sig själva, knappen är bara en snabb genväg. */
    .roll-icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--shadow);
      transition: background .15s, transform .1s;
    }
    .roll-icon-btn:hover { background: #1f58d4; }
    .roll-icon-btn:active { transform: scale(.92); }
    .roll-icon-btn:disabled { opacity: .45; cursor: not-allowed; }

    .control-group { display: flex; flex-direction: column; gap: .45rem; }
    .control-label, .hist-label { font-size: .78rem; font-weight: 700; color: var(--muted); }
    .hist-label { display: block; margin-bottom: 8px; }

    select, .num-input {
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      cursor: pointer;
      width: 100%;
    }
    .num-input { cursor: text; }
    select:focus, .num-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .num-input.hidden { display: none; }

    .toggle-wrap {
      display: flex; align-items: center; gap: .55rem;
      font-size: .82rem; color: var(--muted); font-weight: 500;
    }
    .toggle-wrap span { transition: color .2s; }
    .toggle-wrap span.active { color: var(--accent); font-weight: 700; }

    .toggle { position: relative; width: 46px; height: 25px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--surface2); border: 2px solid var(--border);
      border-radius: 99px; cursor: pointer;
      transition: background .25s, border-color .25s;
    }
    .toggle input:checked ~ .toggle-track { background: var(--accent); border-color: var(--accent); }
    .toggle-thumb {
      position: absolute; top: 2.5px; left: 2.5px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-track .toggle-thumb { transform: translateX(21px); }

    .history { display: flex; gap: 6px; flex-wrap: wrap; }
    .hist-chip {
      min-width: 30px; height: 30px; padding: 0 5px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif; font-size: .88rem; font-weight: 800; color: var(--accent);
      animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from { transform:scale(0);opacity:0; } to { transform:scale(1);opacity:1; } }

    /* ─── Scen (bara tärningarna — inga siffror runtomkring) ─── */
    .stage {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dice-row { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }

    .scene {
      width: calc(var(--die-size) + 24px);
      height: calc(var(--die-size) + 24px);
      perspective: 900px;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }
    .scene.die-hidden { display: none; }
    .scene.die-rolling { cursor: not-allowed; }
    #scene1 { filter: drop-shadow(0 16px 32px var(--die1-shadow)); }
    #scene2 { filter: drop-shadow(0 16px 32px var(--die2-shadow)); }

    .cube {
      width: var(--die-size);
      height: var(--die-size);
      margin: 12px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(30deg);
    }

    .face {
      position: absolute;
      width: var(--die-size);
      height: var(--die-size);
      border: 2.5px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face.front  { transform: translateZ(calc(var(--die-size) / 2)); }
    .face.back   { transform: rotateY(180deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.right  { transform: rotateY( 90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.left   { transform: rotateY(-90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.top    { transform: rotateX( 90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.bottom { transform: rotateX(-90deg)  translateZ(calc(var(--die-size) / 2)); }

    .face-value {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: calc(var(--die-size) * 0.34);
      line-height: 1;
      user-select: none;
    }
    .face-value.two-digit { font-size: calc(var(--die-size) * 0.24); }

    @keyframes suspenseGlow1 {
      from { filter: drop-shadow(0 0 2px var(--die1-shadow)); }
      to   { filter: drop-shadow(0 0 22px var(--die1-glow)); }
    }
    @keyframes suspenseGlow2 {
      from { filter: drop-shadow(0 0 2px var(--die2-shadow)); }
      to   { filter: drop-shadow(0 0 22px var(--die2-glow)); }
    }
    #scene1.suspense-rolling { animation: suspenseGlow1 .55s ease-in-out infinite alternate; }
    #scene2.suspense-rolling { animation: suspenseGlow2 .55s ease-in-out infinite alternate; }

    @media (prefers-reduced-motion: reduce) {
      .cube, .scene { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <span class="logo">Tärning</span>
  <div class="banner-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Växla mörkt/ljust läge" aria-label="Växla mellan mörkt och ljust läge">☀️</button>
    <button class="icon-btn" id="presentBtn" onclick="togglePresent()" title="Dölj/visa verktygsraden" aria-label="Dölj eller visa verktygsraden">👁️</button>
  </div>
</header>

<main class="main">
  <div class="layout">
    <div class="toolbar hide-in-present">
      <details class="panel" id="settingsPanel">
        <summary title="Inställningar" aria-label="Öppna inställningar">⚙️</summary>
        <div class="panel-body">
          <div class="control-group">
            <span class="control-label">Antal sidor</span>
            <select id="sidesSelect" onchange="onSidesChange()">
              <option value="4">4 sidor</option>
              <option value="6" selected>6 sidor</option>
              <option value="8">8 sidor</option>
              <option value="10">10 sidor</option>
              <option value="12">12 sidor</option>
              <option value="20">20 sidor</option>
              <option value="custom">Annat antal…</option>
            </select>
            <input type="number" id="customSides" class="num-input hidden" min="2" max="100" value="7" oninput="clampCustomSides()">
          </div>

          <div class="control-group">
            <span class="control-label">Antal tärningar</span>
            <div class="toggle-wrap">
              <span id="labelOneDie" class="active">1</span>
              <label class="toggle">
                <input type="checkbox" id="diceCountToggle" onchange="updateDiceCount()">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </label>
              <span id="labelTwoDice">2</span>
            </div>
          </div>

          <div class="control-group">
            <span class="control-label">Hastighet</span>
            <div class="toggle-wrap">
              <span id="labelSnabb">Snabbt</span>
              <label class="toggle">
                <input type="checkbox" id="suspenseToggle" checked onchange="updateSpeedLabel()">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </label>
              <span id="labelSpanning" class="active">🎭 Spänning</span>
            </div>
          </div>
        </div>
      </details>

      <button class="roll-icon-btn" id="rollBtn" onclick="rollAllActive()" title="Kasta tärningen" aria-label="Kasta tärningen">🎲</button>

      <details class="panel" id="historyPanel">
        <summary title="Senaste kast" aria-label="Visa senaste kast">🕓</summary>
        <div class="panel-body">
          <div class="hist-section" style="border-top:none; padding-top:0;">
            <span class="hist-label">Senaste kast</span>
            <div class="history" id="history"></div>
          </div>
        </div>
      </details>
    </div>

    <div class="stage">
      <div class="dice-row" id="diceRow">
        <div class="scene" id="scene1" onclick="rollDie(0)" title="Slå tärning 1">
          <div class="cube" id="cube1"></div>
        </div>
        <div class="scene die-hidden" id="scene2" onclick="rollDie(1)" title="Slå tärning 2">
          <div class="cube" id="cube2"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const FACES = [
  { cls: 'front',  rx:   0, ry:   0 },
  { cls: 'back',   rx:   0, ry: 180 },
  { cls: 'right',  rx:   0, ry: -90 },
  { cls: 'left',   rx:   0, ry:  90 },
  { cls: 'top',    rx: -90, ry:   0 },
  { cls: 'bottom', rx:  90, ry:   0 },
];

function buildCube(cubeEl) {
  const faceEls = {};
  FACES.forEach(f => {
    const face = document.createElement('div');
    face.className = 'face ' + f.cls;
    const val = document.createElement('div');
    val.className = 'face-value';
    val.textContent = '1';
    face.appendChild(val);
    cubeEl.appendChild(face);
    faceEls[f.cls] = val;
  });
  return faceEls;
}

const dice = [
  { scene: document.getElementById('scene1'), cube: document.getElementById('cube1'), rolling: false },
  { scene: document.getElementById('scene2'), cube: document.getElementById('cube2'), rolling: false },
];
dice.forEach(d => { d.faceEls = buildCube(d.cube); applyTransform(d.cube, 0, 0, 0); });

const rollHistory = [];

function applyTransform(cubeEl, rx, ry, ms, easing) {
  cubeEl.style.transition = ms > 0
    ? `transform ${ms}ms ${easing || 'cubic-bezier(.22,1,.36,1)'}`
    : 'none';
  cubeEl.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function finalAngle(targetDeg, spins) {
  const t = ((targetDeg % 360) + 360) % 360;
  return spins * 360 + t;
}

/* ── Kontroller ── */
function getSides() {
  const sel = document.getElementById('sidesSelect').value;
  if (sel !== 'custom') return parseInt(sel, 10);
  return clampCustomSides();
}
function clampCustomSides() {
  const input = document.getElementById('customSides');
  let n = parseInt(input.value, 10);
  if (isNaN(n)) n = 6;
  n = Math.min(100, Math.max(2, n));
  input.value = n;
  return n;
}
function onSidesChange() {
  const isCustom = document.getElementById('sidesSelect').value === 'custom';
  document.getElementById('customSides').classList.toggle('hidden', !isCustom);
}
function isDual() { return document.getElementById('diceCountToggle').checked; }
function isSuspense() { return document.getElementById('suspenseToggle').checked; }

function updateDiceCount() {
  const dual = isDual();
  document.getElementById('labelOneDie').classList.toggle('active', !dual);
  document.getElementById('labelTwoDice').classList.toggle('active', dual);
  document.getElementById('scene2').classList.toggle('die-hidden', !dual);
  const btn = document.getElementById('rollBtn');
  btn.title = dual ? 'Kasta tärningarna' : 'Kasta tärningen';
  btn.setAttribute('aria-label', btn.title);
}
function updateSpeedLabel() {
  const on = isSuspense();
  document.getElementById('labelSnabb').classList.toggle('active', !on);
  document.getElementById('labelSpanning').classList.toggle('active', on);
}
function togglePresent() {
  const on = document.body.classList.toggle('present-mode');
  document.getElementById('presentBtn').textContent = on ? '🙈' : '👁️';
}
// Stäng en popover-panel om man klickar utanför den — håller verktygsraden diskret.
document.addEventListener('click', function (e) {
  ['settingsPanel', 'historyPanel'].forEach(id => {
    const panel = document.getElementById(id);
    if (panel.open && !panel.contains(e.target)) panel.removeAttribute('open');
  });
});

function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
}

function paintDie(die, sides, targetIndex, targetVal) {
  FACES.forEach((f, i) => {
    const val = (i === targetIndex) ? targetVal : randInt(1, sides);
    const el = die.faceEls[f.cls];
    el.textContent = val;
    el.classList.toggle('two-digit', String(val).length > 1);
  });
}

function spinDie(die, sides, suspense) {
  const val = randInt(1, sides);
  const targetIndex = randInt(0, 5);
  paintDie(die, sides, targetIndex, val);
  const target = FACES[targetIndex];
  const spins = suspense ? 7 : 3;
  const fx = finalAngle(target.rx, spins);
  const fy = finalAngle(target.ry, spins);
  if (suspense) die.scene.classList.add('suspense-rolling');
  die.scene.classList.add('die-rolling');
  applyTransform(die.cube, 0, 0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    applyTransform(die.cube, fx, fy, suspense ? 3500 : 900, suspense ? 'cubic-bezier(.15,.5,.2,1)' : 'cubic-bezier(.22,1,.36,1)');
  }));
  return val;
}

/* Klick på en enskild tärning — rullar bara den, oberoende av den andra.
   Praktiskt i sannolikhetsmoment där man ibland vill kasta om bara en. */
function rollDie(i) {
  const die = dice[i];
  if (die.rolling) return;
  die.rolling = true;
  const sides = getSides();
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;
  const val = spinDie(die, sides, suspense);

  setTimeout(() => die.scene.classList.remove('suspense-rolling'), duration - 20);
  setTimeout(() => {
    die.rolling = false;
    die.scene.classList.remove('die-rolling');
    rollHistory.unshift({ type: 'single', die: i, val });
    trimAndRenderHistory();
  }, duration + 30);
}

/* Verktygsradens tärningsknapp — rullar alla aktiva tärningar tillsammans. */
function rollAllActive() {
  const dual = isDual();
  const activeIdx = dual ? [0, 1] : [0];
  if (activeIdx.some(i => dice[i].rolling)) return;

  const btn = document.getElementById('rollBtn');
  btn.disabled = true;

  const sides = getSides();
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;

  const results = {};
  activeIdx.forEach(i => {
    dice[i].rolling = true;
    results[i] = spinDie(dice[i], sides, suspense);
  });

  setTimeout(() => activeIdx.forEach(i => dice[i].scene.classList.remove('suspense-rolling')), duration - 20);
  setTimeout(() => {
    activeIdx.forEach(i => {
      dice[i].rolling = false;
      dice[i].scene.classList.remove('die-rolling');
    });
    rollHistory.unshift({ type: 'combo', vals: activeIdx.map(i => results[i]) });
    trimAndRenderHistory();
    btn.disabled = false;
  }, duration + 30);
}

function trimAndRenderHistory() {
  if (rollHistory.length > 9) rollHistory.length = 9;
  document.getElementById('history').innerHTML = rollHistory.map(entry => {
    if (entry.type === 'combo') {
      return `<div class="hist-chip">${entry.vals.join('+')}</div>`;
    }
    const color = entry.die === 0 ? 'var(--die1-ink)' : 'var(--die2-ink)';
    return `<div class="hist-chip" style="color:${color}">${entry.val}</div>`;
  }).join('');
}
</script>

</body>
