<!DOCTYPE html>
<html lang="sv" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tärning</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ─── PT Ljus — hämtat rakt av från brand.md ─── */
      --bg:        #f6f4ff;
      --surface:   #ffffff;
      --surface2:  #eae6ff;
      --border:    #ccc5f0;
      --text:      #100e28;
      --muted:     #585078;

      --accent:    #306BF0;
      --accent2:   #EC6095;
      --ak7:       #66C7C2;
      --ak8:       #F4A261;
      --ak9:       #EC6095;

      --gradient:  linear-gradient(120deg, #66C7C2 0%, #F4A261 50%, #EC6095 100%);
      --shadow:    rgba(48, 107, 240, 0.12);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;

      /* Mörkt läge — samma familj av kulörer, mörkare ytor */
      --bg-dark:      #0f0e22;
      --surface-dark: #1c1a3a;
      --surface2-dark:#262452;
      --border-dark:  #3a3768;
      --text-dark:    #f2f0ff;
      --muted-dark:   #a39cc9;

      --die1-ink:    var(--accent2);
      --die1-shadow: rgba(236, 96, 149, .28);
      --die1-glow:   rgba(236, 96, 149, .7);

      --die2-ink:    var(--ak7);
      --die2-shadow: rgba(102, 199, 194, .3);
      --die2-glow:   rgba(102, 199, 194, .7);

      --die-size: 150px;
      --coin-thickness: 15px;
    }

    html[data-theme="dark"] body { background: var(--bg-dark); color: var(--text-dark); }
    html[data-theme="dark"] .panel > summary,
    html[data-theme="dark"] .panel-body { background: var(--surface-dark); border-color: var(--border-dark); }
    html[data-theme="dark"] select,
    html[data-theme="dark"] .num-input { background: var(--surface-dark); border-color: var(--border-dark); color: var(--text-dark); }
    html[data-theme="dark"] .control-label,
    html[data-theme="dark"] .hist-label,
    html[data-theme="dark"] .toggle-wrap,
    html[data-theme="dark"] .freq-total,
    html[data-theme="dark"] .freq-label,
    html[data-theme="dark"] .freq-count { color: var(--muted-dark); }
    html[data-theme="dark"] .hist-section,
    html[data-theme="dark"] .freq-header { border-color: var(--border-dark); }
    html[data-theme="dark"] .toggle-track { background: var(--surface2-dark); border-color: var(--border-dark); }
    html[data-theme="dark"] .hist-chip,
    html[data-theme="dark"] .freq-track,
    html[data-theme="dark"] .batch-btn,
    html[data-theme="dark"] .freq-reset { background: var(--surface2-dark); border-color: var(--border-dark); color: var(--text-dark); }

    /* Tärningarnas sidor: fyllda kulörer + vit siffra, oavsett tema —
       samma tydliga kontrast i både ljust och mörkt läge. */
    #scene1 .face.front  { background: #f17ba6; }
    #scene1 .face.top    { background: #f492b7; }
    #scene1 .face.right  { background: #EC6095; }
    #scene1 .face.left   { background: #d8558a; }
    #scene1 .face.back   { background: #c04a79; }
    #scene1 .face.bottom { background: #a83f68; }

    #scene2 .face.front  { background: #85d4cf; }
    #scene2 .face.top    { background: #9adcd8; }
    #scene2 .face.right  { background: #66C7C2; }
    #scene2 .face.left   { background: #55b0ab; }
    #scene2 .face.back   { background: #479c98; }
    #scene2 .face.bottom { background: #3a8884; }

    .face-value { color: #ffffff; }

    /* ── Mynt: samma princip — fyllda kulörer + vit text i båda teman. ── */
    #coinScene1 .coin-face.heads { background: #f17ba6; }
    #coinScene1 .coin-face.tails { background: #c04a79; }
    #coinScene2 .coin-face.heads { background: #85d4cf; }
    #coinScene2 .coin-face.tails { background: #479c98; }
    .coin-label { color: #ffffff; }

    /* Myntkanten (tjockleken) — mörkaste tonen av respektive myntfärg,
       ger en tydlig "rand" runt myntet oavsett tema. */
    #coinScene1 .coin-rim-seg { background: #a83f68; }
    #coinScene2 .coin-rim-seg { background: #3a8884; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .25s, color .25s;
    }

    /* ── Toppbanner — PT Ljus signaturgradient, alltid synlig ── */
    .topbar {
      position: sticky;
      top: 0;
      height: 64px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      z-index: 100;
    }
    .topbar .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: #ffffff;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .banner-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.5);
      background: rgba(255,255,255,.15);
      color: #ffffff;
      font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background .15s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.28); }

    body.present-mode .hide-in-present { display: none !important; }

    /* ─── Layout: liten diskret verktygsrad + scen ─── */
    .main { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5.5rem 1.5rem 2.5rem; }
    /* Grid med symmetriska sidokolumner (samma bredd som verktygsraden på
       en osynlig spegel-kolumn till höger) — det gör att scenen hamnar
       exakt i mitten av samma bredd som panelraden under, så tärningarnas
       och panelernas mittpunkter alltid linjerar upp mot varandra. */
    .layout {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: start;
      gap: 1.5rem;
      width: 100%;
      max-width: 860px;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .panel { position: relative; }
    .panel > summary {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      list-style: none;
      font-size: 1.05rem;
      box-shadow: 0 2px 8px var(--shadow);
      transition: background .15s, border-color .25s;
    }
    .panel > summary::-webkit-details-marker { display: none; }
    .panel[open] > summary { border-color: var(--accent); }

    .panel-body {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 30;
      width: 220px;
      max-width: 82vw;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 28px var(--shadow);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      transition: background .25s, border-color .25s;
    }
    .hist-section { border-top: 1px solid var(--border); padding-top: .9rem; }
    /* Historik och frekvens är nu dockade paneler under scenen istället
       för flytande popovers, så de aldrig krockar med varandra. */
    .toggle-icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1.05rem;
      box-shadow: 0 2px 8px var(--shadow);
      transition: border-color .2s, background .15s;
    }
    .toggle-icon-btn.active { border-color: var(--accent); }
    html[data-theme="dark"] .toggle-icon-btn { background: var(--surface-dark); border-color: var(--border-dark); }

    /* Historik/frekvens-raden glider in underifrån istället för att bara
       poppa upp — och ligger på en egen rad under scenen (grid-rows-tricket
       animerar höjden utan att vi behöver känna till innehållets storlek). */
    .lower-panels-wrap {
      display: grid;
      grid-template-rows: 0fr;
      width: 100%;
      transition: grid-template-rows .35s ease;
    }
    .lower-panels-wrap.visible { grid-template-rows: 1fr; }
    .lower-panels-wrap > .lower-panels-inner { overflow: hidden; min-height: 0; }

    .lower-panels {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding-top: 2rem;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .3s ease, transform .35s ease;
    }
    .lower-panels-wrap.visible .lower-panels { opacity: 1; transform: translateY(0); }
    .lower-panel {
      flex: 1 1 220px;
      max-width: 320px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 28px var(--shadow);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      transition: background .25s, border-color .25s;
    }
    html[data-theme="dark"] .lower-panel { background: var(--surface-dark); border-color: var(--border-dark); }

    .roll-icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 10px var(--shadow);
      transition: background .15s, transform .1s;
    }
    .roll-icon-btn:hover { background: #1f58d4; }
    .roll-icon-btn:active { transform: scale(.92); }
    .roll-icon-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* Snabbväxlare för antal föremål (1/2) — egen liten kontroll utanför
       inställningarna, för att slippa öppna panelen varje gång. */
    .segmented {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: 0 2px 8px var(--shadow);
      overflow: hidden;
    }
    .seg-btn {
      width: 19px; height: 38px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Montserrat', sans-serif;
      font-size: .78rem; font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .seg-btn.active { background: var(--accent); color: #fff; }
    html[data-theme="dark"] .segmented { background: var(--surface-dark); border-color: var(--border-dark); }
    html[data-theme="dark"] .seg-btn { color: var(--muted-dark); }

    .control-group { display: flex; flex-direction: column; gap: .45rem; }
    .control-label, .hist-label { font-size: .78rem; font-weight: 700; color: var(--muted); }
    .hist-label { display: block; margin-bottom: 8px; }

    select, .num-input {
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      cursor: pointer;
      width: 100%;
    }
    .num-input { cursor: text; }
    select:focus, .num-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .num-input.hidden { display: none; }

    .toggle-wrap {
      display: flex; align-items: center; gap: .55rem;
      font-size: .82rem; color: var(--muted); font-weight: 500;
    }
    .toggle-wrap span { transition: color .2s; }
    .toggle-wrap span.active { color: var(--accent); font-weight: 700; }

    .toggle { position: relative; width: 46px; height: 25px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--surface2); border: 2px solid var(--border);
      border-radius: 99px; cursor: pointer;
      transition: background .25s, border-color .25s;
    }
    .toggle input:checked ~ .toggle-track { background: var(--accent); border-color: var(--accent); }
    .toggle-thumb {
      position: absolute; top: 2.5px; left: 2.5px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-track .toggle-thumb { transform: translateX(21px); }

    .history { display: flex; gap: 6px; flex-wrap: wrap; }
    .hist-chip {
      min-width: 30px; height: 30px; padding: 0 6px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif; font-size: .82rem; font-weight: 800; color: var(--accent);
      animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from { transform:scale(0);opacity:0; } to { transform:scale(1);opacity:1; } }

    /* ── Frekvenspanel ── */
    .freq-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); padding-bottom: .8rem;
    }
    .freq-total { font-size: .78rem; font-weight: 700; color: var(--muted); }
    .freq-reset {
      font-family: 'Montserrat', sans-serif;
      font-size: .72rem; font-weight: 700;
      background: var(--surface2); color: var(--accent);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 5px 9px; cursor: pointer;
    }
    .batch-row { display: flex; gap: 6px; }
    .batch-btn {
      flex: 1;
      font-family: 'Montserrat', sans-serif;
      font-size: .8rem; font-weight: 700;
      background: var(--surface2); color: var(--accent);
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      padding: 7px 0; cursor: pointer;
      transition: border-color .15s;
    }
    .batch-btn:hover { border-color: var(--accent); }
    .freq-chart {
      display: flex; flex-direction: column; gap: 5px;
      max-height: 220px; overflow-y: auto; padding-right: 2px;
    }
    .freq-row { display: flex; align-items: center; gap: 8px; }
    .freq-label { min-width: 46px; font-size: .74rem; font-weight: 700; color: var(--muted); text-align: right; }
    .freq-track {
      flex: 1; height: 14px; border-radius: 7px;
      background: var(--surface2); border: 1px solid var(--border);
      overflow: hidden;
    }
    .freq-fill { height: 100%; background: var(--accent); border-radius: 7px; min-width: 2px; transition: width .3s; }
    .freq-count { width: 62px; font-size: .72rem; color: var(--muted); }

    /* ─── Scen (bara tärningarna/mynten — inga siffror runtomkring) ─── */
    .stage {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mode-group { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }

    .scene {
      width: calc(var(--die-size) + 24px);
      height: calc(var(--die-size) + 24px);
      perspective: 900px;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }
    .scene.die-hidden { display: none; }
    .scene.die-rolling { cursor: not-allowed; }
    #scene1, #coinScene1 { filter: drop-shadow(0 16px 32px var(--die1-shadow)); }
    #scene2, #coinScene2 { filter: drop-shadow(0 16px 32px var(--die2-shadow)); }

    .cube {
      width: var(--die-size);
      height: var(--die-size);
      margin: 12px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(30deg);
    }

    .face {
      position: absolute;
      width: var(--die-size);
      height: var(--die-size);
      border: 2.5px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face.front  { transform: translateZ(calc(var(--die-size) / 2)); }
    .face.back   { transform: rotateY(180deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.right  { transform: rotateY( 90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.left   { transform: rotateY(-90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.top    { transform: rotateX( 90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face.bottom { transform: rotateX(-90deg)  translateZ(calc(var(--die-size) / 2)); }

    .face-value {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: calc(var(--die-size) * 0.34);
      line-height: 1;
      user-select: none;
    }
    .face-value.two-digit { font-size: calc(var(--die-size) * 0.24); }

    /* ── Mynt: platt rund "flip"-skiva, roterar runt Y-axeln.
       Ser realistiskt ut eftersom skivan blir kant-tunn (nästan osynlig)
       mitt i rotationen — precis som ett riktigt snurrande mynt. ── */
    .coin {
      width: var(--die-size);
      height: var(--die-size);
      margin: 12px;
      position: relative;
      transform-style: preserve-3d;
      border-radius: 50%;
    }
    .coin-face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: inset 0 0 0 6px rgba(255,255,255,.15);
    }
    .coin-face.heads { transform: translateZ(calc(var(--coin-thickness) / 2)); }
    .coin-face.tails { transform: rotateY(180deg) translateZ(calc(var(--coin-thickness) / 2)); }

    /* Myntkant — en ring av smala segment runt Y-axeln som ger myntet
       en verklig tjocklek, synlig särskilt när det vänder kant-mot-kameran. */
    .coin-rim-seg {
      position: absolute;
      left: 50%; top: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -1px 0 rgba(0,0,0,.2);
    }

    .coin-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: calc(var(--die-size) * 0.15);
      letter-spacing: .04em;
      user-select: none;
    }

    @keyframes suspenseGlow1 {
      from { filter: drop-shadow(0 0 2px var(--die1-shadow)); }
      to   { filter: drop-shadow(0 0 22px var(--die1-glow)); }
    }
    @keyframes suspenseGlow2 {
      from { filter: drop-shadow(0 0 2px var(--die2-shadow)); }
      to   { filter: drop-shadow(0 0 22px var(--die2-glow)); }
    }
    #scene1.suspense-rolling, #coinScene1.suspense-rolling { animation: suspenseGlow1 .55s ease-in-out infinite alternate; }
    #scene2.suspense-rolling, #coinScene2.suspense-rolling { animation: suspenseGlow2 .55s ease-in-out infinite alternate; }

    @media (prefers-reduced-motion: reduce) {
      .cube, .coin, .scene { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <span class="logo">Tärning</span>
  <div class="banner-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Växla mörkt/ljust läge" aria-label="Växla mellan mörkt och ljust läge">☀️</button>
    <button class="icon-btn" id="presentBtn" onclick="togglePresent()" title="Dölj/visa verktygsraden" aria-label="Dölj eller visa verktygsraden">👁️</button>
  </div>
</header>

<main class="main">
  <div class="layout">
    <div class="toolbar hide-in-present">
      <details class="panel" id="settingsPanel">
        <summary title="Inställningar" aria-label="Öppna inställningar">⚙️</summary>
        <div class="panel-body">
          <div class="control-group">
            <span class="control-label">Läge</span>
            <div class="toggle-wrap">
              <span id="labelModeDice" class="active">🎲 Tärning</span>
              <label class="toggle">
                <input type="checkbox" id="modeToggle" onchange="updateMode(); saveSettings();">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </label>
              <span id="labelModeCoin">🪙 Slant</span>
            </div>
          </div>

          <div class="control-group" id="sidesGroup">
            <span class="control-label">Antal sidor</span>
            <select id="sidesSelect" onchange="onSidesChange(); saveSettings();">
              <option value="4">4 sidor</option>
              <option value="6" selected>6 sidor</option>
              <option value="8">8 sidor</option>
              <option value="10">10 sidor</option>
              <option value="12">12 sidor</option>
              <option value="20">20 sidor</option>
              <option value="custom">Annat antal…</option>
            </select>
            <input type="number" id="customSides" class="num-input hidden" min="2" max="100" value="7" oninput="clampCustomSides(); onSidesChange(); saveSettings();">
          </div>

          <div class="control-group">
            <span class="control-label">Hastighet</span>
            <div class="toggle-wrap">
              <span id="labelSnabb">Snabbt</span>
              <label class="toggle">
                <input type="checkbox" id="suspenseToggle" checked onchange="updateSpeedLabel(); saveSettings();">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </label>
              <span id="labelSpanning" class="active">🎭 Spänning</span>
            </div>
          </div>

          <div class="control-group">
            <span class="control-label">Ljud</span>
            <div class="toggle-wrap">
              <span id="labelSoundOff" class="active">🔇</span>
              <label class="toggle">
                <input type="checkbox" id="soundToggle" onchange="updateSoundLabel(); saveSettings();">
                <div class="toggle-track"><div class="toggle-thumb"></div></div>
              </label>
              <span id="labelSoundOn">🔊</span>
            </div>
          </div>
        </div>
      </details>

      <button class="roll-icon-btn" id="rollBtn" onclick="rollAllActive()" title="Kasta tärningen" aria-label="Kasta tärningen">🎲</button>

      <div class="segmented" id="countSegment" title="Antal föremål" role="group" aria-label="Antal föremål">
        <button class="seg-btn active" data-count="1" onclick="setCount(1)">1</button>
        <button class="seg-btn" data-count="2" onclick="setCount(2)">2</button>
      </div>

      <button class="toggle-icon-btn" id="historyToggleBtn" onclick="toggleHistoryDock()" title="Senaste kast" aria-label="Visa/dölj senaste kast">🕓</button>

      <button class="toggle-icon-btn" id="freqToggleBtn" onclick="toggleFreqDock()" title="Frekvens" aria-label="Visa/dölj frekvenstabell">📊</button>
    </div>

    <div class="stage">
      <div class="mode-group" id="diceGroup">
        <div class="scene" id="scene1" onclick="rollDie(0)" title="Slå tärning 1">
          <div class="cube" id="cube1"></div>
        </div>
        <div class="scene die-hidden" id="scene2" onclick="rollDie(1)" title="Slå tärning 2">
          <div class="cube" id="cube2"></div>
        </div>
      </div>
      <div class="mode-group" id="coinGroup" style="display:none;">
        <div class="scene" id="coinScene1" onclick="rollCoin(0)" title="Singla mynt 1">
          <div class="coin" id="coin1"></div>
        </div>
        <div class="scene die-hidden" id="coinScene2" onclick="rollCoin(1)" title="Singla mynt 2">
          <div class="coin" id="coin2"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="lower-panels-wrap hide-in-present" id="lowerPanelsWrap">
    <div class="lower-panels-inner">
    <div class="lower-panels" id="lowerPanels">
    <div class="lower-panel" id="historyDock" style="display:none;">
      <span class="hist-label">Senaste kast</span>
      <div class="history" id="history"></div>
    </div>

    <div class="lower-panel" id="freqDock" style="display:none;">
      <div class="freq-header">
        <span class="freq-total" id="freqTotal">Totalt: 0 kast</span>
        <button class="freq-reset" onclick="resetFrequencyManual()">Nollställ</button>
      </div>
      <div class="batch-row">
        <button class="batch-btn" onclick="rollBatch(1)">1</button>
        <button class="batch-btn" onclick="rollBatch(10)">10</button>
        <button class="batch-btn" onclick="rollBatch(50)">50</button>
        <button class="batch-btn" onclick="rollBatch(100)">100</button>
      </div>
      <div class="freq-chart" id="freqChart"></div>
    </div>
    </div>
    </div>
  </div>
</main>

<script>
const FACES = [
  { cls: 'front',  rx:   0, ry:   0 },
  { cls: 'back',   rx:   0, ry: 180 },
  { cls: 'right',  rx:   0, ry: -90 },
  { cls: 'left',   rx:   0, ry:  90 },
  { cls: 'top',    rx: -90, ry:   0 },
  { cls: 'bottom', rx:  90, ry:   0 },
];

function buildCube(cubeEl) {
  const faceEls = {};
  FACES.forEach(f => {
    const face = document.createElement('div');
    face.className = 'face ' + f.cls;
    const val = document.createElement('div');
    val.className = 'face-value';
    val.textContent = '1';
    face.appendChild(val);
    cubeEl.appendChild(face);
    faceEls[f.cls] = val;
  });
  return faceEls;
}
function buildCoin(coinEl) {
  const faceEls = {};
  [['heads', 'KRONA'], ['tails', 'KLAVE']].forEach(([cls, label]) => {
    const face = document.createElement('div');
    face.className = 'coin-face ' + cls;
    const val = document.createElement('div');
    val.className = 'coin-label';
    val.textContent = label;
    face.appendChild(val);
    coinEl.appendChild(face);
    faceEls[cls] = face;
  });
  buildCoinRim(coinEl);
  return faceEls;
}

/* Bygger myntets kant av tunna segment rotarede runt Y-axeln — samma knep
   som brukar användas för att simulera en cylinder i CSS 3D. */
function buildCoinRim(coinEl) {
  const root = getComputedStyle(document.documentElement);
  const size = parseFloat(root.getPropertyValue('--die-size')) || 150;
  const thickness = parseFloat(root.getPropertyValue('--coin-thickness')) || 15;
  const radius = size / 2;
  const segments = 18;
  const angleStep = 360 / segments;
  const chord = 2 * radius * Math.sin(Math.PI / segments) * 1.18; // lätt överlapp, undviker glipor
  for (let i = 0; i < segments; i++) {
    const seg = document.createElement('div');
    seg.className = 'coin-rim-seg';
    seg.style.width = chord + 'px';
    seg.style.height = thickness + 'px';
    seg.style.marginLeft = (-chord / 2) + 'px';
    seg.style.marginTop = (-thickness / 2) + 'px';
    seg.style.transform = `rotateZ(${i * angleStep}deg) rotateX(90deg) translateZ(${radius}px)`;
    coinEl.appendChild(seg);
  }
}

const dice = [
  { scene: document.getElementById('scene1'), cube: document.getElementById('cube1'), rolling: false },
  { scene: document.getElementById('scene2'), cube: document.getElementById('cube2'), rolling: false },
];
dice.forEach(d => { d.faceEls = buildCube(d.cube); applyTransform(d.cube, 0, 0, 0); });

const coins = [
  { scene: document.getElementById('coinScene1'), coin: document.getElementById('coin1'), rolling: false },
  { scene: document.getElementById('coinScene2'), coin: document.getElementById('coin2'), rolling: false },
];
coins.forEach(c => { c.faceEls = buildCoin(c.coin); applyTransform(c.coin, 0, 0, 0); });

const rollHistory = [];
let freqCounts = {};
let freqLabelsOrder = [];
let totalRolls = 0;

function applyTransform(el, rx, ry, ms, easing) {
  el.style.transition = ms > 0
    ? `transform ${ms}ms ${easing || 'cubic-bezier(.22,1,.36,1)'}`
    : 'none';
  el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
}
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function finalAngle(targetDeg, spins) {
  const t = ((targetDeg % 360) + 360) % 360;
  return spins * 360 + t;
}

/* ── Kontroller ── */
function getSides() {
  const sel = document.getElementById('sidesSelect').value;
  if (sel !== 'custom') return parseInt(sel, 10);
  return clampCustomSides();
}
function clampCustomSides() {
  const input = document.getElementById('customSides');
  let n = parseInt(input.value, 10);
  if (isNaN(n)) n = 6;
  n = Math.min(100, Math.max(2, n));
  input.value = n;
  return n;
}
function onSidesChange() {
  const isCustom = document.getElementById('sidesSelect').value === 'custom';
  document.getElementById('customSides').classList.toggle('hidden', !isCustom);
  resetFrequencyIfNeeded();
  renderFrequencyChart();
}
let itemCount = 1;
function isDual() { return itemCount === 2; }
function isSuspense() { return document.getElementById('suspenseToggle').checked; }
function isSoundOn() { return document.getElementById('soundToggle').checked; }
function isCoinMode() { return document.getElementById('modeToggle').checked; }

function updateRollBtnState() {
  const coin = isCoinMode();
  const dual = isDual();
  const btn = document.getElementById('rollBtn');
  btn.textContent = coin ? '🪙' : '🎲';
  btn.title = coin ? (dual ? 'Singla slantarna' : 'Singla slanten') : (dual ? 'Kasta tärningarna' : 'Kasta tärningen');
  btn.setAttribute('aria-label', btn.title);
}

function updateMode() {
  const coin = isCoinMode();
  document.getElementById('diceGroup').style.display = coin ? 'none' : 'flex';
  document.getElementById('coinGroup').style.display = coin ? 'flex' : 'none';
  document.getElementById('sidesGroup').style.display = coin ? 'none' : 'flex';
  document.getElementById('countSegment').title = coin ? 'Antal mynt' : 'Antal tärningar';
  document.getElementById('labelModeDice').classList.toggle('active', !coin);
  document.getElementById('labelModeCoin').classList.toggle('active', coin);
  updateRollBtnState();
  resetFrequencyIfNeeded();
  renderFrequencyChart();
}

/* Snabbväxlaren för 1/2 föremål — egen kontroll i verktygsraden istället
   för att ligga gömd inne i inställningarna. */
function setCount(n) {
  itemCount = n;
  document.querySelectorAll('#countSegment .seg-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.count, 10) === n);
  });
  document.getElementById('scene2').classList.toggle('die-hidden', n !== 2);
  document.getElementById('coinScene2').classList.toggle('die-hidden', n !== 2);
  updateRollBtnState();
  saveSettings();
}
function updateSpeedLabel() {
  const on = isSuspense();
  document.getElementById('labelSnabb').classList.toggle('active', !on);
  document.getElementById('labelSpanning').classList.toggle('active', on);
}
function updateSoundLabel() {
  const on = isSoundOn();
  document.getElementById('labelSoundOff').classList.toggle('active', !on);
  document.getElementById('labelSoundOn').classList.toggle('active', on);
}
function togglePresent() {
  const on = document.body.classList.toggle('present-mode');
  document.getElementById('presentBtn').textContent = on ? '🙈' : '👁️';
}

/* Historik och frekvens dockas nu under scenen istället för att vara
   flytande popovers — så de aldrig kan krocka med varandra, och delar
   utrymmet i sidled när båda är öppna samtidigt. */
function updateLowerPanelsVisibility() {
  const historyOpen = document.getElementById('historyDock').style.display !== 'none';
  const freqOpen = document.getElementById('freqDock').style.display !== 'none';
  document.getElementById('lowerPanelsWrap').classList.toggle('visible', historyOpen || freqOpen);
}
function toggleHistoryDock() {
  const dock = document.getElementById('historyDock');
  const show = dock.style.display === 'none';
  dock.style.display = show ? 'flex' : 'none';
  document.getElementById('historyToggleBtn').classList.toggle('active', show);
  updateLowerPanelsVisibility();
}
function toggleFreqDock() {
  const dock = document.getElementById('freqDock');
  const show = dock.style.display === 'none';
  dock.style.display = show ? 'flex' : 'none';
  document.getElementById('freqToggleBtn').classList.toggle('active', show);
  updateLowerPanelsVisibility();
}

// Stäng inställningspanelen om man klickar utanför den.
document.addEventListener('click', function (e) {
  const panel = document.getElementById('settingsPanel');
  if (panel.open && !panel.contains(e.target)) panel.removeAttribute('open');
});

// Mellanslag/Enter kastar/singlar när inget UI-element har fokus.
document.addEventListener('keydown', function (e) {
  if (e.code !== 'Space' && e.code !== 'Enter') return;
  if (document.activeElement && document.activeElement !== document.body) return;
  e.preventDefault();
  rollAllActive();
});

function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
  saveSettings();
}

/* ── Ljud: en kort, självgenererad rassel-effekt via Web Audio API
     (inga externa ljudfiler — filen är fortfarande helt självbärande). ── */
function playSoundIfEnabled() {
  if (!isSoundOn()) return;
  try {
    if (!window._diceAudioCtx) window._diceAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = window._diceAudioCtx;
    const now = ctx.currentTime;
    const clicks = 5;
    for (let i = 0; i < clicks; i++) {
      const t = now + i * 0.045 + Math.random() * 0.015;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 650 + Math.random() * 500;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.16, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.06);
    }
  } catch (e) { /* tyst fallback om Web Audio saknas */ }
}

/* ── Frekvenstabell — fungerar generellt för både tärnings- och myntläge,
     genom att räkna på etiketter ("1".."sidor" eller "Krona"/"Klave")
     istället för ett fast index. ── */
function currentFreqLabels() {
  if (isCoinMode()) return ['Krona', 'Klave'];
  const sides = getSides();
  const labels = [];
  for (let i = 1; i <= sides; i++) labels.push(String(i));
  return labels;
}
function resetFrequencyIfNeeded() {
  const labels = currentFreqLabels();
  const same = labels.length === freqLabelsOrder.length && labels.every((l, i) => l === freqLabelsOrder[i]);
  if (!same) {
    freqLabelsOrder = labels;
    freqCounts = {};
    labels.forEach(l => { freqCounts[l] = 0; });
    totalRolls = 0;
  }
}
function recordFrequency(label) {
  resetFrequencyIfNeeded();
  if (!(label in freqCounts)) freqCounts[label] = 0;
  freqCounts[label]++;
  totalRolls++;
}
function resetFrequencyManual() {
  resetFrequencyIfNeeded();
  freqLabelsOrder.forEach(l => { freqCounts[l] = 0; });
  totalRolls = 0;
  renderFrequencyChart();
}
function renderFrequencyChart() {
  resetFrequencyIfNeeded();
  const max = Math.max(1, ...freqLabelsOrder.map(l => freqCounts[l] || 0));
  document.getElementById('freqChart').innerHTML = freqLabelsOrder.map(label => {
    const c = freqCounts[label] || 0;
    const pct = totalRolls ? Math.round((c / totalRolls) * 100) : 0;
    const widthPct = Math.round((c / max) * 100);
    return `<div class="freq-row">
      <span class="freq-label">${label}</span>
      <div class="freq-track"><div class="freq-fill" style="width:${widthPct}%"></div></div>
      <span class="freq-count">${c}${totalRolls ? ' (' + pct + '%)' : ''}</span>
    </div>`;
  }).join('');
  document.getElementById('freqTotal').textContent = 'Totalt: ' + totalRolls + ' kast';
}

/* ── Tärningar ── */
function paintDie(die, sides, targetIndex, targetVal) {
  FACES.forEach((f, i) => {
    const val = (i === targetIndex) ? targetVal : randInt(1, sides);
    const el = die.faceEls[f.cls];
    el.textContent = val;
    el.classList.toggle('two-digit', String(val).length > 1);
  });
}
function spinDie(die, sides, suspense, forcedVal) {
  const val = (forcedVal !== undefined) ? forcedVal : randInt(1, sides);
  const targetIndex = randInt(0, 5);
  paintDie(die, sides, targetIndex, val);
  const target = FACES[targetIndex];
  const spins = suspense ? 7 : 3;
  const fx = finalAngle(target.rx, spins);
  const fy = finalAngle(target.ry, spins);
  if (suspense) die.scene.classList.add('suspense-rolling');
  die.scene.classList.add('die-rolling');
  applyTransform(die.cube, 0, 0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    applyTransform(die.cube, fx, fy, suspense ? 3500 : 900, suspense ? 'cubic-bezier(.15,.5,.2,1)' : 'cubic-bezier(.22,1,.36,1)');
  }));
  return val;
}

function rollDie(i) {
  const die = dice[i];
  if (die.rolling) return;
  die.rolling = true;
  const sides = getSides();
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;
  playSoundIfEnabled();
  const val = spinDie(die, sides, suspense);
  recordFrequency(String(val));
  renderFrequencyChart();

  setTimeout(() => die.scene.classList.remove('suspense-rolling'), duration - 20);
  setTimeout(() => {
    die.rolling = false;
    die.scene.classList.remove('die-rolling');
    rollHistory.unshift({ type: 'single', slot: i, label: String(val) });
    trimAndRenderHistory();
  }, duration + 30);
}

function rollAllDice() {
  const dual = isDual();
  const activeIdx = dual ? [0, 1] : [0];
  if (activeIdx.some(i => dice[i].rolling)) return;

  const btn = document.getElementById('rollBtn');
  btn.disabled = true;

  const sides = getSides();
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;
  playSoundIfEnabled();

  const results = {};
  activeIdx.forEach(i => {
    dice[i].rolling = true;
    results[i] = spinDie(dice[i], sides, suspense);
    recordFrequency(String(results[i]));
  });
  renderFrequencyChart();

  setTimeout(() => activeIdx.forEach(i => dice[i].scene.classList.remove('suspense-rolling')), duration - 20);
  setTimeout(() => {
    activeIdx.forEach(i => { dice[i].rolling = false; dice[i].scene.classList.remove('die-rolling'); });
    rollHistory.unshift({ type: 'combo', labels: activeIdx.map(i => String(results[i])) });
    trimAndRenderHistory();
    btn.disabled = false;
  }, duration + 30);
}

function rollBatchDice(n) {
  const dual = isDual();
  const activeIdx = dual ? [0, 1] : [0];
  if (activeIdx.some(i => dice[i].rolling)) return;
  const sides = getSides();
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;

  const finalVal = {};
  for (let k = 0; k < n; k++) {
    activeIdx.forEach(i => {
      const val = randInt(1, sides);
      recordFrequency(String(val));
      finalVal[i] = val;
    });
  }
  renderFrequencyChart();
  playSoundIfEnabled();
  activeIdx.forEach(i => { dice[i].rolling = true; spinDie(dice[i], sides, suspense, finalVal[i]); });
  setTimeout(() => activeIdx.forEach(i => dice[i].scene.classList.remove('suspense-rolling')), duration - 20);
  setTimeout(() => activeIdx.forEach(i => { dice[i].rolling = false; dice[i].scene.classList.remove('die-rolling'); }), duration + 30);
}

/* ── Mynt — samma princip, men bara två fasta sidor (Krona/Klave) och
     rotation runt Y-axeln så myntet blir kant-tunt mitt i singlingen. ── */
function spinCoin(coinObj, suspense, forcedFace) {
  const face = forcedFace || (Math.random() < 0.5 ? 'heads' : 'tails');
  const ry = face === 'heads' ? 0 : 180;
  const spins = suspense ? 7 : 3;
  const fy = finalAngle(ry, spins);
  if (suspense) coinObj.scene.classList.add('suspense-rolling');
  coinObj.scene.classList.add('die-rolling');
  applyTransform(coinObj.coin, 0, 0, 0);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    applyTransform(coinObj.coin, 0, fy, suspense ? 3500 : 900, suspense ? 'cubic-bezier(.15,.5,.2,1)' : 'cubic-bezier(.22,1,.36,1)');
  }));
  return face;
}
function coinLabel(face) { return face === 'heads' ? 'Krona' : 'Klave'; }
function coinAbbrev(face) { return face === 'heads' ? 'Kr' : 'Kl'; }

function rollCoin(i) {
  const c = coins[i];
  if (c.rolling) return;
  c.rolling = true;
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;
  playSoundIfEnabled();
  const face = spinCoin(c, suspense);
  recordFrequency(coinLabel(face));
  renderFrequencyChart();

  setTimeout(() => c.scene.classList.remove('suspense-rolling'), duration - 20);
  setTimeout(() => {
    c.rolling = false;
    c.scene.classList.remove('die-rolling');
    rollHistory.unshift({ type: 'single', slot: i, label: coinAbbrev(face) });
    trimAndRenderHistory();
  }, duration + 30);
}

function rollAllCoins() {
  const dual = isDual();
  const activeIdx = dual ? [0, 1] : [0];
  if (activeIdx.some(i => coins[i].rolling)) return;

  const btn = document.getElementById('rollBtn');
  btn.disabled = true;
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;
  playSoundIfEnabled();

  const results = {};
  activeIdx.forEach(i => {
    coins[i].rolling = true;
    results[i] = spinCoin(coins[i], suspense);
    recordFrequency(coinLabel(results[i]));
  });
  renderFrequencyChart();

  setTimeout(() => activeIdx.forEach(i => coins[i].scene.classList.remove('suspense-rolling')), duration - 20);
  setTimeout(() => {
    activeIdx.forEach(i => { coins[i].rolling = false; coins[i].scene.classList.remove('die-rolling'); });
    rollHistory.unshift({ type: 'combo', labels: activeIdx.map(i => coinAbbrev(results[i])) });
    trimAndRenderHistory();
    btn.disabled = false;
  }, duration + 30);
}

function rollBatchCoins(n) {
  const dual = isDual();
  const activeIdx = dual ? [0, 1] : [0];
  if (activeIdx.some(i => coins[i].rolling)) return;
  const suspense = isSuspense();
  const duration = suspense ? 3500 : 900;

  const finalFace = {};
  for (let k = 0; k < n; k++) {
    activeIdx.forEach(i => {
      const face = Math.random() < 0.5 ? 'heads' : 'tails';
      recordFrequency(coinLabel(face));
      finalFace[i] = face;
    });
  }
  renderFrequencyChart();
  playSoundIfEnabled();
  activeIdx.forEach(i => { coins[i].rolling = true; spinCoin(coins[i], suspense, finalFace[i]); });
  setTimeout(() => activeIdx.forEach(i => coins[i].scene.classList.remove('suspense-rolling')), duration - 20);
  setTimeout(() => activeIdx.forEach(i => { coins[i].rolling = false; coins[i].scene.classList.remove('die-rolling'); }), duration + 30);
}

/* ── Dispatchers — samma knappar/genvägar styr rätt läge automatiskt ── */
function rollAllActive() { if (isCoinMode()) rollAllCoins(); else rollAllDice(); }
function rollBatch(n) {
  if (n === 1) { rollAllActive(); return; }
  if (isCoinMode()) rollBatchCoins(n); else rollBatchDice(n);
}

function trimAndRenderHistory() {
  if (rollHistory.length > 9) rollHistory.length = 9;
  document.getElementById('history').innerHTML = rollHistory.map(entry => {
    if (entry.type === 'combo') {
      return `<div class="hist-chip">${entry.labels.join('+')}</div>`;
    }
    const color = entry.slot === 0 ? 'var(--die1-ink)' : 'var(--die2-ink)';
    return `<div class="hist-chip" style="color:${color}">${entry.label}</div>`;
  }).join('');
}

/* ── Kom ihåg senaste val (localStorage) — filen körs fristående på
     GitHub Pages, så webbläsarlagring fungerar utan problem här. ── */
const SETTINGS_KEY = 'tarningInstallningar';
function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      mode: isCoinMode() ? 'coin' : 'dice',
      sidesSelect: document.getElementById('sidesSelect').value,
      customSides: document.getElementById('customSides').value,
      count: itemCount,
      suspense: isSuspense(),
      sound: isSoundOn(),
      theme: document.documentElement.getAttribute('data-theme') || 'light'
    }));
  } catch (e) { /* localStorage kan vara blockerad, t.ex. i vissa iframes */ }
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.sidesSelect) document.getElementById('sidesSelect').value = data.sidesSelect;
    if (data.customSides) document.getElementById('customSides').value = data.customSides;
    onSidesChange();
    if (data.count === 1 || data.count === 2) { setCount(data.count); }
    if (typeof data.suspense === 'boolean') { document.getElementById('suspenseToggle').checked = data.suspense; updateSpeedLabel(); }
    if (typeof data.sound === 'boolean') { document.getElementById('soundToggle').checked = data.sound; updateSoundLabel(); }
    if (data.mode === 'coin') { document.getElementById('modeToggle').checked = true; updateMode(); }
    if (data.theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('themeBtn').textContent = '🌙';
    }
  } catch (e) { /* ogiltig eller saknad data — kör bara med standardvärden */ }
}

loadSettings();
renderFrequencyChart();
</script>

</body>
