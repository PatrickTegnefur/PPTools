<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omkrets | Matematikportalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ff; --surface:#fff; --surface2:#eae6ff; --border:#ccc5f0;
  --text:#100e28; --muted:#585078; --accent:#306BF0; --accent2:#EC6095;
  --gradient:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);
  --correct:#18a348; --wrong:#e02020; --shadow:rgba(48,107,240,.12);
  --start:#3aada8; --mal:#c43d75;
  --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
  --shadow-sm:0 2px 8px var(--shadow);
  --font-body: Calibri, 'Atkinson Hyperlegible', sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding-bottom:56px;position:relative;overflow-x:hidden;}
.ambient{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:0;}
.ambient.a1{width:340px;height:340px;background:#66C7C2;top:-80px;left:-80px;}
.ambient.a2{width:380px;height:380px;background:#F4A261;bottom:-100px;right:-60px;}
.ambient.a3{width:300px;height:300px;background:#EC6095;top:40%;right:20%;}
header{background:var(--gradient);padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 4px 24px rgba(0,0,0,.15);}
header h1{margin:0;color:#fff;font-family:'Montserrat',sans-serif;font-size:1.15rem;}
header p{margin:3px 0 0;color:rgba(255,255,255,.9);font-size:.8rem;}
main{max-width:920px;margin:0 auto;padding:18px 16px;position:relative;z-index:1;}
.panels{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start;}
@media(max-width:760px){.panels{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px;}
.card h2{font-family:'Montserrat',sans-serif;font-size:.95rem;margin:0 0 12px;}
.pillbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.pill{border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.78rem;cursor:pointer;min-height:34px;}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sliderrow{margin-bottom:12px;}
.sliderrow label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px;}
.sliderrow label b{color:var(--accent);}
.sliderrow input[type=range]{width:100%;accent-color:var(--accent);}
.togglerow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.togglebtn{border:1.5px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer;}
.togglebtn.on{background:var(--start);color:#fff;border-color:var(--start);}
.svgwrap{background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--radius-sm);display:flex;justify-content:center;padding:10px;}
svg{max-width:100%;height:auto;}
.caption{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px;min-height:34px;}
.solutionbox{font-size:.92rem;line-height:2;}
.sline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:8px;}
.sline input{width:64px;padding:5px 6px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--font-body);font-size:.88rem;text-align:center;}
.sline input.correct{border-color:var(--correct);background:#eafbf0;}
.sline input.wrong{border-color:var(--wrong);background:#fdeaea;}
.formula{font-family:'Montserrat',sans-serif;font-weight:700;text-align:center;background:var(--surface2);border-radius:var(--radius-sm);padding:8px;font-size:1rem;}
.checkbtn{margin-top:8px;border:none;background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:9px 16px;font-weight:700;font-size:.85rem;cursor:pointer;}
.solfeedback{font-weight:700;margin-top:6px;font-size:.85rem;}
.solfeedback.correct{color:var(--correct);} .solfeedback.wrong{color:var(--wrong);}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:14px;position:relative;z-index:1;}
</style>
</head>
<body>
<div class="ambient a1"></div><div class="ambient a2"></div><div class="ambient a3"></div>
<header>
  <h1>⬡ Omkrets</h1>
  <p>Geometri · Summan av alla sidor</p>
</header>
<main>
  <div class="panels">
    <div class="card">
      <h2>Figur</h2>
      <div class="pillbar" id="shapeGroup">
        <div class="pill active" data-shape="rektangel">Rektangel</div>
        <div class="pill" data-shape="kvadrat">Kvadrat</div>
        <div class="pill" data-shape="triangel">Triangel</div>
        <div class="pill" data-shape="cirkel">Cirkel</div>
      </div>

      <div class="sliderrow" id="langdRow"><label>Längd <b id="langdVal"></b></label><input type="range" id="langdSlider" min="2" max="9" value="5"></div>
      <div class="sliderrow" id="breddRow"><label>Bredd <b id="breddVal"></b></label><input type="range" id="breddSlider" min="2" max="9" value="3"></div>
      <div class="sliderrow" id="sidaRow" style="display:none;"><label>Sida <b id="sidaVal"></b></label><input type="range" id="sidaSlider" min="2" max="9" value="4"></div>
      <div class="sliderrow" id="radieRow" style="display:none;"><label>Radie <b id="radieVal"></b></label><input type="range" id="radieSlider" min="2" max="7" value="3"></div>

      <div class="togglerow">
        <button class="togglebtn" id="randomBtn">🎲 Slumpa</button>
      </div>
      <div class="sliderrow">
        <label>Räta ut till sträcka <b id="morphVal">0%</b></label>
        <input type="range" id="morphSlider" min="0" max="100" value="0" step="2">
      </div>

      <div class="svgwrap"><svg id="svg"></svg></div>
      <div class="caption" id="caption"></div>
    </div>

    <div class="card">
      <h2>Lösningsförslag</h2>
      <div class="pillbar" id="modeGroup">
        <div class="pill active" data-mode="facit">Färdig redovisning</div>
        <div class="pill" data-mode="elev">Eleven räknar</div>
      </div>
      <div class="formula" id="formulaBox"></div>
      <div class="solutionbox" id="solutionBox" style="margin-top:12px;"></div>
    </div>
  </div>
  <footer>Matematikportalen · PT Ljus</footer>
</main>
<script>
const NS='http://www.w3.org/2000/svg';
const PI=3.14;
const S={shape:'rektangel',langd:5,bredd:3,sida:4,radie:3,morph:0,mode:'facit'};
const $=id=>document.getElementById(id);
const svg=$('svg');
const fmt=n=>(Math.round(n*100)/100).toLocaleString('sv-SE');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}

function sides(){
  if(S.shape==='rektangel') return [S.langd,S.bredd,S.langd,S.bredd];
  if(S.shape==='kvadrat') return [S.sida,S.sida,S.sida,S.sida];
  if(S.shape==='triangel') return [S.sida,S.sida,S.sida];
  return null; // cirkel hanteras separat
}
function omkrets(){
  if(S.shape==='cirkel') return PI*2*S.radie;
  return sides().reduce((a,b)=>a+b,0);
}

function polygonVertices(){
  const sc=18;
  if(S.shape==='rektangel'||S.shape==='kvadrat'){
    const l=(S.shape==='kvadrat'?S.sida:S.langd)*sc, b=(S.shape==='kvadrat'?S.sida:S.bredd)*sc;
    return [[0,0],[l,0],[l,b],[0,b]];
  }
  // liksidig triangel
  const s=S.sida*sc;
  return [[0,0],[s,0],[s/2,-s*0.866]];
}

function draw(){
  const sc=18, font="Calibri, 'Atkinson Hyperlegible', sans-serif";
  svg.innerHTML='';
  const t=S.morph/100;

  if(S.shape==='cirkel'){
    const r=S.radie*sc, N=28;
    const total=2*PI*r;
    const pad=30, W=Math.max(2*r,total)+2*pad, H=2*r+2*pad+10;
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width',Math.min(W,340)); svg.setAttribute('height',Math.min(H,260));
    const cx=pad+r, cy=pad+r, baseY=cy+r*0.9;
    const pts=[];
    for(let i=0;i<=N;i++){
      const ang=(i/N)*2*Math.PI - Math.PI/2;
      const orig=[cx+r*Math.cos(ang), cy+r*Math.sin(ang)];
      const target=[pad+(i/N)*total, baseY];
      pts.push([orig[0]+(target[0]-orig[0])*t, orig[1]+(target[1]-orig[1])*t]);
    }
    el('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--start)','stroke-width':2.6,'stroke-linecap':'round'});
    if(t<0.05){
      el('line',{x1:cx,y1:cy,x2:cx+r,y2:cy,stroke:'var(--mal)','stroke-width':2,'stroke-dasharray':'4 3'});
      const rl=el('text',{x:cx+r/2,y:cy-6,'text-anchor':'middle','font-size':11,fill:'var(--mal)','font-family':font}); rl.textContent=`r = ${S.radie} cm`;
    } else {
      const lbl=el('text',{x:pad+total/2,y:baseY+20,'text-anchor':'middle','font-size':12,fill:'var(--muted)','font-family':font,'font-weight':'700'});
      lbl.textContent=`Omkrets ≈ ${fmt(total)} cm`;
    }
    $('caption').textContent = 'Cirkelns omkrets är π gånger diametern — "rulla ut" den så ser du att den är drygt 3 diametrar lång.';
    return;
  }

  const sArr=sides(), verts=polygonVertices();
  const total=sArr.reduce((a,b)=>a+b,0)*18;
  const pad=30;
  const minX=Math.min(...verts.map(p=>p[0])), maxX=Math.max(...verts.map(p=>p[0]));
  const minY=Math.min(...verts.map(p=>p[1])), maxY=Math.max(...verts.map(p=>p[1]));
  const W=Math.max(maxX-minX,total)+2*pad, H=(maxY-minY)+2*pad+30;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width',Math.min(W,340)); svg.setAttribute('height',Math.min(H,280));
  const offX=pad-minX, offY=pad-minY, baseY=maxY-minY+pad;

  // bygg (N+1)-punktsväg: polygonens hörn + en upprepning av startpunkten (den "stängande" sidan)
  const path=[...verts.map(p=>[p[0]+offX,p[1]+offY]), [verts[0][0]+offX,verts[0][1]+offY]];
  let cum=0; const cumArr=[0];
  sArr.forEach(s=>{cum+=s*18; cumArr.push(cum);});
  const pts=path.map((p,i)=>{
    const target=[pad+cumArr[i], baseY];
    return [p[0]+(target[0]-p[0])*t, p[1]+(target[1]-p[1])*t];
  });

  if(t<0.03){
    el('polygon',{points:verts.map(p=>[p[0]+offX,p[1]+offY].join(',')).join(' '),fill:'var(--start)','fill-opacity':.14,stroke:'var(--start)','stroke-width':2.4});
  } else {
    el('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--start)','stroke-width':2.6,'stroke-linecap':'round'});
  }
  // sidetiketter vid varje segments mittpunkt (bara i polygonläget)
  if(t<0.5){
    for(let i=0;i<sArr.length;i++){
      const p1=path[i], p2=path[i+1];
      const mx=(p1[0]+p2[0])/2, my=(p1[1]+p2[1])/2;
      const dxn=p2[0]-p1[0], dyn=p2[1]-p1[1], len=Math.hypot(dxn,dyn)||1;
      const nx=-dyn/len*12, ny=dxn/len*12;
      const lb=el('text',{x:mx+nx,y:my+ny,'text-anchor':'middle','font-size':11,fill:'var(--muted)','font-family':font});
      lb.textContent=`${sArr[i]} cm`;
    }
  } else {
    const lbl=el('text',{x:pad+total/2,y:baseY+24,'text-anchor':'middle','font-size':12,fill:'var(--muted)','font-family':font,'font-weight':'700'});
    lbl.textContent=`Omkrets = ${fmt(total/18)} cm`;
  }
  $('caption').textContent = 'Dra i glidaren så "viks sidorna upp" till en rak sträcka — dess längd är omkretsen.';
}

function formulaAndSolution(){
  const box=$('solutionBox');
  const O=omkrets();
  if(S.shape==='rektangel'){
    $('formulaBox').textContent='O = l + b + l + b';
    if(S.mode==='facit') box.innerHTML=`<div class="sline">O = l + b + l + b = ${S.langd}+${S.bredd}+${S.langd}+${S.bredd} cm = <b>${fmt(O)} cm</b></div>`;
    else box.innerHTML=`<div class="sline">Längd = <input id="inL"> cm, Bredd = <input id="inB"> cm</div>
      <div class="sline">O = l+b+l+b = <input id="inO"> cm</div>
      <button class="checkbtn" id="chk">Kolla</button><div class="solfeedback" id="fb"></div>`;
    if(S.mode==='elev') wireCheck([['inL',S.langd],['inB',S.bredd],['inO',O]]);
  } else if(S.shape==='kvadrat'){
    $('formulaBox').textContent='O = s + s + s + s';
    if(S.mode==='facit') box.innerHTML=`<div class="sline">O = 4 · s = 4 · ${S.sida} cm = <b>${fmt(O)} cm</b></div>`;
    else box.innerHTML=`<div class="sline">Sida = <input id="inS"> cm</div>
      <div class="sline">O = 4 · s = <input id="inO"> cm</div>
      <button class="checkbtn" id="chk">Kolla</button><div class="solfeedback" id="fb"></div>`;
    if(S.mode==='elev') wireCheck([['inS',S.sida],['inO',O]]);
  } else if(S.shape==='triangel'){
    $('formulaBox').textContent='O = s + s + s';
    if(S.mode==='facit') box.innerHTML=`<div class="sline">O = 3 · s = 3 · ${S.sida} cm = <b>${fmt(O)} cm</b></div>`;
    else box.innerHTML=`<div class="sline">Sida = <input id="inS"> cm</div>
      <div class="sline">O = 3 · s = <input id="inO"> cm</div>
      <button class="checkbtn" id="chk">Kolla</button><div class="solfeedback" id="fb"></div>`;
    if(S.mode==='elev') wireCheck([['inS',S.sida],['inO',O]]);
  } else {
    $('formulaBox').textContent='O = π · d = π · 2 · r';
    if(S.mode==='facit') box.innerHTML=`<div class="sline">O = π · 2 · r = ${PI} · 2 · ${S.radie} cm = <b>${fmt(O)} cm</b></div>`;
    else box.innerHTML=`<div class="sline">Radie = <input id="inR"> cm</div>
      <div class="sline">O = π · 2 · r = <input id="inO"> cm</div>
      <button class="checkbtn" id="chk">Kolla</button><div class="solfeedback" id="fb"></div>`;
    if(S.mode==='elev') wireCheck([['inR',S.radie],['inO',O]]);
  }
}
function wireCheck(pairs){
  $('chk').onclick=()=>{
    let all=true;
    pairs.forEach(([id,val])=>{const i=$(id); const ok=Math.abs(parseFloat((i.value||'').replace(',','.'))-val)<0.1;
      i.classList.toggle('correct',ok); i.classList.toggle('wrong',!ok&&i.value!==''); if(!ok) all=false;});
    $('fb').textContent = all?'Rätt! 🎉':'Något stämmer inte än — kolla igen.';
    $('fb').className='solfeedback '+(all?'correct':'wrong');
  };
}

function sync(){
  const sh=S.shape;
  $('langdRow').style.display = sh==='rektangel' ? '' : 'none';
  $('breddRow').style.display = sh==='rektangel' ? '' : 'none';
  $('sidaRow').style.display = (sh==='kvadrat'||sh==='triangel') ? '' : 'none';
  $('radieRow').style.display = sh==='cirkel' ? '' : 'none';
  $('langdVal').textContent=S.langd+' cm'; $('langdSlider').value=S.langd;
  $('breddVal').textContent=S.bredd+' cm'; $('breddSlider').value=S.bredd;
  $('sidaVal').textContent=S.sida+' cm'; $('sidaSlider').value=S.sida;
  $('radieVal').textContent=S.radie+' cm'; $('radieSlider').value=S.radie;
}
function all(){ sync(); draw(); formulaAndSolution(); }

document.querySelectorAll('#shapeGroup .pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('#shapeGroup .pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); S.shape=p.dataset.shape; S.morph=0; $('morphSlider').value=0; $('morphVal').textContent='0%'; all();
});
document.querySelectorAll('#modeGroup .pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('#modeGroup .pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); S.mode=p.dataset.mode; formulaAndSolution();
});
['langd','bredd','sida','radie'].forEach(k=>{ $(k+'Slider').oninput=e=>{ S[k]=+e.target.value; all(); }; });
$('morphSlider').oninput=e=>{ S.morph=+e.target.value; $('morphVal').textContent=S.morph+'%'; draw(); };
$('randomBtn').onclick=()=>{
  S.langd=2+Math.floor(Math.random()*8); S.bredd=2+Math.floor(Math.random()*8);
  S.sida=2+Math.floor(Math.random()*8); S.radie=2+Math.floor(Math.random()*6); all();
};
all();
</script>
</body>
</html>
