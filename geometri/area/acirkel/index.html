<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area – cirkel, sektor och båge | Matematikportalen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ff; --surface:#fff; --surface2:#eae6ff; --border:#ccc5f0;
  --text:#100e28; --muted:#585078; --accent:#306BF0; --accent2:#EC6095;
  --gradient:linear-gradient(120deg,#66C7C2 0%,#F4A261 50%,#EC6095 100%);
  --correct:#18a348; --wrong:#e02020; --shadow:rgba(48,107,240,.12);
  --start:#3aada8; --mal:#c43d75;
  --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
  --shadow-sm:0 2px 8px var(--shadow);
  --font-body: Calibri, 'Atkinson Hyperlegible', sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);padding-bottom:56px;position:relative;overflow-x:hidden;}
.ambient{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:0;}
.ambient.a1{width:340px;height:340px;background:#66C7C2;top:-80px;left:-80px;}
.ambient.a2{width:380px;height:380px;background:#F4A261;bottom:-100px;right:-60px;}
.ambient.a3{width:300px;height:300px;background:#EC6095;top:40%;right:20%;}
header{background:var(--gradient);padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 4px 24px rgba(0,0,0,.15);}
header h1{margin:0;color:#fff;font-family:'Montserrat',sans-serif;font-size:1.15rem;}
header p{margin:3px 0 0;color:rgba(255,255,255,.9);font-size:.8rem;}
main{max-width:920px;margin:0 auto;padding:18px 16px;position:relative;z-index:1;}
.panels{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start;}
@media(max-width:760px){.panels{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px;}
.card h2{font-family:'Montserrat',sans-serif;font-size:.95rem;margin:0 0 12px;}
.pillbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.pill{border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.78rem;cursor:pointer;min-height:34px;}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.sliderrow{margin-bottom:12px;}
.sliderrow label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:4px;}
.sliderrow label b{color:var(--accent);}
.sliderrow input[type=range]{width:100%;accent-color:var(--accent);}
.togglerow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.togglebtn{border:1.5px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer;}
.togglebtn.on{background:var(--start);color:#fff;border-color:var(--start);}
.svgwrap{background:var(--bg);border:1.5px dashed var(--border);border-radius:var(--radius-sm);display:flex;justify-content:center;padding:10px;}
svg{max-width:100%;height:auto;}
.caption{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px;min-height:34px;}
.solutionbox{font-size:.92rem;line-height:2;}
.sline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:8px;}
.sline input{width:64px;padding:5px 6px;border:1.5px solid var(--border);border-radius:6px;font-family:var(--font-body);font-size:.88rem;text-align:center;}
.sline input.correct{border-color:var(--correct);background:#eafbf0;}
.sline input.wrong{border-color:var(--wrong);background:#fdeaea;}
.formula{font-family:'Montserrat',sans-serif;font-weight:700;text-align:center;background:var(--surface2);border-radius:var(--radius-sm);padding:8px;margin-bottom:10px;font-size:1rem;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.35;}
.frac .num{padding:0 6px 2px;border-bottom:1.6px solid var(--text);text-align:center;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;}
.frac .den{padding-top:2px;text-align:center;}
.frac input{width:52px !important;}
.checkbtn{margin-top:8px;border:none;background:var(--accent);color:#fff;border-radius:var(--radius-sm);padding:9px 16px;font-weight:700;font-size:.85rem;cursor:pointer;}
.solfeedback{font-weight:700;margin-top:6px;font-size:.85rem;}
.solfeedback.correct{color:var(--correct);} .solfeedback.wrong{color:var(--wrong);}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:14px;position:relative;z-index:1;}
</style>
</head>
<body>
<div class="ambient a1"></div><div class="ambient a2"></div><div class="ambient a3"></div>
<header>
  <h1>◔ Area – cirkel, sektor & båge</h1>
  <p>Geometri · π · r · r</p>
</header>
<main>
  <div class="panels">
    <div class="card">
      <h2>Figur</h2>
      <div class="pillbar" id="modeGroupFig">
        <div class="pill active" data-fig="hel">Hel cirkel</div>
        <div class="pill" data-fig="sektor">Sektor</div>
      </div>
      <div class="sliderrow"><label>Radie <b id="rVal"></b></label><input type="range" id="rSlider" min="2" max="8" value="4"></div>
      <div class="sliderrow" id="vRow" style="display:none;">
        <label>Vinkel <b id="vVal"></b></label><input type="range" id="vSlider" min="10" max="350" value="90" step="5">
      </div>
      <div class="togglerow">
        <button class="togglebtn" id="gridToggle">▦ Rutnät</button>
        <button class="togglebtn" id="unrollToggle">🥧 Visa uppdelning</button>
        <button class="togglebtn" id="randomBtn">🎲 Slumpa</button>
      </div>
      <div class="sliderrow" id="morphRow" style="display:none;">
        <label>Räta ut till rektangel <b id="morphVal">0%</b></label>
        <input type="range" id="morphSlider" min="0" max="100" value="0" step="2">
      </div>
      <div class="svgwrap"><svg id="svg"></svg></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="card">
      <h2>Lösningsförslag</h2>
      <div class="pillbar" id="modeGroup">
        <div class="pill active" data-mode="facit">Färdig redovisning</div>
        <div class="pill" data-mode="elev">Eleven räknar</div>
      </div>
      <div class="formula" id="formulaBox">A = π · r · r</div>
      <div class="solutionbox" id="solutionBox"></div>
    </div>
  </div>
  <footer>Matematikportalen · PT Ljus</footer>
</main>
<script>
const NS='http://www.w3.org/2000/svg';
const PI=3.14;
const S={r:4,fig:'hel',v:90,grid:false,unroll:false,morph:0,mode:'facit'};
const $=id=>document.getElementById(id);
const svg=$('svg');
const fmt=n=>(Math.round(n*100)/100).toLocaleString('sv-SE');
const frac=(n,d)=>`<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}

function draw(){
  const sc=22,r=S.r,cx=140,cy=140,R=r*sc;
  svg.innerHTML='';
  svg.setAttribute('viewBox','0 0 280 280');
  svg.setAttribute('width',280); svg.setAttribute('height',280);
  const defs=el('defs',{});
  const clip=el('clipPath',{id:'ccl'},defs);
  const font="Calibri, 'Atkinson Hyperlegible', sans-serif";

  if(S.unroll){
    const N=12, t=S.morph/100;
    const rowW=PI*r*sc, wedgeW=rowW/N, apothem=R;
    for(let i=0;i<N;i++){
      const a1=(i/N)*2*Math.PI - Math.PI/2, a2=((i+1)/N)*2*Math.PI - Math.PI/2;
      const origApex=[cx,cy], origP1=[cx+R*Math.cos(a1),cy+R*Math.sin(a1)], origP2=[cx+R*Math.cos(a2),cy+R*Math.sin(a2)];
      const x0=40+i*wedgeW, baseY=220, up=(i%2===0);
      const tgtApex=[x0+wedgeW/2, up? baseY-apothem : baseY];
      const tgtP1=[x0, up? baseY : baseY-apothem];
      const tgtP2=[x0+wedgeW, up? baseY : baseY-apothem];
      const lerp=(a,b)=>a+(b-a)*t;
      const pt=(o,g)=>`${lerp(o[0],g[0])},${lerp(o[1],g[1])}`;
      const pts=`${pt(origApex,tgtApex)} ${pt(origP1,tgtP1)} ${pt(origP2,tgtP2)}`;
      el('polygon',{points:pts,fill:i%2? 'var(--mal)':'var(--start)','fill-opacity':.25,stroke:i%2?'var(--mal)':'var(--start)','stroke-width':1.3});
    }
    $('caption').textContent='Cirkeln delas i tunna sektorer och läggs varannan upp/ner i rad. Ju fler och smalare sektorer, desto rakare kanter — till slut en rektangel med bredd ≈ π · r (halva omkretsen) och höjd ≈ r. Det ger A = π · r · r. (Förenklad, schematisk animation.)';
    return;
  }

  if(S.fig==='hel'){
    el('circle',{cx,cy,r:R},clip);
    el('circle',{cx,cy,r:R,fill:'var(--start)','fill-opacity':.15,stroke:'var(--start)','stroke-width':2.5});
    el('line',{x1:cx,y1:cy,x2:cx+R,y2:cy,stroke:'var(--muted)','stroke-width':1.5,'stroke-dasharray':'4 3'});
    const t1=el('text',{x:cx+R/2,y:cy-6,'text-anchor':'middle','font-size':12,fill:'var(--muted)','font-family':font});
    t1.textContent=`r = ${r} cm`;
    $('caption').textContent='Cirkelns area beror bara på radien. π (~3,14) är förhållandet mellan omkrets och diameter för alla cirklar.';
  } else {
    const v=S.v, a2=-Math.PI/2, a1=a2-(v*Math.PI/180);
    const large = v>180?1:0;
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    el('circle',{cx,cy,r:R,fill:'none',stroke:'var(--border)','stroke-width':1.5});
    const sectorPts=`${cx},${cy} ${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z`;
    const path=el('path',{d:`M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} Z`},clip);
    el('path',{d:`M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} Z`,fill:'var(--start)','fill-opacity':.2,stroke:'var(--start)','stroke-width':2.5});
    el('path',{d:`M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}`,fill:'none',stroke:'var(--mal)','stroke-width':3});
    el('line',{x1:cx,y1:cy,x2:x1,y2:y1,stroke:'var(--muted)','stroke-width':1.3,'stroke-dasharray':'3 3'});
    el('line',{x1:cx,y1:cy,x2:x2,y2:y2,stroke:'var(--muted)','stroke-width':1.3,'stroke-dasharray':'3 3'});
    const t1=el('text',{x:cx,y:cy-R-8,'text-anchor':'middle','font-size':12,fill:'var(--mal)','font-family':font});
    t1.textContent='cirkelbåge';
    $('caption').textContent=`Sektorn är ${v}° av cirkelns 360°, det vill säga ${fmt(v/360*100)} % av hela cirkeln.`;
  }

  if(S.grid){
    const pat=el('pattern',{id:'gp',x:cx-R,y:cy-R,width:sc,height:sc,patternUnits:'userSpaceOnUse'},defs);
    el('rect',{width:sc,height:sc,fill:'none',stroke:'var(--accent)','stroke-width':.6},pat);
    el('rect',{x:cx-R,y:cy-R,width:2*R,height:2*R,fill:'url(#gp)','clip-path':'url(#ccl)'});
  }
}

function updateFormula(){
  if(S.fig==='hel'){ $('formulaBox').innerHTML='A = π · r · r'; }
  else { $('formulaBox').innerHTML=`A = ${frac('v','360')} · π · r · r`; }
}

function solution(){
  const r=S.r,v=S.v,box=$('solutionBox');
  const full=PI*r*r;
  if(S.fig==='hel'){
    if(S.mode==='facit'){
      box.innerHTML=`<div class="sline">Radie = ${r} cm</div>
        <div class="sline">Area = π · r · r = ${PI} · ${r} · ${r} cm² = ${PI} · ${r*r} cm² = <b>${fmt(full)} cm²</b></div>`;
    } else {
      box.innerHTML=`<div class="sline">Radie = <input id="inR"> cm</div>
        <div class="sline">Area = π · r · r = ${PI} · <input id="inR1"> · <input id="inR2"> cm² = <input id="inA"> cm²</div>
        <button class="checkbtn" id="chk">Kolla</button><div class="solfeedback" id="fb"></div>`;
      $('chk').onclick=()=>{
        const chk=[['inR',r],['inR1',r],['inR2',r],['inA',full]]; let all=true;
        chk.forEach(([id,val])=>{const i=$(id);const ok=Math.abs(parseFloat(i.value.replace(',','.'))-val)<0.05;
          i.classList.toggle('correct',ok);i.classList.toggle('wrong',!ok&&i.value!=='');if(!ok)all=false;});
        $('fb').textContent=all?'Rätt! 🎉':'Något stämmer inte än — kolla igen.';
        $('fb').className='solfeedback '+(all?'correct':'wrong');
      };
    }
  } else {
    const areaS=full*v/360, boge=2*PI*r*v/360;
    if(S.mode==='facit'){
      box.innerHTML=`<div class="sline">Radie = ${r} cm, vinkel = ${v}°</div>
        <div class="sline">Area = ${frac('v','360')} · π · r · r = ${frac(v,'360')} · ${PI} · ${r} · ${r} cm² = <b>${fmt(areaS)} cm²</b></div>
        <div class="sline">Bågens längd = ${frac('v','360')} · 2 · π · r = ${frac(v,'360')} · 2 · ${PI} · ${r} cm = <b>${fmt(boge)} cm</b></div>`;
    } else {
      box.innerHTML=`<div class="sline">Radie = <input id="inR"> cm, vinkel = <input id="inV">°</div>
        <div class="sline">Sektorns area = ${frac('v','360')} · π · r · r = <input id="inA"> cm²</div>
        <div class="sline">Bågens längd = ${frac('v','360')} · 2 · π · r = <input id="inB"> cm</div>
        <button class="checkbtn" id="chk">Kolla</button><div class="solfeedback" id="fb"></div>`;
      $('chk').onclick=()=>{
        const chk=[['inR',r],['inV',v],['inA',areaS],['inB',boge]]; let all=true;
        chk.forEach(([id,val])=>{const i=$(id);const ok=Math.abs(parseFloat(i.value.replace(',','.'))-val)<0.05;
          i.classList.toggle('correct',ok);i.classList.toggle('wrong',!ok&&i.value!=='');if(!ok)all=false;});
        $('fb').textContent=all?'Rätt! 🎉':'Något stämmer inte än — kolla igen.';
        $('fb').className='solfeedback '+(all?'correct':'wrong');
      };
    }
  }
}

function sync(){
  $('rVal').textContent=S.r+' cm'; $('rSlider').value=S.r;
  $('vVal').textContent=S.v+'°'; $('vSlider').value=S.v;
  $('vRow').style.display=S.fig==='sektor'?'':'none';
  $('morphRow').style.display=S.unroll?'':'none';
}
function all(){sync();updateFormula();draw();solution();}

document.querySelectorAll('#modeGroupFig .pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('#modeGroupFig .pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); S.fig=p.dataset.fig;
  if(S.fig==='sektor'){ S.unroll=false; $('unrollToggle').classList.remove('on'); }
  all();
});
document.querySelectorAll('#modeGroup .pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('#modeGroup .pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active'); S.mode=p.dataset.mode; solution();
});
$('rSlider').oninput=e=>{S.r=+e.target.value;all();};
$('vSlider').oninput=e=>{S.v=+e.target.value;all();};
$('morphSlider').oninput=e=>{S.morph=+e.target.value;$('morphVal').textContent=S.morph+'%';draw();};
$('gridToggle').onclick=e=>{S.grid=!S.grid;e.target.classList.toggle('on',S.grid);draw();};
$('unrollToggle').onclick=e=>{
  S.unroll=!S.unroll; e.target.classList.toggle('on',S.unroll);
  if(S.unroll){ S.fig='hel'; document.querySelectorAll('#modeGroupFig .pill').forEach(x=>x.classList.toggle('active',x.dataset.fig==='hel')); }
  else { S.morph=0; $('morphSlider').value=0; $('morphVal').textContent='0%'; }
  all();
};
$('randomBtn').onclick=()=>{ S.r=2+Math.floor(Math.random()*7); if(S.fig==='sektor') S.v=10+Math.floor(Math.random()*35)*10; all(); };
all();
</script>
</body>
</html>
